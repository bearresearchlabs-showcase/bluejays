    statistically flag outliers that deviate significantly from normal patterns, computes
    quartile distributions to understand typical ranges, and requires at least 2 transactions
    per payment type per day to avoid false positives from insufficient data. A daily
    summary per payment type containing anomaly counts (transactions flag


    Business Value: Aggregated metrics for suspended transaction anomaly detection


