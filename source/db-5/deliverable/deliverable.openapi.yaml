    consecutive days as an acceleration indicator, calculates Q1, median, and Q3 quartiles
    for the distribution, counts outliers beyond 1.5×IQR thresholds, and filters to
    include only location-days with at least 2 transactions to ensure statistical
    validity. A dataset containing one row per location per day with acceleration
    rate, q


    Business Value: Aggregated metrics for sales acceleration rate computation


