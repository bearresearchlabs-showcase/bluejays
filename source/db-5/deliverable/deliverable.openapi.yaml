    Use Case: What are the daily sales statistics by customer, including peak hour
    identification for staffing and quartiles?


    Description: The operations team needs to optimize staff scheduling and promotional
    timing by understanding when different customer segments make purchases throughout
    the day. Peak hour patterns differ by customer type—business customers may shop
    during lunch, families in evenings, and bargain hunters early morning—so aggregate
