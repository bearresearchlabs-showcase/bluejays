    sum of revenue to show total value generated since tracking began, calculates
    the maximum cumulative value reached to date as a high-water mark indicating potential,
    uses these cumulative metrics as proxies for location ''lifetime value'' that
    can be ranked against peers, determines Q1, median, and Q3 quartiles of individual
    t


    Business Value: Aggregated metrics for customer lifetime value estimation


