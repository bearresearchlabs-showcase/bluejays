    month and customer, employs LAG and LEAD window functions to access previous and
    next month values for computing month-over-month changes in both frequency and
    amount, derives trend direction by comparing current values against historical
    patterns, and filters to include only customers with at least 3 months of purchase
    history to ensure statistical relevance. A monthly dataset per customer showing
    gap metrics (difference from prior month), quartile breakdowns (25th, 50th, 75th
    per


    Business Value: Aggregated metrics for invoice gap analysis


    Complexity: challenging


