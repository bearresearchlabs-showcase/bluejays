    Use Case: Can you give me daily performance statistics for each employee, including
    transaction count, quartiles, median, outlier count, and a rolling average?


    Description: Operations managers need daily performance quartiles to benchmark
    employees against each other, identify consistent high performers for recognition,
    and flag statistical outliers who may need coaching, additional training, or investigation
    for compliance issues. Calculate comprehensive daily sales statistics for each
    employee including transaction volume, quartile distribution, median value, outlier
    detection, and smoothed rolling averages. The query groups transactions by date
    and employee_id, uses PERCENTILE_CONT to calculate the first quartile (Q1), median
    (Q2), and third quartile (Q3) for robust distribution analysis, computes a 7-row
    rolling window average to smooth daily volatility, segments performance into septiles
    (seven equal groups) for fine-grained ranking, and intentionally includes single-transaction
    days to accommodate new hires or part-time staff who may have limited activity.
    A dataset showing daily metrics for each employee—transaction


    Business Value: Aggregated metrics for employee performance quartile ranking


    Complexity: challenging


