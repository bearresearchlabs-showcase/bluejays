    Use Case: Give me weekly sales by customer with recency-frequency analysis, quartiles,
    and rolling averages.


    Description: The marketing team needs to segment customers based on their recent
    purchasing activity and frequency to design targeted retention campaigns, loyalty
    rewards, and personalized upsell offers. Recency-frequency analysis is a proven
    method for identifying high-value customers who purchase often versus at-risk
    customers showing declining engagement. Generate weekly sales statistics for each
    customer incorporating recency-frequency metrics, distribution quartiles, and
    smoothed trend indicators. The query groups transaction data by ISO week and customer
    ID, applies ROW_NUMBER window functions partitioned by customer to establish recency
    ordering (how recently each week occurred in the customer''s history), ranks customers
    by cumulative spend to identify top spenders, computes quartile distributions
    for understanding typical purchase amounts, and requires a minimum of 3 weeks
    of activity per customer to ensure meaningful analysis. A weekly dataset per customer


    Business Value: Aggregated metrics for customer recency-frequency analysis


    Complexity: challenging


