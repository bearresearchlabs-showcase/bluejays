    for detailed distribution analysis, and requires at least 2 weekly records per
    payment type to ensure meaningful comparisons while accommodating newly introduced
    payment methods. A dataset showing weekly metrics for each payment type—quartile
    boundaries, count of statistical outliers, and the number of weeks with increasing
    transaction v


    Business Value: Aggregated metrics for payment type revenue distribution


    Complexity: challenging


