    limits analysis to the most recent 100 monthly data points per location to balance
    historical context with current relevance, and requires at least 3 monthly records
    per location to ensure statistical robustness and exclude newly opened stores
    with insuffic


    Business Value: Aggregated metrics for location-based sales velocity


