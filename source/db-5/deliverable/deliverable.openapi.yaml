    data by calendar month and payment type (credit card, debit, cash, digital wallet,
    etc.), computes a rolling average using a window function with ROWS BETWEEN to
    average the current month with preceding months, calculates Q1, median, and Q3
    quartiles to show the distribution of transaction sizes for each payment method,
    and filters to include only payment-type months with at least 2 transactions to
    avoid spurious


    Business Value: Aggregated metrics for time-weighted moving average


    Complexity: challenging


