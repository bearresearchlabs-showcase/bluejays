    Use Case: Show me daily sales metrics for each employee including quartiles, rolling
    averages, and any anomalies that stand out.


    Description: The sales operations team needs to monitor employee performance on
    a daily basis to identify unusual patterns that may indicate data entry errors,
    fraudulent activity, or exceptional performance requiring investigation. Produce
    comprehensive daily sales statistics for each employee that include distribution
    metrics, smoothed trends, and automated anomaly flagging. The query aggregates
    sales data by date and employee ID, extracts temporal features such as hour of
    day and day of week for contextual analysis, computes a 10-row rolling window
    average to smooth short-term fluctuations, calculates z-scores to statistically
    identify outliers beyond normal variance, and handles edge cases where an employee
    has only a single transaction in a day. A dataset containing one row per employee
    per day with quartile distributions (25th, 50th, 75th percentiles), rolling average
    values, anomaly counts flagged by z-score thresholds, and temporal context fields.


    Business Value: Aggregated metrics for hourly sales pattern detection


    Complexity: challenging


