    Use Case: Give me monthly sales by customer with invoice gap analysis, quartiles,
    and trend indicators.


    Description: The customer success team wants to understand how customer purchasing
    behavior changes month-over-month to predict churn risk and identify upsell opportunities.
    Analyzing gaps in purchase frequency and spending amounts between consecutive
