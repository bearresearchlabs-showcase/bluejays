info:
  title: Database db-5 - Database API Specification
  description: 'Lucasa POS database - anonymized retail Point-of-Sale dataset from
    a family business in Kenya. Complete transactional history, inventory management,
    and multi-location operations with phppos schema.


    - Sales transactions and line items

    - Payment records and inventory

    - Product catalog and suppliers

    - eTIMS tax integration support


    - PostgreSQL: Full support

    - , : Compatible with Delta Lake


    ---


    ---


    This section provides a comprehensive data dictionary for all tables in the database,
    including column names, data types, constraints, and descriptions. Tables are
    organized by functional category for easier navigation.


    See `docs/SCHEMA.md` for table relationships. Core phppos tables: people, employees,
    items, locations, location_items, sales.


    ---


    ---


    ---


    This database includes 30 production SQL queries, each designed to solve specific
    business problems for companies with $1M+ ARR. Each query includes:


    - Business Use Case: The specific business problem this query solves

    - Description: Technical explanation of what the query does

    - Client Deliverable: What output or report this query generates

    - Business Value: The business impact and value delivered

    - Complexity: Technical complexity indicators

    - SQL Code: Complete, production-ready SQL query


    ---


    Use Case: Can you show me each employee''s daily sales performance over the past
    year, including their 7-day rolling average and how many of their transactions
    exceeded their personal average?


    Description: Store managers need visibility into daily employee performance to
    identify top performers, coach underperformers, and understand whether individual
    sales representatives are consistently beating their own benchmarks. Calculate
    daily sales metrics per employee including a smoothed 7-day rolling average and
    a count of transactions that exceed each employee''s personal average. The query
    groups transactions by date and employee_id, computes each employee''s overall
    average transaction value, uses a window function with a 7-row frame to calculate
    rolling averages for trend smoothing, counts how many daily transactions exceed
    the employee''s mean, retains the 100 most recent transactions per employee to
    focus on current performance, and excludes days with only a single transaction
    to avoid skewed metrics. A dataset showing daily metrics for each employee—total
    sales, 7-day rolling average, and the number of transactions above their personal
    average—enabling man


    Business Value: Daily aggregated sales metrics with rolling averages and trend
    indicators


    Complexity: challenging


