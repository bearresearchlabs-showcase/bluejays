    gaps, calculates Q1, median, and Q3 quartiles of individual transaction amounts,
    and filters to include only employee-weeks with at least 3 transactions to ensure
    the statistics are meaningful for comparison. A dataset containing one r


    Business Value: Aggregated metrics for cross-location revenue benchmarking


