    Use Case: Can you show me monthly purchase patterns for each customer, including
    quartiles, the count of statistical outliers, and how many transactions show an
    upward trend?


    Description: Marketing and customer success teams need to segment customers by
    spending behavior, identify high-value or erratic spenders, and detect customers
    whose engagement is rising or falling to tailor retention and upsell campaigns.
    Calculate monthly sales statistics for each customer including quartile breakdowns,
    identification of statistical outliers, and detection of upward spending trends.
    The query groups transactions by month and customer_id, computes quartile boundaries
    to segment spending into sextiles (six equal groups), flags outliers using z-scores
    greater than 2 standard deviations from the mean, derives trend direction by comparing
    consecutive month-over-month changes, limits analysis to the most recent 70 data
    points per customer to balance history with relevance, and requires at least 3
    monthly records per customer to ensure statistical validity. A dataset showing
    monthly metrics for each customer—quartile positions, total outlier count, and
    t


    Business Value: Aggregated metrics for customer purchase frequency segmentation


    Complexity: challenging


