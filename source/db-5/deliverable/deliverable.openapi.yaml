    Use Case: Show me daily sales by payment method with anomaly detection and quartile
    breakdowns.


    Description: The finance and fraud prevention teams need to monitor payment method
    usage patterns daily because anomalous behavior—such as sudden spikes in a particular
    payment type or unusual transaction amounts—may signal technical problems with
