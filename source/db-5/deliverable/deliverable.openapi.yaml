    Use Case: Show me monthly sales by employee with cohort-style retention metrics
    and quartiles.


    Description: The human resources and sales management teams want to track how
    employee sales performance evolves over time, similar to customer cohort retention
    analysis, to identify which employees improve with tenure, which plateau, and
    which decline—informing training programs, mentorship assignments, and retention
    strategies. Produce monthly sales statistics for each employee using cohort-style
    analysis techniques that track performance progression, distribution metrics,
    and trend directions. The query aggregates sales by calendar month and employee
    ID, calculates increasing_count metrics to show how many consecutive months an
    employee has maintained or improved performance (analogous to retention cohorts),
    derives trend_direction indicators to classify whether performance is improving
    or declining, computes quartile distributions to benchmark against peers, and
    accommodates single-record months for newly hired employees who lack historical
    data. A monthly summa


    Business Value: Aggregated metrics for multi-period cohort retention


    Complexity: challenging


