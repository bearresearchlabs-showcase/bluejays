info:
  title: Database db-7 - Database API Specification
  description: "This database implements a comprehensive Maritime Shipping Intelligence\
    \ System integrating data from government sources (NOAA, US Coast Guard, MARAD,\
    \ Data.gov) and commercial maritime data providers. Supports vessel tracking,\
    \ port schedules, carrier routes, sailings, port calls, and maritime analytics\
    \ matching Linescape API functionality.\n\n- Vessel Tracking: AIS-based vessel\
    \ position tracking with speed, course, and navigation status\n- Port Intelligence:\
    \ Comprehensive port information with UN/LOCODE, coordinates, and capacity metrics\n\
    - Route Management: Shipping routes and services with port sequences and transit\
    \ times\n- Port Call Tracking: Scheduled and actual port calls with cargo handling\
    \ information\n- Sailing Intelligence: Voyage tracking between ports with transit\
    \ times and capacity utilization\n- Carrier Analytics: Carrier performance metrics\
    \ including on-time performance and vessel utilization\n- Port Statistics: Aggregated\
    \ port performance metrics including vessel calls and container throughput\n-\
    \ Government Data Integration: Integration with NOAA, USCG, MARAD, and Data.gov\
    \ maritime datasets\n- Spatial Operations: Geographic queries using PostGIS GEOGRAPHY\
    \ type for distance calculations and spatial joins\n\n- PostgreSQL: Full support\
    \ with UUID types, arrays, JSONB, and PostGIS for spatial data\n- , : Compatible\
    \ with Delta Lake format\n- , : Full support with VARIANT types\n\n- NOAA: AccessAIS\
    \ Tool for vessel traffic data, MarineCadastre.gov AIS data (2009-2024)\n- US\
    \ Coast Guard: National Vessel Movement Center (NVMC) - NOAD data, Vessel Information\
    \ Verification Service (VIVS) - AIS static data\n- MARAD: U.S.-Flag Fleet data,\
    \ port statistics, waterborne commerce statistics\n- Data.gov: Virginia International\
    \ Gateway vessel schedules, port region grain ocean vessel activity, AIS vessel\
    \ tracks datasets\n\n- Internet-Pulled Data: 4.1 GB from public APIs (Data.gov,\
    \ NOAA, USCG)\n- Transformed Data: Structured metadata and HTML content processed\n\
    - Total Volume: 4.1 GB (exceeds 1 GB minimum requirement)\n\n---\n\n---\n\nThis\
    \ section provides a comprehensive data dictionary for all tables in the database,\
    \ including column names, data types, constraints, and descriptions. Tables are\
    \ organized by functional category for easier navigation.\n\nThe database consists\
    \ of 14 tables organized into logical groups:\n\n1. Core Reference Tables: `carriers`,\
    \ `locations`, `ports`, `vessels`\n2. Route and Service Tables: `routes`, `route_ports`,\
    \ `port_pairs`\n3. Operational Tables: `port_calls`, `sailings`, `voyages`, `voyage_port_calls`\n\
    4. Tracking and Analytics Tables: `vessel_tracking`, `port_statistics`, `carrier_performance`\n\
    \nStores shipping line/carrier information with SCAC codes.\n\nKey Columns:\n\
    - `carrier_id` (VARCHAR(255), PRIMARY KEY) - Unique identifier\n- `carrier_name`\
    \ (VARCHAR(255), NOT NULL) - Full name of shipping line\n- `scac_code` (VARCHAR(10),\
    \ UNIQUE) - Standard Carrier Alpha Code\n- `carrier_type` (VARCHAR(50)) - Container,\
    \ Bulk, RoRo, Tanker, General\n- `fleet_size` (INTEGER) - Total number of vessels\n\
    - `total_capacity_teu` (INTEGER) - Total container capacity\n\nStores port information\
    \ with UN/LOCODE, coordinates, and characteristics.\n\nKey Columns:\n- `port_id`\
    \ (VARCHAR(255), PRIMARY KEY) - Unique identifier\n- `port_name` (VARCHAR(255),\
    \ NOT NULL) - Port name\n- `port_code` (VARCHAR(20), UNIQUE) - UN/LOCODE or port\
    \ code\n- `locode` (VARCHAR(10)) - UN/LOCODE (5 characters: 2 country + 3 location)\n\
    - `latitude` (NUMERIC(10, 7), NOT NULL) - Latitude coordinate\n- `longitude` (NUMERIC(10,\
    \ 7), NOT NULL) - Longitude coordinate\n- `port_geom` (GEOGRAPHY) - Point geometry\
    \ for spatial queries\n- `port_type` (VARCHAR(50)) - Container, Bulk, RoRo, Tanker,\
    \ General, Multi-purpose\n- `container_capacity_teu` (INTEGER) - Container capacity\n\
    - `berth_count` (INTEGER) - Number of berths\n\nStores vessel information with\
    \ IMO numbers, MMSI, and specifications.\n\nKey Columns:\n- `vessel_id` (VARCHAR(255),\
    \ PRIMARY KEY) - Unique identifier\n- `vessel_name` (VARCHAR(255), NOT NULL) -\
    \ Vessel name\n- `imo_number` (VARCHAR(10), UNIQUE) - International Maritime Organization\
    \ number\n- `mmsi` (VARCHAR(9)) - Maritime Mobile Service Identity\n- `carrier_id`\
    \ (VARCHAR(255)) - Foreign key to carriers\n- `vessel_type` (VARCHAR(50)) - Container,\
    \ Bulk, RoRo, Tanker, General Cargo\n- `container_capacity_teu` (INTEGER) - Container\
    \ capacity\n- `length_meters` (NUMERIC(8, 2)) - Vessel length\n- `beam_meters`\
    \ (NUMERIC(8, 2)) - Vessel beam\n- `draft_meters` (NUMERIC(8, 2)) - Vessel draft\n\
    \nStores shipping routes/services operated by carriers.\n\nKey Columns:\n- `route_id`\
    \ (VARCHAR(255), PRIMARY KEY) - Unique identifier\n- `route_name` (VARCHAR(255),\
    \ NOT NULL) - Route name\n- `carrier_id` (VARCHAR(255), NOT NULL) - Foreign key\
    \ to carriers\n- `service_type` (VARCHAR(50)) - Direct, Feeder, Express, Regular\n\
    - `frequency_weeks` (INTEGER) - Service frequency in weeks\n- `transit_time_days`\
    \ (INTEGER) - Average transit time\n\nStores scheduled and actual port calls with\
    \ vessel and port information.\n\nKey Columns:\n- `port_call_id` (VARCHAR(255),\
    \ PRIMARY KEY) - Unique identifier\n- `vessel_id` (VARCHAR(255), NOT NULL) - Foreign\
    \ key to vessels\n- `port_id` (VARCHAR(255), NOT NULL) - Foreign key to ports\n\
    - `scheduled_arrival` (TIMESTAMP) - Scheduled arrival time\n- `actual_arrival`\
    \ (TIMESTAMP) - Actual arrival time\n- `scheduled_departure` (TIMESTAMP) - Scheduled\
    \ departure time\n- `actual_departure` (TIMESTAMP) - Actual departure time\n-\
    \ `port_call_type` (VARCHAR(50)) - Loading, Discharging, Transshipment, Bunkering,\
    \ Repair\n- `containers_loaded` (INTEGER) - Containers loaded\n- `containers_discharged`\
    \ (INTEGER) - Containers discharged\n\nStores sailing/voyage information between\
    \ ports.\n\nKey Columns:\n- `sailing_id` (VARCHAR(255), PRIMARY KEY) - Unique\
    \ identifier\n- `vessel_id` (VARCHAR(255), NOT NULL) - Foreign key to vessels\n\
    - `route_id` (VARCHAR(255)) - Foreign key to routes\n- `origin_port_id` (VARCHAR(255),\
    \ NOT NULL) - Foreign key to ports\n- `destination_port_id` (VARCHAR(255), NOT\
    \ NULL) - Foreign key to ports\n- `scheduled_departure` (TIMESTAMP) - Scheduled\
    \ departure time\n- `actual_departure` (TIMESTAMP) - Actual departure time\n-\
    \ `scheduled_arrival` (TIMESTAMP) - Scheduled arrival time\n- `actual_arrival`\
    \ (TIMESTAMP) - Actual arrival time\n- `transit_days` (INTEGER) - Transit days\n\
    - `distance_nautical_miles` (NUMERIC(10, 2)) - Distance in nautical miles\n- `total_teu`\
    \ (NUMERIC(10, 2)) - Total TEU\n- `capacity_utilization_percent` (NUMERIC(5, 2))\
    \ - Capacity utilization percentage\n\nStores AIS (Automatic Identification System)\
    \ tracking data.\n\nKey Columns:\n- `tracking_id` (VARCHAR(255), PRIMARY KEY)\
    \ - Unique identifier\n- `vessel_id` (VARCHAR(255), NOT NULL) - Foreign key to\
    \ vessels\n- `timestamp` (TIMESTAMP, NOT NULL) - Position timestamp\n- `latitude`\
    \ (NUMERIC(10, 7), NOT NULL) - Latitude coordinate\n- `longitude` (NUMERIC(10,\
    \ 7), NOT NULL) - Longitude coordinate\n- `position_geom` (GEOGRAPHY) - Point\
    \ geometry for spatial queries\n- `speed_knots` (NUMERIC(6, 2)) - Speed in knots\n\
    - `course_degrees` (NUMERIC(6, 2)) - Course in degrees\n- `heading_degrees` (NUMERIC(6,\
    \ 2)) - Heading in degrees\n- `navigation_status` (VARCHAR(50)) - Under way, At\
    \ anchor, Moored, etc.\n- `destination` (VARCHAR(255)) - Destination port\n- `eta`\
    \ (TIMESTAMP) - Estimated time of arrival\n\n---\n\n---\n\n---\n\nThis database\
    \ includes 30 production SQL queries, each designed to solve specific business\
    \ problems for companies with $1M+ ARR. Each query includes:\n\n- Business Use\
    \ Case: The specific business problem this query solves\n- Description: Technical\
    \ explanation of what the query does\n- Client Deliverable: What output or report\
    \ this query generates\n- Business Value: The business impact and value delivered\n\
    - Complexity: Technical complexity indicators\n- SQL Code: Complete, production-ready\
    \ SQL query\n\n---\n\nUse Case: Can you show me a comprehensive vessel position\
    \ tracking analysis that uses advanced SQL techniques like multi-level CTEs and\
    \ temporal analytics to monitor our fleet?\n\nDescription: Situation: Our maritime\
    \ shipping operations rely on real-time tracking data stored across vessel_tracking,\
    \ port_calls, sailings, and carriers tables. Fleet managers need visibility into\
    \ vessel positions, movements, and navigation status to ensure operational safety\
    \ and efficiency. Current manual tracking methods are time-consuming and lack\
    \ the depth needed for proactive decision-making. Task: Generate a production-grade\
    \ vessel position tracking report that displays current positions, speeds, courses,\
    \ route deviations from planned paths, and real-time navigation status for all\
    \ active vessels. Action: The query employs multi-level CTEs to structure complex\
    \ calculations, starting with base vessel data extraction, then layering temporal\
    \ analytics using window functions to compute rolling averages for speed and course\
    \ changes. It groups vessels by operational status and route, calculates aggregate\
    \ metrics including quartiles for performance distribution, applies LAG/LEAD functions\
    \ for compa\n\nBusiness Value: Vessel position tracking report with current positions,\
    \ speeds, courses, route deviations, and navigation status for active vessels.\n\
    \nComplexity: moderate\n\n---\n\nUse Case: Can you provide a port call performance\
    \ analysis that identifies delays and calculates on-time performance metrics across\
    \ our port network?\n\nDescription: Situation: Port operations teams manage dozens\
    \ of port calls daily across multiple terminals, with data captured in vessel_tracking,\
    \ port_calls, sailings, and carriers tables. Delays at ports create cascading\
    \ effects on supply chains, and management needs quantifiable metrics to identify\
    \ bottlenecks and improve turnaround times. Currently, delay analysis is performed\
    \ manually and lacks standardization across ports. Task: Create a comprehensive\
    \ port call performance report that calculates delay metrics, on-time performance\
    \ rates, vessel dwell times at berth, and assigns operational efficiency classifications\
    \ to each port facility. Action: The query groups port calls by port identifier\
    \ and time period, computing aggregate delay statistics by comparing actual versus\
    \ scheduled arrival and departure times. Window functions calculate rolling on-time\
    \ performance percentages over trailing periods for trend analysis. Quartile calculations\
    \ identify performance distribution across ports. The quer\n\nBusiness Value:\
    \ Port call performance report with delay metrics, on-time performance rates,\
    \ dwell times, and operational efficiency classifications.\n\nComplexity: moderate\n\
    \n---\n\nUse Case: Can you generate a route optimization analysis that compares\
    \ transit times and benchmarks performance across multiple carriers?\n\nDescription:\
    \ Situation: The logistics planning team manages shipping routes across multiple\
    \ carriers, with operational data stored in vessel_tracking, port_calls, sailings,\
    \ and carriers tables. Rising fuel costs and customer demands for faster delivery\
    \ require data-driven route optimization. Currently, route selection relies on\
    \ historical knowledge rather than systematic analysis of transit times, distances,\
    \ and carrier reliability across comparable routes. Task: Produce a route optimization\
    \ report that analyzes transit times, calculates voyage distances, computes efficiency\
    \ metrics such as speed-to-distance ratios, and enables carrier performance comparisons\
    \ across major origin-destination pairs. Action: The query groups sailings by\
    \ route (origin and destination port pairs) and carrier, calculating aggregate\
    \ statistics for transit duration, nautical distance, and average vessel speed.\
    \ Window functions enable carrier benchmarking by computing percentile rankings\
    \ within each route. CTEs structure th\n\nBusiness Value: Route optimization report\
    \ with transit times, distances, efficiency metrics, and carrier performance comparisons.\n\
    \nComplexity: moderate\n\n---\n\nUse Case: Can you create a carrier performance\
    \ metrics report that analyzes on-time performance and generates reliability scores\
    \ for each shipping line?\n\nDescription: Situation: The procurement team evaluates\
    \ carrier contracts annually using data from vessel_tracking, port_calls, sailings,\
    \ and carriers tables. Contract renewals and carrier selection decisions require\
    \ objective performance metrics, but current evaluation processes rely on subjective\
    \ assessments rather than quantitative analysis. Management needs standardized\
    \ reliability scores and performance rankings to negotiate better terms and allocate\
    \ cargo to the most dependable carriers. Task: Build a comprehensive carrier performance\
    \ report that calculates on-time performance rates, vessel utilization percentages,\
    \ capacity metrics (TEU carried vs. available), generates reliability scores based\
    \ on multiple performance dimensions, and ranks carriers competitively within\
    \ service lanes. Action: The query groups data by carrier identifier and service\
    \ lane, computing aggregate metrics for schedule adherence by comparing actual\
    \ versus planned arrival times. Window functions calculate rolling on-time\n\n\
    Business Value: Carrier performance report with on-time performance rates, vessel\
    \ utilization, capacity metrics, reliability scores, and performance rankings.\n\
    \nComplexity: moderate\n\n---\n\nUse Case: Can you aggregate port statistics to\
    \ analyze container throughput and calculate operational efficiency metrics for\
    \ our port facilities?\n\nDescription: Situation: Port authority managers oversee\
    \ operations across multiple terminals, with activity data captured in vessel_tracking,\
    \ port_calls, sailings, and carriers tables. Stakeholders require regular reporting\
    \ on port performance to justify infrastructure investments, optimize berth allocation,\
    \ and demonstrate capacity utilization to potential customers. Currently, statistics\
    \ are compiled manually from disparate sources, leading to delayed reporting and\
    \ inconsistent metrics across terminals. Task: Generate a comprehensive port statistics\
    \ report that aggregates vessel call volumes, calculates total container throughput\
    \ (TEUs handled), computes berth utilization rates as a percentage of available\
    \ time, and derives operational efficiency metrics comparing throughput to handling\
    \ time. Action: The query groups port call data by port identifier and terminal,\
    \ aggregating total vessel calls over the reporting period. It sums container\
    \ volumes (TEUs) from sailing records joined to port calls.\n\nBusiness Value:\
    \ Port statistics report with vessel calls, container throughput, berth utilization,\
    \ and operational efficiency metrics.\n\nComplexity: moderate\n\n---\n\nUse Case:\
    \ Can you generate a sailing capacity utilization analysis that helps us optimize\
    \ vessel deployment across our fleet?\n\nDescription: Situation: Our maritime\
    \ shipping operations team needs to maximize fleet efficiency and identify underutilized\
    \ vessels. The vessel_tracking, port_calls, sailings, and carriers tables contain\
    \ real-time vessel positions, historical port call records, sailing performance\
    \ metrics, and carrier information that can reveal capacity gaps and optimization\
    \ opportunities. Task: Generate a comprehensive capacity utilization report showing\
    \ vessel utilization rates by vessel and route, route efficiency metrics comparing\
    \ planned versus actual performance, and actionable optimization recommendations\
    \ for vessel redeployment. Action: The query joins vessel_tracking with port_calls\
    \ and sailings to link position data with journey records, groups results by vessel,\
    \ carrier, and route dimensions, computes aggregate metrics including average\
    \ utilization percentages and efficiency ratios, applies window functions to calculate\
    \ rolling averages for trend analysis and comparative metrics across vessels,\
    \ uses qua\n\nBusiness Value: Capacity utilization report with vessel utilization\
    \ rates, route efficiency metrics, and optimization recommendations.\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: Can you provide a multi-port route analysis that\
    \ detects transshipment points and identifies opportunities for route path optimization?\n\
    \nDescription: Situation: Our network planning team needs to understand complex\
    \ multi-leg shipping routes and identify inefficient transshipment patterns that\
    \ increase costs and transit times. The vessel_tracking, port_calls, sailings,\
    \ and carriers tables capture sequential port visits, vessel movements, and carrier\
    \ routing patterns that reveal the actual paths cargo takes through our network.\
    \ Task: Generate a multi-port route report showing complete route paths from origin\
    \ to destination, identified transshipment points where cargo changes vessels,\
    \ connectivity analysis measuring how well ports are linked, and path optimization\
    \ recommendations to reduce legs and improve efficiency. Action: The query joins\
    \ port_calls with sailings to construct sequential port visit chains, uses window\
    \ functions with LAG and LEAD to identify transshipment events where vessels change\
    \ mid-route, groups by origin-destination port pairs and intermediate stops, computes\
    \ aggregate metrics including average number of legs, t\n\nBusiness Value: Multi-port\
    \ route report with route paths, transshipment points, connectivity analysis,\
    \ and path optimization recommendations.\n\nComplexity: challenging\n\n---\n\n\
    Use Case: Can you show me vessel utilization analysis across different carriers\
    \ with fleet performance comparisons?\n\nDescription: Situation: Our carrier management\
    \ and procurement teams need to evaluate vessel performance across multiple carrier\
    \ partners to inform contract negotiations and identify underperforming assets.\
    \ The vessel_tracking, port_calls, sailings, and carriers tables contain vessel\
    \ activity data, capacity information, and carrier assignments that enable cross-carrier\
    \ performance benchmarking. Task: Generate a vessel utilization report showing\
    \ utilization rates for each vessel grouped by carrier, comparative vessel performance\
    \ metrics including on-time performance and capacity usage, and identified optimization\
    \ opportunities where vessels are underutilized or misallocated. Action: The query\
    \ joins vessels with their carriers and links to sailings and port_calls to calculate\
    \ activity levels, groups results by carrier and vessel dimensions, computes aggregate\
    \ metrics including utilization percentages based on capacity versus actual load,\
    \ calculates performance indicators like schedule adherence and t\n\nBusiness\
    \ Value: Vessel utilization report with utilization rates across carriers, vessel\
    \ performance metrics, and optimization opportunities.\n\nComplexity: moderate\n\
    \n---\n\nUse Case: Can you provide port pair demand analysis with trade flow intelligence\
    \ and emerging market trends?\n\nDescription: Situation: Our commercial strategy\
    \ and business development teams need to understand trade lane demand patterns\
    \ and identify high-growth corridors for service expansion. The vessel_tracking,\
    \ port_calls, sailings, and carriers tables capture origin-destination flows,\
    \ cargo volumes, and historical trends that reveal market dynamics and emerging\
    \ opportunities. Task: Generate a port pair demand report showing total trade\
    \ volumes for each origin-destination port pair, demand trends analyzing growth\
    \ or decline over recent periods, and market opportunity analysis identifying\
    \ underserved lanes and high-potential corridors. Action: The query joins port_calls\
    \ with sailings to identify origin and destination port pairs for each voyage,\
    \ groups results by port pair dimensions, computes aggregate metrics including\
    \ total shipments, total cargo volume, and average load per sailing, applies window\
    \ functions to calculate period-over-period growth rates and moving averages for\
    \ trend detection, uses quart\n\nBusiness Value: Port pair demand report with\
    \ trade volumes, demand trends, and market opportunity analysis.\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: Can you generate a voyage completion rate analysis\
    \ with port call success metrics and delay root cause analysis?\n\nDescription:\
    \ Situation: Our operations and service reliability teams need to understand why\
    \ voyages are delayed or fail to complete successfully and which ports or routes\
    \ have the highest success rates. The vessel_tracking, port_calls, sailings, and\
    \ carriers tables contain voyage status information, port call timestamps, delay\
    \ records, and completion indicators that enable reliability analysis and root\
    \ cause investigation. Task: Generate a voyage completion report showing overall\
    \ completion rates by route and carrier, port call success metrics measuring on-time\
    \ arrival and departure performance, and detailed delay root cause analysis categorizing\
    \ reasons for failures and delays. Action: The query joins sailings with port_calls\
    \ to match planned voyages with actual port visit outcomes, calculates completion\
    \ status by comparing actual versus scheduled arrivals, groups results by route,\
    \ carrier, and port dimensions, computes aggregate metrics including completion\
    \ percentages, on-time performance rates,\n\nBusiness Value: Voyage completion\
    \ report with completion rates, port call success metrics, and delay root cause\
    \ analysis.\n\nComplexity: moderate\n\n---\n\nUse Case: Can you generate a comprehensive\
    \ carrier route performance analysis that includes service quality metrics and\
    \ shows how each carrier compares against competitors?\n\nDescription: Situation:\
    \ Maritime shipping operations managers need to evaluate carrier performance across\
    \ different routes to make informed decisions about carrier partnerships and contract\
    \ negotiations. The vessel_tracking, port_calls, sailings, and carriers tables\
    \ contain historical vessel positions, port visit records, sailing schedule data,\
    \ and carrier information that enable comprehensive performance analysis. Task:\
    \ Generate a carrier route performance report that benchmarks service quality\
    \ metrics against competitors and identifies optimization opportunities for each\
    \ route. Action: The query joins carrier, sailings, port_calls, and vessel_tracking\
    \ tables to aggregate performance metrics by carrier and route. It computes service\
    \ quality indicators such as on-time delivery rates, average transit times, and\
    \ schedule adherence percentages. Window functions calculate competitive rankings\
    \ and market share by route, while quartile analysis identifies top and bottom\
    \ performers. The query handles NULL\n\nBusiness Value: Carrier route performance\
    \ report with service quality metrics, competitive positioning, and route optimization\
    \ recommendations.\n\nComplexity: moderate\n\n---\n\nUse Case: Can you provide\
    \ a vessel tracking and position analysis that detects route deviations and identifies\
    \ opportunities for speed optimization?\n\nDescription: Situation: Fleet operations\
    \ teams monitor vessel movements in real-time to ensure vessels follow optimal\
    \ routes and maintain efficient speeds for fuel economy and schedule adherence.\
    \ The vessel_tracking table records GPS positions with timestamps, while sailings\
    \ and port_calls tables provide planned route information and destination details.\
    \ Discrepancies between actual and planned routes indicate inefficiencies or issues\
    \ requiring intervention. Task: Create a vessel tracking report that identifies\
    \ vessels deviating from planned routes, analyzes speed patterns against optimal\
    \ ranges, and recommends corrective actions. Action: The query retrieves vessel\
    \ positions from vessel_tracking and joins with sailings to compare actual trajectories\
    \ against planned routes using geospatial calculations. It computes deviation\
    \ distances and flags vessels exceeding threshold limits. Window functions analyze\
    \ speed patterns over rolling time periods to identify excessive speed variations\
    \ or suboptimal sp\n\nBusiness Value: Vessel tracking report with positions, route\
    \ deviations, speed patterns, and optimization recommendations.\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: Can you analyze port capacity utilization with\
    \ berth efficiency metrics and identify congestion patterns that need attention?\n\
    \nDescription: Situation: Port authorities and terminal operators need to maximize\
    \ berth utilization while minimizing vessel waiting times and congestion. The\
    \ port_calls table records vessel arrivals, departures, and berth assignments,\
    \ while vessel_tracking provides approach and departure movement data. Understanding\
    \ capacity utilization patterns helps identify bottlenecks and optimize berth\
    \ allocation strategies. Task: Produce a port capacity report that calculates\
    \ utilization rates, measures berth efficiency, detects congestion periods, and\
    \ recommends optimization strategies for each port facility. Action: The query\
    \ aggregates port_calls data by port and berth, calculating occupancy rates as\
    \ the ratio of berth-occupied time to total available time. It computes turnaround\
    \ time metrics, average waiting times, and throughput volumes per berth. Window\
    \ functions identify peak congestion periods by comparing rolling average utilization\
    \ against capacity thresholds. The query groups by port, berth, and tim\n\nBusiness\
    \ Value: Port capacity report with utilization rates, berth efficiency, congestion\
    \ patterns, and optimization recommendations.\n\nComplexity: moderate\n\n---\n\
    \nUse Case: Can you assess sailing schedule reliability by analyzing on-time performance\
    \ metrics and measuring overall service consistency across routes?\n\nDescription:\
    \ Situation: Shippers and logistics providers require reliable sailing schedules\
    \ to plan supply chain operations and meet customer commitments. The sailings\
    \ table contains scheduled departure and arrival times, while port_calls records\
    \ actual vessel movements, enabling calculation of schedule adherence and delay\
    \ patterns. Consistent on-time performance is a critical service quality indicator\
    \ affecting carrier selection and customer satisfaction. Task: Create a sailing\
    \ schedule reliability report that measures on-time performance, analyzes schedule\
    \ adherence patterns, quantifies delay frequency and magnitude, and assesses overall\
    \ service consistency. Action: The query joins sailings with port_calls to compare\
    \ scheduled versus actual departure and arrival times for each voyage. It calculates\
    \ delay durations, categorizes delays by severity thresholds, and computes on-time\
    \ performance percentages by carrier, route, and time period. Window functions\
    \ track rolling performance trends and identi\n\nBusiness Value: Sailing schedule\
    \ reliability report with on-time performance metrics, schedule adherence, and\
    \ service consistency analysis.\n\nComplexity: moderate\n\n---\n\nUse Case: Can\
    \ you analyze carrier market share across different routes and assess their competitive\
    \ positioning and route dominance patterns?\n\nDescription: Situation: Maritime\
    \ industry analysts and business development teams need to understand competitive\
    \ dynamics across trade routes to identify market opportunities and assess competitive\
    \ threats. The carriers, sailings, and port_calls tables contain carrier identifications,\
    \ scheduled services, and actual voyage data that enable calculation of market\
    \ share and competitive positioning metrics. Understanding which carriers dominate\
    \ specific routes informs strategic decisions about market entry, capacity deployment,\
    \ and competitive responses. Task: Produce a carrier market share report that\
    \ calculates each carrier's market share by route, ranks competitive positions,\
    \ identifies dominant players, and measures market concentration levels. Action:\
    \ The query aggregates sailings and port_calls data by carrier and route (defined\
    \ as origin-destination port pairs), counting voyages or calculating capacity\
    \ deployment as market share metrics. It computes each carrier's percentage share\
    \ of total route\n\nBusiness Value: Carrier market share report with market share\
    \ by route, competitive positioning, and route dominance analysis.\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: Can you show me a vessel route efficiency analysis\
    \ that includes fuel optimization metrics and transit time benchmarking?\n\nDescription:\
    \ Situation: Maritime shipping operations managers need to optimize vessel routes\
    \ to reduce operational costs and improve delivery times. The vessel_tracking\
    \ table contains real-time GPS positions, port_calls records arrival and departure\
    \ times at each port, sailings captures scheduled and actual voyage data, and\
    \ carriers maintains fleet information. Rising fuel costs and customer demands\
    \ for faster delivery require data-driven route optimization. Task: Generate a\
    \ comprehensive vessel route efficiency report that calculates efficiency metrics,\
    \ identifies fuel optimization opportunities, and benchmarks transit times against\
    \ historical and industry standards. Action: The query joins vessel_tracking,\
    \ port_calls, and sailings tables to construct complete voyage paths. It groups\
    \ data by route (origin-destination pairs) and vessel type to compute aggregate\
    \ metrics including average fuel consumption per nautical mile, total transit\
    \ time, and distance covered. Window functions calculate rolling\n\nBusiness Value:\
    \ Vessel route efficiency report with efficiency metrics, fuel optimization, and\
    \ transit time benchmarking.\n\nComplexity: moderate\n\n---\n\nUse Case: Can you\
    \ show me a port call sequence optimization analysis with multi-port voyage planning\
    \ and dwell time minimization?\n\nDescription: Situation: Shipping lines operate\
    \ complex multi-port voyages where the sequence of port calls directly impacts\
    \ overall voyage efficiency and profitability. The port_calls table logs each\
    \ vessel's arrival, departure, and dwell time at ports, while sailings contains\
    \ voyage schedules and actual performance data. Excessive port dwell time increases\
    \ voyage duration and costs, while suboptimal sequencing leads to unnecessary\
    \ backtracking and fuel waste. Operations planners need analytical insights to\
    \ redesign calling patterns. Task: Generate a port call sequence optimization\
