info:
  title: Database db-14 - Database API Specification
  description: "This database provides comprehensive cloud instance cost analysis\
    \ and optimization across AWS, GCP, and Azure. The database enables cost optimization,\
    \ cross-cloud comparisons, and intelligent recommendations for cloud infrastructure\
    \ decisions. It includes instance specifications, pricing data, performance metrics,\
    \ historical pricing trends, and cost optimization recommendations.\n\n- Multi-Cloud\
    \ Support: Comprehensive data for AWS, GCP, and Azure instances\n- Pricing Models:\
    \ On-demand, reserved instances, spot instances, and savings plans\n- Performance\
    \ Metrics: CoreMark scores, FFmpeg FPS, and other benchmark data\n- Historical\
    \ Pricing: Track pricing changes over time for trend analysis\n- Cost Optimization:\
    \ AI-generated recommendations for cost savings\n- Cross-Provider Comparisons:\
    \ Instance matching and comparison matrices\n- Regional Analysis: Pricing variations\
    \ across regions and availability zones\n\n- PostgreSQL: Full support with standard\
    \ SQL features\n- , : Compatible with Delta Lake and standard SQL\n- , : Full\
    \ support with standard SQL features\n\n- Vantage.sh: Comprehensive cloud instance\
    \ comparison with performance benchmarks\n- Infracost Cloud Pricing API: GraphQL\
    \ API with 3M+ prices\n- CloudPrice Developer Portal: Unified pricing APIs\n-\
    \ AWS APIs: Price List API, EC2 Describe Instances API\n- Azure APIs: Retail Prices\
    \ API, VM Sizes API\n- GCP APIs: Billing Catalog API, Compute Machine Types API\n\
    - Data.gov: Federal cloud spending datasets\n\n---\n\n---\n\nThis section provides\
    \ a comprehensive data dictionary for all tables in the database, including column\
    \ names, data types, constraints, and descriptions. Tables are organized by functional\
    \ category for easier navigation.\n\nThe database consists of 11 tables organized\
    \ into logical groups:\n\n1. Provider Metadata: `cloud_providers`, `cloud_regions`,\
    \ `instance_families`\n2. Instance Data: `cloud_instances`, `instance_performance_metrics`\n\
    3. Pricing Data: `instance_pricing`, `historical_pricing`\n4. Optimization: `cost_optimization_recommendations`,\
    \ `instance_comparison_matrix`\n5. Analytics: `cost__analytics`\n6. Operations:\
    \ `data_extraction_log`\n\n---\n\n---\n\n---\n\nThis database includes 30 production\
    \ SQL queries, each designed to solve specific business problems for companies\
    \ with $1M+ ARR. Each query includes:\n\n- Business Use Case: The specific business\
    \ problem this query solves\n- Description: Technical explanation of what the\
    \ query does\n- Client Deliverable: What output or report this query generates\n\
    - Business Value: The business impact and value delivered\n- Complexity: Technical\
    \ complexity indicators\n- SQL Code: Complete, production-ready SQL query\n\n\
    ---\n\nUse Case: Cloud Cost Optimization - Cross-Cloud Instance Right-Sizing Analysis\
    \ for Enterprise Migration Planning\n\nDescription: Enterprise-level multi-provider\
    \ cost-performance analysis using recursive CTE for instance matching across AWS,\
    \ Azure, and GCP, with complex aggregations, window functions, percentile calculations,\
    \ and cross-cloud optimization recommendations. Demonstrates production patterns\
    \ used by cloud cost optimization platforms.\n\nBusiness Value: Comprehensive\
    \ cost-performance comparison report showing optimal instance selections across\
    \ all three major cloud providers with cost savings projections, performance benchmarks,\
    \ and migration recommendations. Helps enterprises identify cost savings opportunities\
    \ during cloud migrations.\n\nPurpose: Identifies the most cost-effective instance\
    \ configurations across AWS, Azure, and GCP by matching instances with similar\
    \ specifications and comparing their cost-performance ratios, enabling data-driven\
    \ cloud provider selection.\n\nComplexity: Recursive CTE for instance matching,\
    \ 8+ nested CTEs, complex aggregations, window functions with multiple frame clauses,\
    \ percentile calculations, cross-provider comparisons, cost optimization algorithms\n\
    \nExpected Output: Report showing matched instances across providers with cost\
    \ savings, performance metrics, and optimization recommendations\n\n---\n\nUse\
    \ Case: Cloud Cost Forecasting - Historical Pricing Trend Analysis with Recursive\
    \ CTE and Multi-Period Forecasting\n\nDescription: Enterprise-level historical\
    \ pricing trend analysis with recursive cte and multi-period forecasting with\
    \ Recursive CTE for time-series analysis, 8+ nested CTEs. Demonstrates production\
    \ patterns for cloud cost .\n\nBusiness Value: Historical Pricing Trend Analysis\
    \ with Recursive CTE and Multi-Period Forecasting report showing cost  metrics\
    \ and recommendations.\n\nPurpose: Provides historical pricing trend analysis\
    \ with recursive cte and multi-period forecasting to enable data-driven cloud\
    \ cost decisions.\n\nComplexity: Recursive CTE for time-series analysis, 8+ nested\
    \ CTEs, window functions with multiple frame clauses, complex aggregations, percentile\
    \ calculations\nExpected Output: Query results with detailed cost  metrics\n\n\
    ---\n\nUse Case: Cloud Cost Optimization - Reserved Instance ROI Analysis with\
    \ Multi-Year Projections\n\nDescription: Enterprise-level reserved instance roi\
    \ analysis with multi-year projections with 8+ nested CTEs, financial calculations.\
    \ Demonstrates production patterns for cloud cost .\n\nBusiness Value: Reserved\
    \ Instance ROI Analysis with Multi-Year Projections report showing cost  metrics\
    \ and recommendations.\n\nPurpose: Provides reserved instance roi analysis with\
    \ multi-year projections to enable data-driven cloud cost decisions.\n\nComplexity:\
    \ 8+ nested CTEs, financial calculations, window functions with multiple frame\
    \ clauses, complex aggregations, percentile calculations\nExpected Output: Query\
