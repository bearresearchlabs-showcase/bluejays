    Use Case: I need daily model ID statistics broken down by user bucket, including
    quartiles, rolling averages, and outlier detection to monitor flight regime behavior.


    Description: Flight operations teams monitor model ID patterns across different
    user buckets to identify anomalies that may indicate issues in specific flight
    regimes or operational conditions. Generate daily model ID statistics segmented
    by user_id that include quartile distributions, rolling averages for trend analysis,
    and automated outlier detection. The query groups records by calendar day and
    user_id, extracts temporal features (hour and day-of-week) for intermediate analysis,
    calculates z-scores to identify statistical outliers (handling zero standard deviation
    cases by defaulting to zero to prevent division errors), computes a 5-row rolling
    window average to smooth short-term fluctuations, and filters to include only
    groups with at least 2 records to ensure statistical validity. A dataset containing
    daily metrics for each user_id, including first/third quartiles, 5-period moving
    average, and count of outlier observations exceeding 2 standard deviations.


    Business Value: Aggregated metrics grouped by day and user_id


    Complexity: moderate


