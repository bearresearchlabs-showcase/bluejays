    Use Case: Show me weekly altitude metrics for each aircraft model—record count,
    quartiles, standard deviation, and how many readings are increasing.


    Description: Weekly views per aircraft model allow fleet operators to compare
    altitude variability (measured by standard deviation) and trend direction across
    the entire fleet, helping prioritize models that show unusual dispersion or consistent
    upward drift. Produce weekly altitude metrics for each aircraft model, including
    record count, quartiles, standard deviation, and count of readings trending upward.
    The query groups telemetry by week and model name, computes standard deviation
    to quantify altitude dispersion and variability, counts readings classified as
    Increasing by comparing each to the prior value, limits the dataset to the 60
    most recent points per model to manage memory, and ranks models by cumulative
    sum to prioritize those with the largest total altitude changes for investigation.
    Weekly metrics per aircraft model containing record count, quartiles (Q1, median,
    Q3), standard deviation, and the number of readings that are trending upward.


    Business Value: Aggregated metrics grouped by week and name


    Complexity: moderate


