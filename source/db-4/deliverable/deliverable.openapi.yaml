    Description: Daily breakdowns by flight phase (such as cruise, climb, or descent)
    help analysts identify whether certain operational regimes exhibit more altitude
    anomalies, which may indicate autopilot issues, turbulence, or non-standard procedures.
    Produce daily altitude statistics segmented by flight phase, including outlier
    count, count of increasing-trend readings, and the peak cumulative sum of altitude
    changes. The query groups telemetry by day and flight phase, computes a running
    cumulative sum of altitude per phase to track total vertical movement, applies
    a 7-row rolling window to smooth noise, segments altitude into octiles (eight
    quantile bins) for distribution analysis, and derives trend direction by comparing
    each reading to the previous one using a window function. When the prior value
    is missing (e.g., first record in a phase), it treats the reading as Stable. Daily
    metrics per flight phase showing outlier count, number of readings classified
    as incr


