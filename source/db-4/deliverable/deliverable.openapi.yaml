    Use Case: Give me monthly altitude summaries for each aircraft model—quartiles,
    median, outlier count, and the rolling average.


    Description: Fleet managers require monthly reporting to track long-term altitude
    trends per aircraft model and identify seasonal patterns or gradual shifts that
    may indicate systemic issues or operational changes. Produce monthly altitude
    summaries for each aircraft model, including quartiles, median, outlier count,
    and a rolling average. The query groups telemetry by month and model name, uses
    PERCENTILE_CONT to calculate Q1, median, and Q3, computes a 6-row rolling average
    to smooth monthly fluctuations, limits the dataset to the 80 most recent data
    points per model to control memory usage, and allows months with a single record
    for sparse or infrequently observed aircraft models. Monthly metrics per aircraft
    model containing record count, quartiles (Q1, median, Q3), count of outlier readings,
    and the rolling average altitude.


    Business Value: Aggregated metrics grouped by month and name


    Complexity: moderate


