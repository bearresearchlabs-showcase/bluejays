    This database includes 30 production SQL queries, each designed to solve specific
    business problems for companies with $1M+ ARR. Each query includes:


    - Business Use Case: The specific business problem this query solves

    - Description: Technical explanation of what the query does

    - Client Deliverable: What output or report this query generates

    - Business Value: The business impact and value delivered

    - Complexity: Technical complexity indicators

    - SQL Code: Complete, production-ready SQL query


    ---


    Use Case: I need to see how model altitude varies day by day over the past year,
    including rolling averages and how many outlier readings we get per model.


    Description: Platform operators monitoring ADS-B telemetry need to track how aircraft
    altitude varies over time to identify anomalies and determine when maintenance
    is required. Each aircraft model has a unique ICAO 24-bit transponder code (model
    name), and altitude is recorded in feet. Produce daily aggregated altitude statistics
    per aircraft model, including rolling averages and counts of outlier readings.
    The query constructs four CTEs: first it retains the 60 most recent data points
    per model to manage memory, then computes a 5-row rolling average to smooth short-term
    fluctuations, flags outliers where altitude exceeds 2 standard deviations from
    the mean, and classifies each reading as Increasing, Decreasing, or Stable based
    on comparison with the prior value. It groups results by day and model name, requiring
    at least 2 records per group for statistical validity. When standard deviation
    is zero (no variation), it sets the z-score to 0 to avoid division-by-zero errors.


    Business Value: Aggregated metrics grouped by day and name


    Complexity: moderate


    ---


    Use Case: Can you show me weekly altitude statistics grouped by airspeed bucket?
    I need quartiles, outlier counts, and how many readings are trending upward.


    Description: Analysts need to compare altitude patterns across different groundspeed
    buckets (measured in knots) to understand how aircraft behave differently at various
    speeds—for example, fast-flying aircraft during cruise versus slower speeds during
    approach. Produce weekly altitude statistics segmented by airspeed bucket, including
    quartiles, outlier counts, and trend direction indicators. The query groups telemetry
    by week and airspeed, segments altitude into sextiles (six quantile bins) within
    each airspeed bucket, flags statistical outliers using z-scores above 2, and applies
    LAG and LEAD window functions to classify each reading as Increasing, Decreasing,
    or Stable by comparing it to adjacent records. It filters out sparse buckets containing
    fewer than 3 records to ensure statistical robustness. Weekly metrics per airspeed
    bucket showing quartiles (Q1, median, Q3), count of outlier readings, and the
    number of readings that are trending upward.


    Business Value: Aggregated metrics grouped by week and user_id


    Complexity: moderate


