    | utility_id | VARCHAR(255) | NOT NULL, FK → utility_companies | Utility company
    identifier |

    | rate_code_id | VARCHAR(255) | NOT NULL, FK → rate_codes | Rate code identifier
    |

    | rate_name | VARCHAR(255) | NOT NULL | Rate structure name |

