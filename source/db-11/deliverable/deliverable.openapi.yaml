info:
  title: Database db-11 - Database API Specification
  description: "This database implements a comprehensive parking intelligence system\
    \ for marketing analysis, mirroring SpotHero's business model. The database aggregates\
    \ parking facility data, demographics, traffic patterns, airport statistics, venue\
    \ information, and market intelligence metrics from government sources to support\
    \ parking marketplace operations across 400+ cities in North America.\n\n- Parking\
    \ Facility Intelligence: Comprehensive database of parking facilities (lots, garages,\
    \ structures) with pricing, utilization, and capacity data\n- Market Intelligence:\
    \ Calculated metrics for market demand, supply analysis, competitive positioning,\
    \ and revenue optimization\n- Geographic Coverage: 400+ cities across USA and\
    \ Canada with metropolitan area and city-level demographics\n- Event-Based Analysis:\
    \ Stadium and venue data with event scheduling and parking demand forecasting\n\
    - Traffic Correlation: Traffic volume data from FHWA correlated with parking demand\
    \ patterns\n- Airport Integration: Top 50 airports by passenger volume with parking\
    \ capacity and utilization\n- Data Integration: ETL/ELT pipelines pulling 1+ GB\
    \ of data from public APIs (Data.gov, Census Bureau, BTS, FAA, FHWA, City Open\
    \ Data Portals)\n\n- PostgreSQL: Full support with PostGIS for spatial data (GEOGRAPHY\
    \ type)\n- , : Compatible with Delta Lake format and distributed query execution\n\
    - , : Full support with GEOGRAPHY types and spatial functions\n\nThis database\
    \ powers a parking intelligence platform sourced from businesses with at least\
    \ $1M ARR per year. The queries demonstrate production-grade patterns used by:\n\
    - SpotHero: Parking marketplace with dynamic pricing and demand forecasting\n\
    - ParkWhiz: Parking reservation platform with market intelligence\n- Parkopedia:\
    \ Global parking database with utilization analytics\n- BestParking: Parking search\
    \ and comparison platform\n\n---\n\n---\n\nThis section provides a comprehensive\
    \ data dictionary for all tables in the database, including column names, data\
    \ types, constraints, and descriptions. Tables are organized by functional category\
    \ for easier navigation.\n\nThe Parking Intelligence Database consists of 14 main\
    \ tables designed to store parking facility data, demographics, traffic patterns,\
    \ airport statistics, venue information, and market intelligence metrics from\
    \ government sources.\n\n1. Geographic Data: `metropolitan_areas`, `cities`, `business_districts`\n\
    2. Transportation: `airports`, `traffic_volume_data`\n3. Venues: `stadiums_venues`,\
    \ `events`\n4. Parking Facilities: `parking_facilities`, `parking_pricing`, `parking_utilization`\n\
    5. Market Intelligence: `market_intelligence_metrics`, `competitive_analysis`\n\
    6. Data Management: `facility_district_mapping`, `data_source_metadata`\n\n1.\
    \ Data.gov CKAN API - Parking facility datasets from various cities\n2. Census\
    \ Bureau API - Demographics and population data for metropolitan areas\n3. BTS\
    \ TranStats - Airport passenger volumes and statistics\n4. FAA Airport Data -\
    \ Passenger boarding and cargo statistics\n5. FHWA Traffic Data - Traffic volume\
    \ trends and highway statistics\n6. City Open Data Portals - Real-time parking\
    \ utilization and pricing data\n\n- 400+ cities across USA and Canada\n- Major\
    \ metropolitan areas (MSAs)\n- Top 50 airports by passenger volume\n- Major sports\
    \ stadiums and venues\n- Business districts and downtown areas\n\n---\n\n---\n\
    \n---\n\nThis database includes 30 production SQL queries, each designed to solve\
    \ specific business problems for companies with $1M+ ARR. Each query includes:\n\
    \n- Business Use Case: The specific business problem this query solves\n- Description:\
    \ Technical explanation of what the query does\n- Client Deliverable: What output\
    \ or report this query generates\n- Business Value: The business impact and value\
    \ delivered\n- Complexity: Technical complexity indicators\n- SQL Code: Complete,\
    \ production-ready SQL query\n\n---\n\nUse Case: Can you show me a multi-dimensional\
    \ analysis of parking demand broken down by geographic region and time patterns?\n\
    \nDescription: Our parking intelligence platform collects data from parking_events,\
    \ lots, and zones tables to track real-time utilization and occupancy across multiple\
    \ metropolitan areas. Management needs to identify high-potential markets for\
    \ facility expansion and understand demand patterns geographically and temporally.\
    \ Calculate market demand scores for each metropolitan area with competitive rankings,\
    \ growth indicators, and data-driven expansion recommendations. The query joins\
    \ parking events with lot and zone data, groups results by metropolitan area and\
    \ time period, computes aggregate metrics like average occupancy and revenue per\
    \ space, applies window functions to rank markets and calculate period-over-period\
    \ growth rates, uses quartile analysis to identify top-performing regions, and\
    \ handles NULL values in optional geographic fields. A ranked list of metropolitan\
    \ areas with demand scores, growth percentages, quartile classifications, and\
    \ actionable expansion\n\nBusiness Value: Market demand scores by metropolitan\
    \ area with rankings, growth indicators, and expansion recommendations.\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: Can you provide a competitive intelligence report\
    \ that analyzes pricing strategies and calculates our market share?\n\nDescription:\
    \ Our parking operations compete with multiple facilities in each geographic cluster,\
    \ and we need to understand our competitive positioning to optimize pricing and\
    \ maximize revenue. The parking_events, lots, and zones tables contain pricing,\
    \ utilization, and revenue data for our facilities and competitors. Generate a\
    \ competitive analysis report by facility cluster showing pricing recommendations,\
    \ market share calculations, and revenue optimization opportunities. The query\
    \ aggregates parking events by facility cluster, calculates total market capacity\
    \ and our share within each cluster, compares average pricing across competitors\
    \ using window functions, computes revenue per available space metrics, identifies\
    \ pricing gaps and opportunities through comparative analysis, handles edge cases\
    \ where competitor data may be incomplete, and applies date range filters to focus\
    \ on recent competitive dynamics. A comprehensive competitive intelligence report\
    \ displaying\n\nBusiness Value: Competitive analysis by facility cluster with\
    \ pricing recommendations, market share calculations, and revenue optimization\
    \ opportunities.\n\nComplexity: moderate\n\n---\n\nUse Case: Can you forecast\
    \ parking demand for upcoming events and suggest pricing to maximize revenue?\n\
    \nDescription: Major events like concerts, sports games, and conferences create\
    \ significant parking demand spikes that require proactive capacity and pricing\
    \ management. Historical parking_events data combined with lot and zone characteristics\
    \ enables predictive modeling of event-driven demand. Generate event-based parking\
    \ demand forecasts with pricing recommendations and revenue optimization opportunities.\
    \ The query correlates historical parking events with event metadata to identify\
    \ demand patterns, groups by event type and venue proximity, calculates average\
    \ utilization and peak occupancy during similar past events, applies window functions\
    \ to compute rolling averages and trend lines, uses multi-event correlation to\
    \ identify compound demand from overlapping events, generates demand forecasts\
    \ with confidence intervals, recommends dynamic pricing based on predicted demand\
    \ levels, and handles edge cases like first-time events with limited historical\
    \ data. Event-specif\n\nBusiness Value: Event parking demand forecasts with pricing\
    \ recommendations and revenue optimization opportunities.\n\nComplexity: moderate\n\
    \n---\n\nUse Case: How can we optimize airport parking revenue by analyzing passenger\
    \ volumes and seasonal patterns?\n\nDescription: Airport parking facilities experience\
    \ highly seasonal demand correlated with passenger flight volumes, holidays, and\
    \ travel patterns. The parking_events, lots, and zones data tracks utilization\
    \ across short-term, long-term, and economy lots, while passenger volume provides\
    \ external demand signals. Develop airport parking revenue optimization recommendations\
    \ with seasonal pricing strategies and capacity utilization insights. The query\
    \ joins parking event data with passenger volume metrics by time period, segments\
    \ analysis by lot type and zone, calculates utilization rates and revenue per\
    \ space across seasons, applies window functions to identify seasonal trends and\
    \ year-over-year patterns, computes correlation coefficients between passenger\
    \ volumes and parking demand, identifies capacity constraints during peak seasons,\
    \ generates pricing elasticity estimates, and handles data gaps in passenger reporting\
    \ periods. Seasonal revenue optimization recommendati\n\nBusiness Value: Airport\
    \ parking revenue optimization recommendations with seasonal pricing strategies\
    \ and capacity utilization insights.\n\nComplexity: moderate\n\n---\n\nUse Case:\
    \ How does traffic volume affect parking demand, and where should we build new\
    \ facilities?\n\nDescription: Urban traffic volume serves as a leading indicator\
    \ of parking demand, and understanding this relationship enables strategic facility\
    \ placement and demand forecasting. The parking_events, lots, and zones data combined\
    \ with traffic volume measurements provides the foundation for correlation analysis\
    \ and site selection. Analyze traffic-parking correlation with demand forecasts\
    \ and facility placement recommendations. The query joins parking utilization\
    \ data with traffic volume metrics by geographic zone and time period, calculates\
    \ correlation coefficients between traffic density and parking occupancy, groups\
    \ by location characteristics like commercial districts or residential areas,\
    \ applies window functions to compute moving averages and identify emerging demand\
    \ trends, uses regression analysis to forecast parking demand based on traffic\
    \ patterns, identifies underserved high-traffic areas with capacity gaps, handles\
    \ temporal alignment between traffic measurements a\n\nBusiness Value: Traffic-parking\
    \ correlation analysis with demand forecasts and facility placement recommendations.\n\
    \nComplexity: moderate\n\n---\n\nUse Case: Can you show me a demographic targeting\
    \ analysis that includes income-based pricing optimization and market penetration\
    \ modeling?\n\nDescription: The parking operations team needs to optimize pricing\
    \ strategies across different demographic segments to increase revenue while maintaining\
    \ competitive market penetration. Currently, pricing is uniform across all customer\
    \ segments, leading to potential revenue loss from price-insensitive customers\
    \ and market share loss from price-sensitive segments. Generate a demographic\
    \ targeting analysis that provides segment-specific pricing recommendations and\
    \ marketing strategies based on customer behavior and income patterns. The query\
    \ joins parking_events with lots and zones tables, groups data by demographic\
    \ dimensions (age groups, income brackets, geographic zones), computes aggregate\
    \ metrics including average transaction value, visit frequency, and revenue per\
    \ segment. Window functions calculate quartile rankings for income-based segmentation\
    \ and rolling averages for trend analysis. The query handles NULL values in demographic\
    \ fields through COALESCE and filters out\n\nBusiness Value: Demographic targeting\
    \ analysis with segment-specific pricing and marketing recommendations.\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: Can you provide a market segmentation analysis\
    \ with multi-dimensional clustering and revenue optimization insights?\n\nDescription:\
    \ The business development team requires a comprehensive understanding of distinct\
    \ market segments to allocate resources effectively and maximize revenue across\
    \ different customer clusters. Current undifferentiated marketing approaches are\
    \ resulting in suboptimal customer acquisition costs and revenue performance.\
    \ Perform multi-dimensional market segmentation analysis that identifies distinct\
    \ customer clusters, quantifies their revenue potential, and provides optimization\
    \ recommendations for each segment. The query aggregates parking_events data across\
    \ multiple dimensions including temporal patterns (day of week, time of day),\
    \ spatial characteristics (lot location, zone type), and behavioral metrics (duration,\
    \ frequency, payment method). It uses grouping to create market segments, calculates\
    \ revenue metrics and growth rates for each cluster, applies window functions\
    \ to rank segments by profitability and compute comparative performance metrics.\
    \ NULL handling ensur\n\nBusiness Value: Market segments with characteristics,\
    \ revenue potential, and optimization recommendations.\n\nComplexity: moderate\n\
    \n---\n\nUse Case: Can you show me utilization pattern analysis with temporal\
    \ decomposition and anomaly detection capabilities?\n\nDescription: The operations\
    \ team is experiencing unpredictable parking capacity issues, with some lots consistently\
    \ overutilized while others remain underused. Without systematic pattern analysis\
    \ and anomaly detection, the team cannot proactively manage capacity or optimize\
    \ resource allocation across the parking network. Conduct a comprehensive utilization\
    \ pattern analysis that decomposes temporal trends, identifies anomalous usage\
    \ patterns, and provides data-driven capacity planning recommendations. The query\
    \ analyzes parking_events across time dimensions, grouping by hour, day, week,\
    \ and month to extract utilization patterns. It calculates occupancy rates, duration\
    \ statistics, and turnover metrics for each lot and zone. Window functions compute\
    \ rolling averages (7-day, 30-day) to establish baseline utilization, calculate\
    \ standard deviations to detect anomalies (values exceeding 2 standard deviations\
    \ from the mean), and generate trend indicators using LAG/LEAD functions. T\n\n\
    Business Value: Utilization patterns with trend analysis, anomaly flags, and capacity\
    \ planning recommendations.\n\nComplexity: moderate\n\n---\n\nUse Case: Can you\
    \ generate a geographic expansion analysis with market opportunity scoring and\
    \ risk assessment?\n\nDescription: The strategic planning team is evaluating potential\
    \ geographic markets for expansion but lacks a systematic framework to assess\
    \ opportunity size, competitive dynamics, and associated risks across different\
    \ zones and regions. Ad-hoc decision-making has previously led to underperforming\
    \ expansion investments. Create a geographic expansion analysis that scores market\
    \ opportunities, assesses entry risks, and prioritizes expansion targets based\
    \ on data-driven metrics. The query analyzes parking_events data aggregated by\
    \ geographic dimensions (zones, lots, regions), calculating market size indicators\
    \ such as total transaction volume, revenue density, and growth rates. It joins\
    \ with lots and zones tables to incorporate location attributes and competitive\
    \ metrics. Window functions rank geographic areas by opportunity score (weighted\
    \ composite of revenue potential, growth trajectory, and market saturation). The\
    \ query computes risk factors including revenue volatility (s\n\nBusiness Value:\
    \ Market expansion opportunities with opportunity scores, risk assessments, and\
    \ expansion priorities.\n\nComplexity: moderate\n\n---\n\nUse Case: Can you provide\
    \ revenue forecasting models with time-series analysis and statistical confidence\
    \ intervals?\n\nDescription: The finance team requires accurate revenue forecasts\
    \ for budgeting and resource planning, but current projections lack statistical\
    \ rigor and confidence measures, leading to unreliable financial planning and\
    \ missed performance targets. Historical parking revenue data shows seasonal patterns\
    \ and trends that need to be systematically modeled. Develop revenue forecasting\
    \ models that project future revenue using time-series analysis techniques and\
    \ provide confidence intervals to quantify forecast uncertainty. The query aggregates\
    \ historical revenue data from parking_events by time periods (daily, weekly,\
    \ monthly), calculating revenue totals and growth rates. It employs window functions\
    \ to compute moving averages (smoothing short-term volatility), exponential smoothing\
    \ weights for trend projection, and year-over-year comparisons to capture seasonality.\
    \ The query calculates standard errors and constructs confidence intervals (typically\
    \ 95%) using historical variance i\n\nBusiness Value: Query results with analysis\
    \ and recommendations.\n\nComplexity: moderate\n\n---\n\nUse Case: Can you provide\
    \ a competitive positioning analysis that shows our market share dynamics compared\
    \ to competitors and includes strategic recommendations?\n\nDescription: Our parking\
    \ management company operates multiple lots across the city and needs to understand\
    \ our competitive position relative to other parking providers in overlapping\
    \ zones. Market share dynamics are shifting due to new entrants and changing customer\
    \ preferences, requiring data-driven strategic decisions. Analyze competitive\
    \ positioning by calculating market share metrics, identifying trends in customer\
    \ preferences across competing lots, and generating strategic recommendations\
    \ for pricing and capacity optimization. The query joins parking_events with lots\
    \ and zones tables to aggregate utilization rates by provider and zone. It computes\
    \ market share percentages using window functions to compare our lots against\
    \ competitors, calculates rolling 3-month averages to identify trends, applies\
    \ quartile analysis to segment high-performing versus underperforming locations,\
    \ and handles NULL values in zone assignments through left joins with COALESCE\
    \ functions. Result:\n\nBusiness Value: Query results with analysis and recommendations.\n\
    \nComplexity: moderate\n\n---\n\nUse Case: What does the parking demand look like\
    \ across different business districts, and how can we optimize revenue based on\
    \ these patterns?\n\nDescription: The city's business districts experience varying\
    \ levels of parking demand throughout the week, influenced by office schedules,\
    \ retail activity, and entertainment venues. Understanding the correlation between\
    \ district characteristics and parking demand is crucial for maximizing revenue\
    \ across our lot portfolio. Perform a comprehensive business district analysis\
    \ that correlates parking demand patterns with district attributes, identifies\
    \ peak demand periods, and recommends revenue optimization strategies including\
    \ dynamic pricing opportunities. The query segments parking_events by business\
    \ district zones, calculating hourly and daily demand patterns through temporal\
    \ grouping. It uses window functions to compute moving averages for demand forecasting,\
    \ correlates occupancy rates with zone characteristics (commercial, retail, mixed-use),\
    \ performs comparative analysis across districts using RANK() and PERCENT_RANK()\
    \ functions, and applies statistical aggregates to id\n\nBusiness Value: Query\
    \ results with analysis and recommendations.\n\nComplexity: moderate\n\n---\n\n\
    Use Case: How can we optimize our monthly parking operations while understanding\
    \ customer lifetime value and improving retention rates?\n\nDescription: Our parking\
    \ business offers both monthly subscription passes and transient parking options.\
    \ Understanding customer lifetime value (CLV) and retention patterns is essential\
    \ for resource allocation, marketing spend optimization, and long-term revenue\
    \ forecasting. Monthly passholders represent stable revenue but we're seeing concerning\
    \ churn trends that need investigation. Conduct a monthly parking optimization\
    \ analysis that calculates customer lifetime value, tracks retention cohorts over\
    \ time, identifies churn risk factors, and provides actionable recommendations\
    \ to improve customer retention and maximize long-term profitability. The query\
    \ aggregates parking_events by customer and month, calculating subscription tenure,\
    \ total revenue per customer, and average monthly spend. It employs window functions\
    \ with PARTITION BY customer_id to track retention across monthly cohorts, computes\
    \ CLV using cumulative revenue calculations, applies LAG() and LEAD() functions\
    \ to\n\nBusiness Value: Query results with analysis and recommendations.\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: What's the current state of EV charging facility\
    \ utilization, and how should we forecast demand and model the revenue impact\
    \ of expanding this service?\n\nDescription: Electric vehicle adoption is accelerating\
    \ rapidly, and our parking lots with EV charging capabilities are experiencing\
    \ increased demand. We need to evaluate current charging station utilization,\
    \ forecast future demand based on EV adoption trends, and model the financial\
    \ impact of adding more charging infrastructure across our lot portfolio. Analyze\
    \ existing EV charging facility performance, develop demand forecasts using historical\
    \ growth patterns, model revenue scenarios for infrastructure expansion, and provide\
    \ data-driven recommendations on where and when to invest in additional charging\
    \ capacity. The query filters parking_events to EV charging spots, joining with\
    \ lots table to identify facilities with charging infrastructure. It calculates\
    \ current utilization rates and revenue per charging space, applies window functions\
    \ to compute month-over-month growth rates in EV parking frequency, uses rolling\
    \ averages for trend smoothing, projects future demand using\n\nBusiness Value:\
    \ Query results with analysis and recommendations.\n\nComplexity: moderate\n\n\
    ---\n\nUse Case: How do reservation customers compare to walk-in customers in\
    \ terms of revenue generation, and how can we use this to optimize capacity planning?\n\
    \nDescription: Our parking lots accept both advance reservations and walk-in customers,\
    \ creating a complex capacity management challenge. Reserved spaces guarantee\
    \ revenue but may leave capacity unused if customers don't show, while walk-in\
    \ customers provide flexibility but introduce revenue uncertainty. We need to\
    \ optimize the reservation-to-walk-in ratio to maximize both revenue and utilization.\
    \ Conduct a comprehensive analysis comparing reservation and walk-in customer\
    \ behavior, calculate revenue metrics for each segment, assess capacity utilization\
    \ efficiency, identify optimal reservation allocation strategies, and provide\
    \ recommendations for dynamic capacity planning that maximizes total revenue.\
    \ The query segments parking_events by reservation status (pre-booked versus walk-in),\
    \ joining with lots and zones tables for location context. It calculates revenue\
    \ per customer type, average duration, and no-show rates for reservations using\
    \ window functions to track expected ve\n\nBusiness Value: Query results with\
    \ analysis and recommendations.\n\nComplexity: moderate\n\n---\n\nUse Case: Can\
    \ you show me peak hour parking patterns with dynamic pricing recommendations\
    \ and capacity utilization insights?\n\nDescription: Our parking management system\
    \ needs to optimize revenue during high-demand periods while preventing capacity\
    \ bottlenecks. Historical data from parking_events, lots, and zones tables contains\
    \ timestamped entry/exit records, lot capacities, and zone classifications that\
    \ can reveal hourly demand patterns. Identify peak usage hours across different\
    \ facility types and generate dynamic pricing recommendations to balance demand\
    \ with available capacity. The query segments parking events by hour of day and\
    \ day of week, joining parking_events with lots and zones tables to aggregate\
    \ occupancy rates, duration metrics, and revenue per hour. Window functions calculate\
    \ rolling 3-hour average occupancy rates to identify sustained peak periods. The\
    \ analysis computes occupancy quartiles by facility type and compares actual vs.\
    \ capacity utilization ratios, flagging hours exceeding 85% capacity as requiring\
    \ premium pricing. NULL values in optional zone attributes are handled with\n\n\
    Business Value: Query results with analysis and recommendations.\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: Can you compare weekend versus weekday parking\
    \ patterns and suggest optimal pricing strategies for each period?\n\nDescription:\
    \ Parking demand characteristics differ significantly between weekdays (commuter-driven)\
    \ and weekends (leisure-driven), requiring distinct pricing and operational strategies.\
    \ The parking_events table contains timestamped transactions that can be segmented\
    \ by day type, while lots and zones tables provide facility characteristics and\
    \ current pricing structures. Quantify the differences in parking behavior between\
    \ weekends and weekdays, and develop pricing strategies optimized for each period's\
    \ demand profile. The query categorizes parking_events into weekend (Saturday/Sunday)\
    \ and weekday (Monday-Friday) segments using date functions, then groups by this\
    \ dimension along with lot and zone attributes. Aggregate functions compute average\
    \ duration, turnover rate (events per space per day), peak occupancy, and revenue\
    \ per space for each segment. Window functions calculate percentage differences\
    \ between weekend and weekday metrics for the same facilities. The analysis inc\n\
    \nBusiness Value: Query results with analysis and recommendations.\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: Can you analyze performance by facility type and\
    \ provide revenue maximization recommendations with competitive benchmarking?\n\
    \nDescription: Our parking portfolio includes diverse facility types (garages,\
    \ surface lots, street parking) with varying operational costs, capacity constraints,\
    \ and revenue potential. Data in parking_events, lots, and zones tables captures\
    \ utilization and revenue across these facility types, enabling performance comparison\
    \ and optimization opportunity identification. Benchmark performance across facility\
    \ types, identify underperforming assets, and generate actionable recommendations\
    \ to maximize revenue while maintaining competitive occupancy rates. The query\
    \ groups parking_events by facility type (from lots table) and calculates key\
    \ performance indicators including revenue per space per month, average occupancy\
    \ rate, utilization efficiency (actual hours used / available hours), and average\
    \ transaction value. Window functions compute percentile rankings for each facility\
    \ within its type category, identifying top and bottom quartile performers. The\
    \ analysis uses CTEs to first\n\nBusiness Value: Query results with analysis and\
    \ recommendations.\n\nComplexity: moderate\n\n---\n\nUse Case: Can you break down\
    \ parking performance by operator type and assess market share with competitive\
    \ positioning insights?\n\nDescription: The parking market includes multiple operator\
    \ types (municipal, private commercial, institutional) competing for customers,\
    \ each with different business models and objectives. Data from parking_events\
    \ linked to lots and zones tables contains operator classifications and transaction\
    \ history that reveals market dynamics and competitive positioning. Analyze market\
    \ share and operational performance by operator type to identify competitive advantages,\
    \ market trends, and strategic positioning opportunities. The query aggregates\
    \ parking_events by operator type (extracted from lots table), computing total\
    \ transactions, unique customer counts, market share percentages, revenue totals,\
    \ and average pricing. Window functions calculate year-over-year growth rates\
    \ and market share changes for each operator type. The analysis uses self-joins\
    \ to compare each operator's metrics against category averages and market leaders.\
    \ CTEs first establish market totals, then calculate each\n\nBusiness Value: Query\
    \ results with analysis and recommendations.\n\nComplexity: moderate\n\n---\n\n\
    Use Case: Can you provide a multi-city parking performance comparison with benchmarking\
    \ analysis and best practice recommendations?\n\nDescription: Our organization\
    \ operates parking facilities across multiple cities with varying demographics,\
    \ regulations, and competitive landscapes. The parking_events, lots, and zones\
    \ tables contain city identifiers and standardized metrics that enable cross-market\
    \ performance comparison and best practice identification. Compare parking operations\
    \ performance across cities to identify top-performing markets, understand what\
    \ drives their success, and extract transferable best practices for underperforming\
    \ locations. The query groups parking_events by city (from zones or lots table),\
    \ calculating standardized KPIs including revenue per capita (using city population\
    \ data), average occupancy rates, pricing levels, utilization efficiency, and\
    \ customer satisfaction proxies (repeat usage rates). Window functions rank cities\
    \ by each performance dimension and compute z-scores to identify statistical outliers.\
    \ The analysis uses CTEs to normalize metrics for city size and market matur\n\
    \nBusiness Value: Query results with analysis and recommendations.\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: Can you provide an MSA-level aggregation analysis\
    \ that identifies regional market intelligence and potential expansion opportunities?\n\
    \nDescription: The Parking Intelligence business operates across multiple Metropolitan\
    \ Statistical Areas (MSAs) and needs to evaluate regional performance to identify\
    \ high-potential markets for expansion. Data from parking_events, lots, and zones\
    \ tables contains transactional and operational information including parking\
    \ utilization rates, lot occupancy levels, and zone-specific metrics that can\
    \ reveal market dynamics and growth opportunities. Aggregate parking metrics at\
    \ the MSA level to identify regional market intelligence and pinpoint expansion\
    \ opportunities based on utilization trends, revenue potential, and competitive\
    \ positioning. The query joins parking_events with lots and zones tables to connect\
    \ events to their geographic MSA regions. It groups data by MSA to compute aggregate\
    \ metrics including total parking events, average occupancy rates, revenue per\
    \ MSA, and utilization quartiles. Window functions calculate rolling averages\
    \ to identify trending markets and compar\n\nBusiness Value: Query results with\
    \ analysis and recommendations.\n\nComplexity: moderate\n\n---\n\nUse Case: Can\
    \ you generate a time-series forecast with seasonal decomposition and trend analysis\
    \ for our parking operations?\n\nDescription: The Parking Intelligence operations\
    \ experience fluctuating demand patterns across different time periods, influenced\
    \ by seasonal factors such as holidays, weather, and local events. Historical\
    \ data in parking_events, lots, and zones tables captures timestamped transactions\
    \ that reveal cyclical patterns and underlying trends critical for capacity planning\
    \ and resource allocation. Perform time-series forecasting that decomposes parking\
    \ demand into seasonal, trend, and residual components to enable accurate prediction\
    \ of future utilization and support operational planning. The query extracts parking\
    \ events with timestamps and groups data by time periods (hourly, daily, weekly,\
    \ monthly) to construct time-series aggregates. It calculates moving averages\
    \ using window functions with ROWS BETWEEN clauses to smooth short-term volatility\
    \ and expose underlying trends. Seasonal components are identified by grouping\
    \ by day-of-week, month, or hour-of-day and computing averag\n\nBusiness Value:\
    \ Query results with analysis and recommendations.\n\nComplexity: moderate\n\n\
    ---\n\nUse Case: Can you perform anomaly detection analysis using statistical\
    \ methods and generate alerts for unusual parking patterns?\n\nDescription: The\
    \ Parking Intelligence platform monitors thousands of parking events daily across\
    \ multiple lots and zones. Anomalous patterns such as unexpected occupancy spikes,\
    \ unusual duration outliers, or irregular revenue fluctuations may indicate operational\
    \ issues, system errors, fraudulent activity, or emerging demand shifts that require\
    \ immediate attention. Historical data in parking_events, lots, and zones provides\
    \ the baseline for detecting statistically significant deviations. Identify anomalous\
    \ parking events and patterns using statistical methods, flag outliers for investigation,\
    \ and generate alerts when metrics deviate significantly from expected norms.\
    \ The query aggregates parking metrics by lot, zone, and time period, computing\
    \ mean, standard deviation, and quartile boundaries for key indicators such as\
    \ occupancy rate, parking duration, and revenue per event. Window functions calculate\
    \ rolling statistics over relevant time windows (7-day, 30-day) to establis\n\n\
    Business Value: Query results with analysis and recommendations.\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: Can you provide customer segmentation analysis\
    \ that reveals behavioral patterns and suggests targeting strategies?\n\nDescription:\
    \ The Parking Intelligence business serves a diverse customer base with varying\
    \ parking behaviors, frequency patterns, duration preferences, and price sensitivities.\
    \ Understanding these behavioral segments is essential for personalized marketing,\
    \ dynamic pricing strategies, and service optimization. Data in parking_events\
    \ captures individual customer transactions linked to lots and zones, providing\
    \ rich behavioral signals for segmentation analysis. Segment customers based on\
    \ parking behavioral patterns such as frequency, duration, time-of-day preferences,\
    \ and spending levels, then recommend targeted strategies for each segment to\
    \ optimize engagement and revenue. The query groups parking_events by customer\
    \ identifiers to compute behavioral metrics including total visits, average parking\
    \ duration, preferred time windows (morning/afternoon/evening), day-of-week patterns,\
    \ total spend, and average transaction value. It uses NTILE or quartile functions\
