    Use Case: Show me bulk shipping preset optimization results with weight distribution
    analysis.


    Description: Situation: The logistics operations team manages high-volume shipping
    and needs to optimize preset configurations to reduce costs. Historical shipment
    data across carriers and routes contains weight distributions and configuration
    patterns that can reveal cost-saving opportunities. Task: Analyze bulk shipping
    presets to identify optimal configurations based on weight distribution patterns,
    calculate potential cost savings, and determine usage patterns across different
    shipment types. Action: The query joins shipments with preset configurations and
    carrier rate tables, groups by preset type and weight brackets, computes aggregate
    metrics including average weights and costs, calculates quartiles for weight distribution
    analysis, uses window functions to compare actual versus optimal preset usage,
    and handles NULL values in optional preset fields. Result: Returns a dataset containing
    preset recommendations, estimated cost savings per configuration, weight distribution
    quartiles, usage fre


    Business Value: Bulk shipping preset optimization results showing recommended
    configurations, cost savings potential, and usage patterns.


    Complexity: moderate


