    times, calculate error rates, identify performance bottlenecks, detect usage patterns,
    and generate optimization recommendations to improve reliability and speed. Action:
    The query aggregates API request logs, groups by endpoint, carrier integration,
    and time intervals, computes percentile metrics for response times (p50, p95,
    p99), calculates error rates by error type and endpoint, uses window functions
    to track performance trends over rolling windows and identify degradation patterns,
    correlates slow responses with carrier APIs or data volume, and handles NULL values
    in optional request param


    Business Value: API performance analysis showing response times, error rates,
    optimization opportunities, and performance recommendations.


    Complexity: moderate


