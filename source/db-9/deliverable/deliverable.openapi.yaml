    and coefficient of variation, uses window functions to compute rolling averages
    and period-over-period rate changes, identifies seasonal patterns and anomalies
    in pricing, performs quartile analysis to categorize rate stability, and handles
    NULL values in historical rate data using appropriate imputation. Result: Returns
    volatility metrics per carrier and route


    Business Value: Rate volatility analysis showing price trends, volatility metrics,
