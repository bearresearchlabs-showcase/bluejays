    accessorial fees), comparative carrier performance analysis, and specific optimization
    recommendations to reduce total shipping spend while maintaining or improving
    delivery performance. Action: The SQL query integrates shipment cost data with
    carrier performance metrics, groups r


    Business Value: Shipping cost analytics showing revenue metrics, cost breakdowns,
    carrier performance comparisons, and optimization recommendations.


    Complexity: moderate


