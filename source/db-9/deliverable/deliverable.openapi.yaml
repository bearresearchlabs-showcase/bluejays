    behavior, and evaluates carrier performance metrics to enable proactive shipment
    management. Action: The SQL query analyzes tracking event sequences across shipments,
    groups events by shipment and carrier dimensions, computes aggregate metrics for
    event timing and frequency, applies window functions to calculate rolling averages
    and identify deviation patterns fr


    Business Value: Tracking analytics showing delivery predictions, event patterns,
    anomaly detection results, and carrier performance metrics.


    Complexity: moderate


