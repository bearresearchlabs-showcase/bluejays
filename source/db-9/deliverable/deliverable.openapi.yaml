    recovery opportunities, identify root causes, and generate prevention recommendations.
    Action: The query joins shipment records with adjustment transactions and billing
    data, groups by adjustment type, carrier, and time period, computes aggregate
    adjustment amounts and frequencies, calculates quartiles to identify outlier adjustments,
    uses window functions to track adjustment trends over time and compare carrier
    performance, detects patterns through correlation analysis, and handles edge cases
    including reversed adjustments and NULL reason codes. Result: Returns a detailed
    dataset con


    Business Value: Shipping adjustment analysis showing adjustment types, discrepancy
    patterns, cost recovery opportunities, and prevention recommendations.


    Complexity: moderate


