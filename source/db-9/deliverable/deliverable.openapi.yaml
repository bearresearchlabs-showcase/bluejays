    Use Case: Can you show me a multi-carrier rate comparison that includes zone analysis
    and identifies cost optimization opportunities?


    Description: Situation: Our shipping operations team in the Shipping Intelligence
    domain needs to optimize carrier selection and reduce costs. We have historical
    data from shipments, carriers, and routes that captures shipment tracking and
    carrier performance metrics. Currently, we manually compare rates across carriers,
    which is time-consuming and prone to missing cost-saving opportunities. Task:
    Generate a comprehensive rate comparison analysis that identifies the cheapest
    carrier, fastest carrier, calculates potential cost savings, and provides detailed
    rate breakdowns for all available shipping options to support data-driven carrier
    selection decisions. Action: The SQL query joins shipment, carrier, and route
    tables, groups results by carrier and shipping zone dimensions, computes aggregate
    metrics including average rates and transit times, calculates cost differentials
    using window functions to rank carriers by price and speed, determines quartile
    distributions for rate analysis, and handles N


    Business Value: Rate comparison results showing cheapest carrier, fastest carrier,
    cost savings potential, and detailed rate breakdowns for all available options.


    Complexity: moderate


