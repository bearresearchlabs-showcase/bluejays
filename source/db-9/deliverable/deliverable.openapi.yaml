    zone-based performance insights are fragmented across multiple reports, making
    it difficult to identify regional inefficiencies. Task: Produce a detailed zone
    analysis report showing the distribution of shipments across zones, average transit
    times for each zone, geographic shipping pattern identification, and specific
    optimization recommendations to improve zone-based delivery performance. Action:
    The SQL query aggregates shipment data by geographic zone dimensions, computes
    average and median transit times using aggregate functions, calculates shipment
    volume distributions across zones, applies window functions to identify trend
    patterns and compare zone performance ag


    Business Value: Zone analysis results showing zone distributions, average transit
    times by zone, geographic shipping patterns, and optimization recommendations.


    Complexity: challenging


