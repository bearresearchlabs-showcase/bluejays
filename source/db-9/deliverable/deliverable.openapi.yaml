    Use Case: Can you show me the dimensional weight optimization analysis along with
    recommended package configurations?


    Description: Situation: The logistics team is evaluating packaging efficiency
    to reduce shipping costs. Current packages may not be optimized for dimensional
    weight pricing used by carriers, leading to unnecessary surcharges. The shipments
    table contains package dimensions and weights, while carriers table has dimensional
    weight divisors and pricing rules. Task: Analyze dimensional weight optimization
    opportunities and recommend optimal package configurations that minimize costs.
    Action: The query calculates actual weight versus dimensional weight (length ×
    width × height / divisor) for each package type, groups shipments by package configuration,
    computes cost differences between actual and optimized scenarios, uses window
    functions to rank package configurations by savings potential, and identifies
    quartiles of cost savings across different package types. Result: Returns a dataset
    showing current package configurations, recommended optimized dimensions, projected
    cost savings per configuration, a


    Business Value: Dimensional weight optimization results showing recommended package
    configurations and cost savings potential.


    Complexity: moderate


