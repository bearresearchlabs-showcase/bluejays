    Use Case: Can you provide a shipping zone coverage analysis that identifies geographic
    gaps in our service areas?


    Description: Situation: The operations team needs to assess current shipping zone
    coverage to identify underserved geographic areas and expansion opportunities.
    The routes table contains zone definitions and service areas, shipments table
    has destination data, and carriers table shows service capabilities. Some zones
    may have poor coverage leading to higher costs or longer delivery times. Task:
    Analyze zone coverage patterns to identify geographic gaps, underutilized routes,
    and opportunities for service optimization. Action: The query groups shipments
    by geographic zone and carrier, calculates coverage metrics including shipment
    density per zone, identifies zones with sparse coverage or no service, uses window
    functions to compare zone performance against regional averages, computes distance
    and cost metrics for underserved areas, and handles NULL values for zones without
    historical shipment data. Result: Returns coverage metrics per zone including
    shipment volume, average delivery time, cost per


    Business Value: Zone coverage analysis showing coverage gaps, optimization opportunities,
    and route recommendations.


    Complexity: challenging


