# GDPval-style validation anchors for db-1
# Reusable check definitions - reference in prompts

steps:
  step_1_schema_parse: &step1
    name: Schema Parse
    description: Validate schema.sql or schema_postgresql.sql syntax
    check: CREATE TABLE present, valid SQL
    pass_criteria: File exists and contains CREATE TABLE

  step_2_queries_extract: &step2
    name: Queries Extract
    description: Extract queries.md to queries.json
    check: 30 queries, valid JSON
    pass_criteria: queries.json exists with 30 queries

  step_3_query_syntax: &step3
    name: Query Syntax
    description: EXPLAIN each query on PostgreSQL
    check: comprehensive_validator.py
    pass_criteria: All queries parse successfully

  step_4_query_execution: &step4
    name: Query Execution
    description: Execute queries on fresh container
    check: execution_tester.py
    pass_criteria: All queries execute without error

  step_5_deliverable_completeness: &step5
    name: Deliverable Completeness
    description: All required files present
    check: schema, queries.json, queries.md, data.sql
    pass_criteria: All required files exist

  step_6_output_check: &step6
    name: Output/Deliverable Check
    description: Compare expected vs actual client deliverable
    check: DOCUMENTATION/ html, json, md
    pass_criteria: client/db/db-N/DOCUMENTATION/ complete
