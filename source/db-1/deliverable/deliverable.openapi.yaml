info:
  title: Database db-1 - Database API Specification
  description: "This database implements a comprehensive chat/messaging system supporting\
    \ user profiles, chat rooms, messages, friend networks, notifications, file attachments,\
    \ anonymous chats, and chat invitations. The system is designed to work across\
    \ PostgreSQL database platforms.\n\n- User Management: User profiles with authentication,\
    \ roles, and AI character associations\n- Chat System: Multi-user chat rooms with\
    \ participants and message threads\n- Social Network: Friend connections with\
    \ status tracking (accepted, pending, declined)\n- Notifications: Real-time notification\
    \ system for user events\n- File Attachments: File sharing capabilities within\
    \ chats\n- Anonymous Chats: Temporary anonymous chat rooms with join codes\n-\
    \ Chat Invitations: Invitation system for chat room access\n\n- PostgreSQL: Full\
    \ support with UUID types, arrays, and JSONB\n- , : Compatible with Delta Lake\
    \ format\n- , : Full support with VARIANT types\n\n---\n\n---\n\nThis section\
    \ provides a comprehensive data dictionary for all tables in the database, including\
    \ column names, data types, constraints, and descriptions. Tables are organized\
    \ by functional category for easier navigation.\n\nThe database consists of 12\
    \ tables organized into logical groups:\n\n1. User Management: `profiles`\n2.\
    \ Chat System: `chats`, `chat_participants`, `messages`\n3. Social Network: `friends`\n\
    4. Notifications: `notifications`\n5. File Management: `file_attachments`\n6.\
    \ Anonymous Features: `anonymous_chats`, `anonymous_chat_users`, `anonymous_messages`\n\
    7. Invitations: `chat_invitations`\n8. Analytics: `aircraft_position_history`\
    \ (time-series)\n\n---\n\nStores user profile information including authentication\
    \ details, preferences, and AI character associations.\n\n| Column | Type | Nullable\
    \ | Default | Description |\n|--------|------|----------|---------|-------------|\n\
    | `id` | `UUID` | No | `gen_random_uuid()` | Primary key - unique user identifier\
    \ |\n| `username` | `VARCHAR(255)` | No | — | Unique username for login |\n| `display_name`\
    \ | `VARCHAR(255)` | No | — | Display name shown in UI |\n| `avatar_url` | `VARCHAR(16777216)`\
    \ | No | — | URL to user avatar image |\n| `created_at` | `TIMESTAMP_NTZ` | No\
    \ | `CURRENT_TIMESTAMP()` | Account creation timestamp |\n| `updated_at` | `TIMESTAMP_NTZ`\
    \ | No | `CURRENT_TIMESTAMP()` | Last profile update timestamp |\n| `ai_character_id`\
    \ | `VARCHAR(255)` | Yes | `NULL` | Associated AI character identifier |\n| `user_role`\
    \ | `VARCHAR(50)` | No | `'user'` | User role (user, admin, moderator) |\n| `email`\
    \ | `VARCHAR(255)` | No | — | User email address |\n| `bio` | `VARCHAR(16777216)`\
    \ | Yes | `NULL` | User biography text |\n| `last_username_changed_at` | `TIMESTAMP_NTZ`\
    \ | Yes | `NULL` | Timestamp of last username change |\n| `prompt_username_setup`\
    \ | `BOOLEAN` | No | `FALSE` | Flag indicating if username setup was prompted\
    \ |\n\nIndexes:\n- Primary Key: `id`\n- Unique Index: `username`\n- Index: `email`\n\
    - Index: `created_at`\n\nConstraints:\n- `username` must be unique\n- `email`\
    \ must be unique\n\n---\n\nStores chat room information including metadata and\
    \ AI character associations.\n\n| Column | Type | Nullable | Default | Description\
    \ |\n|--------|------|----------|---------|-------------|\n| `id` | `UUID` | No\
    \ | `gen_random_uuid()` | Primary key - unique chat identifier |\n| `title` |\
    \ `VARCHAR(255)` | No | — | Chat room title |\n| `created_at` | `TIMESTAMP_NTZ`\
    \ | No | `CURRENT_TIMESTAMP()` | Chat creation timestamp |\n| `updated_at` | `TIMESTAMP_NTZ`\
    \ | No | `CURRENT_TIMESTAMP()` | Last update timestamp |\n| `current_ai_character_id`\
    \ | `VARCHAR(255)` | Yes | `NULL` | Currently active AI character |\n| `created_by`\
    \ | `UUID` | No | — | Foreign key to `profiles.id` - creator |\n\nIndexes:\n-\
    \ Primary Key: `id`\n- Foreign Key: `created_by` → `profiles.id`\n- Index: `created_at`\n\
    - Index: `updated_at`\n\n---\n\nJunction table linking users to chat rooms they\
    \ participate in.\n\n| Column | Type | Nullable | Default | Description |\n|--------|------|----------|---------|-------------|\n\
    | `chat_id` | `UUID` | No | — | Foreign key to `chats.id` |\n| `user_id` | `UUID`\
    \ | No | — | Foreign key to `profiles.id` |\n| `joined_at` | `TIMESTAMP_NTZ` |\
    \ No | `CURRENT_TIMESTAMP()` | Timestamp when user joined |\n\nIndexes:\n- Composite\
    \ Primary Key: `(chat_id, user_id)`\n- Foreign Key: `chat_id` → `chats.id`\n-\
    \ Foreign Key: `user_id` → `profiles.id`\n- Index: `joined_at`\n\nConstraints:\n\
    - Unique combination of `chat_id` and `user_id`\n\n---\n\nStores individual messages\
    \ within chat rooms, supporting both user and AI-generated messages.\n\n| Column\
    \ | Type | Nullable | Default | Description |\n|--------|------|----------|---------|-------------|\n\
    | `id` | `UUID` | No | `gen_random_uuid()` | Primary key - unique message identifier\
    \ |\n| `chat_id` | `UUID` | No | — | Foreign key to `chats.id` |\n| `sender_id`\
    \ | `UUID` | Yes | `NULL` | Foreign key to `profiles.id` (NULL for system messages)\
    \ |\n| `content` | `VARCHAR(16777216)` | No | — | Message text content |\n| `is_ai`\
    \ | `BOOLEAN` | No | `FALSE` | Flag indicating AI-generated message |\n| `ai_character_id`\
    \ | `VARCHAR(255)` | Yes | `NULL` | AI character identifier if AI message |\n\
    | `created_at` | `TIMESTAMP_NTZ` | No | `CURRENT_TIMESTAMP()` | Message creation\
    \ timestamp |\n| `updated_at` | `TIMESTAMP_NTZ` | No | `CURRENT_TIMESTAMP()` |\
    \ Last update timestamp |\n| `deleted_at` | `TIMESTAMP_NTZ` | Yes | `NULL` | Soft\
    \ delete timestamp |\n| `mentioned_users` | `ARRAY(VARCHAR)` | Yes | `NULL` |\
    \ Array of mentioned user IDs |\n| `is_system_message` | `BOOLEAN` | No | `FALSE`\
    \ | Flag indicating system-generated message |\n| `mentions_data` | `VARIANT`\
    \ | Yes | `NULL` | JSON data for mentions  |\n\nIndexes:\n- Primary Key: `id`\n\
    - Foreign Key: `chat_id` → `chats.id`\n- Foreign Key: `sender_id` → `profiles.id`\n\
    - Index: `created_at`\n- Index: `(chat_id, created_at)`\n- Index: `deleted_at`\
    \ WHERE `deleted_at IS NULL`\n\nConstraints:\n- `sender_id` must be NULL if `is_system_message`\
    \ is TRUE\n- `content` cannot be empty\n\n---\n\nStores friend relationships between\
    \ users with status tracking.\n\n| Column | Type | Nullable | Default | Description\
    \ |\n|--------|------|----------|---------|-------------|\n| `id` | `UUID` | No\
    \ | `gen_random_uuid()` | Primary key |\n| `user_id` | `UUID` | No | — | Foreign\
    \ key to `profiles.id` - requester |\n| `friend_id` | `UUID` | No | — | Foreign\
    \ key to `profiles.id` - friend |\n| `status` | `VARCHAR(20)` | No | `'pending'`\
    \ | Relationship status (pending, accepted, declined) |\n| `created_at` | `TIMESTAMP_NTZ`\
    \ | No | `CURRENT_TIMESTAMP()` | Request creation timestamp |\n| `updated_at`\
    \ | `TIMESTAMP_NTZ` | No | `CURRENT_TIMESTAMP()` | Last status update timestamp\
    \ |\n\nIndexes:\n- Primary Key: `id`\n- Foreign Key: `user_id` → `profiles.id`\n\
    - Foreign Key: `friend_id` → `profiles.id`\n- Unique Index: `(user_id, friend_id)`\n\
    - Index: `status`\n- Index: `updated_at`\n\nConstraints:\n- `user_id` cannot equal\
    \ `friend_id`\n- Unique combination of `user_id` and `friend_id`\n\n---\n\nStores\
    \ user notifications for various events.\n\n| Column | Type | Nullable | Default\
    \ | Description |\n|--------|------|----------|---------|-------------|\n| `id`\
    \ | `UUID` | No | `gen_random_uuid()` | Primary key |\n| `user_id` | `UUID` |\
    \ No | — | Foreign key to `profiles.id` |\n| `type` | `VARCHAR(50)` | No | — |\
    \ Notification type (message, friend_request, etc.) |\n| `title` | `VARCHAR(255)`\
    \ | No | — | Notification title |\n| `message` | `VARCHAR(16777216)` | No | —\
    \ | Notification message content |\n| `data` | `VARIANT` | Yes | `NULL` | Additional\
    \ JSON data  |\n| `created_at` | `TIMESTAMP_NTZ` | No | `CURRENT_TIMESTAMP()`\
    \ | Creation timestamp |\n| `read` | `BOOLEAN` | No | `FALSE` | Read status flag\
    \ |\n| `updated_at` | `TIMESTAMP_NTZ` | No | `CURRENT_TIMESTAMP()` | Last update\
    \ timestamp |\n| `seen_at` | `TIMESTAMP_NTZ` | Yes | `NULL` | Timestamp when notification\
    \ was seen |\n\nIndexes:\n- Primary Key: `id`\n- Foreign Key: `user_id` → `profiles.id`\n\
    - Index: `(user_id, read)`\n- Index: `created_at`\n- Index: `type`\n\n---\n\n\
    Stores file attachment metadata for messages.\n\n| Column | Type | Nullable |\
    \ Default | Description |\n|--------|------|----------|---------|-------------|\n\
    | `id` | `UUID` | No | `gen_random_uuid()` | Primary key |\n| `message_id` | `UUID`\
    \ | Yes | `NULL` | Foreign key to `messages.id` |\n| `chat_id` | `UUID` | Yes\
    \ | `NULL` | Foreign key to `chats.id` |\n| `user_id` | `UUID` | Yes | `NULL`\
    \ | Foreign key to `profiles.id` - uploader |\n| `file_name` | `VARCHAR(255)`\
    \ | No | — | Original filename |\n| `file_size` | `INTEGER` | No | — | File size\
    \ in bytes |\n| `file_type` | `VARCHAR(100)` | No | — | MIME type |\n| `file_path`\
    \ | `VARCHAR(16777216)` | No | — | Storage path/URL |\n| `created_at` | `TIMESTAMP_NTZ`\
    \ | No | `CURRENT_TIMESTAMP()` | Upload timestamp |\n\nIndexes:\n- Primary Key:\
    \ `id`\n- Foreign Key: `message_id` → `messages.id`\n- Foreign Key: `chat_id`\
    \ → `chats.id`\n- Foreign Key: `user_id` → `profiles.id`\n- Index: `created_at`\n\
    \n---\n\nStores temporary anonymous chat rooms with join codes.\n\n| Column |\
    \ Type | Nullable | Default | Description |\n|--------|------|----------|---------|-------------|\n\
    | `id` | `UUID` | No | `gen_random_uuid()` | Primary key |\n| `join_code` | `VARCHAR(50)`\
    \ | Yes | `NULL` | Unique join code for anonymous access |\n| `created_at` | `TIMESTAMP_NTZ`\
    \ | No | `CURRENT_TIMESTAMP()` | Creation timestamp |\n| `expires_at` | `TIMESTAMP_NTZ`\
    \ | Yes | `NULL` | Expiration timestamp |\n\nIndexes:\n- Primary Key: `id`\n-\
    \ Unique Index: `join_code`\n- Index: `expires_at`\n\n---\n\nStores anonymous\
    \ users participating in anonymous chats.\n\n| Column | Type | Nullable | Default\
    \ | Description |\n|--------|------|----------|---------|-------------|\n| `id`\
    \ | `UUID` | No | `gen_random_uuid()` | Primary key |\n| `chat_id` | `UUID` |\
    \ No | — | Foreign key to `anonymous_chats.id` |\n| `guest_id` | `VARCHAR(100)`\
    \ | Yes | `NULL` | Temporary guest identifier |\n| `created_at` | `TIMESTAMP_NTZ`\
    \ | No | `CURRENT_TIMESTAMP()` | Join timestamp |\n\nIndexes:\n- Primary Key:\
    \ `id`\n- Foreign Key: `chat_id` → `anonymous_chats.id`\n- Index: `guest_id`\n\
    \n---\n\nStores messages in anonymous chat rooms.\n\n| Column | Type | Nullable\
    \ | Default | Description |\n|--------|------|----------|---------|-------------|\n\
    | `id` | `UUID` | No | `gen_random_uuid()` | Primary key |\n| `chat_id` | `UUID`\
    \ | No | — | Foreign key to `anonymous_chats.id` |\n| `guest_id` | `VARCHAR(100)`\
    \ | Yes | `NULL` | Guest identifier of sender |\n| `content` | `VARCHAR(16777216)`\
    \ | No | — | Message content |\n| `created_at` | `TIMESTAMP_NTZ` | No | `CURRENT_TIMESTAMP()`\
    \ | Message timestamp |\n\nIndexes:\n- Primary Key: `id`\n- Foreign Key: `chat_id`\
    \ → `anonymous_chats.id`\n- Index: `created_at`\n- Index: `(chat_id, created_at)`\n\
    \n---\n\nStores chat room invitations sent between users.\n\n| Column | Type |\
    \ Nullable | Default | Description |\n|--------|------|----------|---------|-------------|\n\
    | `id` | `UUID` | No | `gen_random_uuid()` | Primary key |\n| `chat_id` | `UUID`\
    \ | No | — | Foreign key to `chats.id` |\n| `inviting_user_id` | `UUID` | No |\
    \ — | Foreign key to `profiles.id` - inviter |\n| `invited_user_id` | `UUID` |\
    \ No | — | Foreign key to `profiles.id` - invitee |\n| `status` | `VARCHAR(20)`\
    \ | No | `'pending'` | Invitation status (pending, accepted, declined) |\n| `created_at`\
    \ | `TIMESTAMP_NTZ` | No | `CURRENT_TIMESTAMP()` | Invitation timestamp |\n\n\
    Indexes:\n- Primary Key: `id`\n- Foreign Key: `chat_id` → `chats.id`\n- Foreign\
    \ Key: `inviting_user_id` → `profiles.id`\n- Foreign Key: `invited_user_id` →\
    \ `profiles.id`\n- Unique Index: `(chat_id, invited_user_id)`\n- Index: `status`\n\
    - Index: `created_at`\n\n---\n\n---\n\n---\n\nThis database includes 30 production\
    \ SQL queries, each designed to solve specific business problems for companies\
    \ with $1M+ ARR. Each query includes:\n\n- Business Use Case: The specific business\
    \ problem this query solves\n- Description: Technical explanation of what the\
    \ query does\n- Client Deliverable: What output or report this query generates\n\
    - Business Value: The business impact and value delivered\n- Complexity: Technical\
    \ complexity indicators\n- SQL Code: Complete, production-ready SQL query\n\n\
    ---\n\nUse Case: How has aircraft altitude varied over the past year? I'd like\
    \ to see rolling averages and outlier counts broken down by day and aircraft.\n\
    \nDescription: Fleet operators monitor ADS-B telemetry to track how aircraft altitude\
    \ varies over time, helping them spot anomalies and identify maintenance needs\
    \ before they become critical. Each aircraft transmits a unique ICAO 24-bit transponder\
    \ hex code, and altitude is recorded in feet. Operators need daily summaries to\
    \ detect unusual patterns that might indicate sensor drift, flight envelope excursions,\
    \ or operational issues. Produce daily aggregated altitude statistics for each\
    \ aircraft, including rolling averages to smooth short-term fluctuations and outlier\
    \ counts to flag abnormal readings. The query constructs four common table expressions\
    \ (CTEs). First, it retains the 60 most recent telemetry points per aircraft to\
    \ limit memory usage. Second, it computes a 5-row rolling average of altitude\
    \ for each aircraft to identify trends. Third, it flags statistical outliers by\
    \ calculating z-scores and marking any reading that exceeds 2 standard deviations\
    \ from the mean; when\n\nBusiness Value: Aggregated metrics grouped by day and\
    \ hex\n\nComplexity: moderate\n\n---\n\nUse Case: Can you show me weekly altitude\
    \ statistics grouped by speed range? I need quartiles, outlier counts, and how\
    \ many readings show an upward trend.\n\nDescription: Flight analysts want to\
    \ understand how altitude behavior differs across groundspeed ranges (measured\
    \ in knots) to identify whether fast-flying aircraft exhibit different operational\
    \ patterns than slower ones. For example, cruise-speed flight may show tighter\
    \ altitude clustering, while climb or descent phases at different speeds may show\
    \ more variability. This comparison helps optimize flight profiles and detect\
    \ speed-related anomalies. Produce weekly altitude statistics segmented by speed\
    \ bucket, including quartiles to show distribution, counts of statistical outliers,\
    \ and counts of readings that are trending upward. The query groups telemetry\
    \ by week and speed bucket. Within each speed bucket, it divides altitude readings\
    \ into sextiles (six equal-frequency bins) to capture distribution shape. It calculates\
    \ z-scores for each reading and flags those exceeding 2 standard deviations as\
    \ outliers. Using the LAG and LEAD window functions, it compares each altitude\
    \ re\n\nBusiness Value: Aggregated metrics grouped by week and speed\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: Give me monthly altitude summaries for each aircraft—quartiles,\
    \ median, outlier count, and rolling average.\n\nDescription: Fleet managers produce\
    \ monthly reports to track long-term altitude trends for each aircraft and identify\
    \ seasonal or cyclical patterns that might affect operations. Monthly aggregation\
    \ smooths out daily noise and reveals gradual shifts in flight behavior, such\
    \ as changes in typical cruise altitude or increased variability that could indicate\
    \ equipment degradation. These reports support strategic decisions about fleet\
    \ deployment, maintenance scheduling, and route optimization. Produce monthly\
    \ altitude summaries for each aircraft, including quartiles to show distribution\
    \ spread, median to identify the central tendency, outlier count to flag anomalies,\
    \ and rolling average to reveal trends across months. The query groups telemetry\
    \ by month and aircraft hex code. For each group, it uses the PERCENTILE_CONT\
    \ function to calculate the first quartile (Q1), median (Q2), and third quartile\
    \ (Q3), providing a robust view of altitude distribution. It computes a 6-row\
    \ rolling\n\nBusiness Value: Aggregated metrics grouped by month and hex\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: I need a daily altitude breakdown by speed—how\
    \ many outliers are there, how many readings are increasing, and what's the maximum\
    \ cumulative sum?\n\nDescription: Operations teams want to understand whether\
    \ certain flight speed regimes—such as cruise versus climb or descent—exhibit\
    \ more altitude anomalies or different trend behaviors. Daily breakdowns by speed\
    \ help pinpoint whether specific phases of flight are associated with sensor issues,\
    \ pilot technique variations, or airspace constraints. The cumulative sum metric\
    \ helps identify which speed ranges accumulate the most altitude change, which\
    \ can indicate workload or operational complexity. Produce daily altitude statistics\
    \ segmented by speed, including the count of outlier readings, the count of readings\
    \ showing an increasing trend, and the peak cumulative sum of altitude changes\
    \ within each speed bucket. The query groups telemetry by date and speed. For\
    \ each group, it calculates a running cumulative sum of altitude changes to track\
    \ total vertical movement within that speed bucket. It applies a 7-row rolling\
    \ window to compute moving statistics and divides altitude int\n\nBusiness Value:\
    \ Aggregated metrics grouped by day and speed\n\nComplexity: moderate\n\n---\n\
    \nUse Case: Show me weekly altitude metrics for each aircraft—record count, quartiles,\
    \ standard deviation, and how many readings are trending upward.\n\nDescription:\
    \ Fleet analysts compare altitude variability and trend direction across aircraft\
    \ on a weekly basis to identify which units are behaving normally and which may\
    \ require attention. Standard deviation is a key indicator of altitude stability—low\
    \ standard deviation suggests consistent flight behavior, while high standard\
    \ deviation may indicate erratic altitude changes due to turbulence, equipment\
    \ issues, or unusual flight profiles. Combining variability measures with trend\
    \ counts helps prioritize follow-up investigations. Produce weekly altitude metrics\
    \ for each aircraft, including the number of telemetry records, altitude quartiles\
    \ to show distribution, standard deviation to quantify variability, and a count\
    \ of readings where altitude is increasing to assess climb behavior. The query\
    \ groups telemetry by week and aircraft hex code. For each group, it calculates\
    \ the standard deviation of altitude to measure dispersion around the mean, and\
    \ computes quartiles (Q1, Q3) t\n\nBusiness Value: Aggregated metrics grouped\
    \ by week and hex\n\nComplexity: moderate\n\n---\n\nUse Case: I need daily altitude\
    \ statistics broken down by speed bucket, including quartiles, a rolling average,\
    \ and a count of outlier readings.\n\nDescription: Flight operations analysts\
    \ monitor daily altitude patterns across different speed regimes to identify anomalies\
    \ that may indicate instrumentation issues, unusual weather encounters, or non-standard\
    \ flight profiles. Speed buckets help isolate behavior in climb, cruise, and descent\
    \ phases. Produce daily altitude statistics segmented by speed bucket, including\
    \ quartile distributions, a rolling average for trend smoothing, and a count of\
    \ statistical outliers. The query groups records by calendar day and speed bucket,\
    \ extracts hour and day-of-week for temporal context, computes z-scores for each\
    \ altitude reading using the mean and standard deviation of the group (defaulting\
    \ to zero when standard deviation is zero to prevent division errors), flags outliers\
    \ as readings with absolute z-score above a threshold, calculates a 5-row rolling\
    \ average of altitude to smooth short-term fluctuations, and filters to groups\
    \ with at least 2 records to ensure statistical validity.\n\nBusiness Value: Aggregated\
    \ metrics grouped by day and speed\n\nComplexity: moderate\n\n---\n\nUse Case:\
    \ I want a monthly altitude analysis for each aircraft hex code, including quartiles,\
    \ minimum and maximum values, outlier count, and the maximum cumulative sum.\n\
    \nDescription: Fleet managers need monthly summaries of altitude performance for\
    \ each aircraft to compare operational profiles, assess consistency across the\
    \ fleet, and identify aircraft with unusual altitude distributions or high cumulative\
    \ activity that may require maintenance review. Produce monthly altitude statistics\
    \ for each aircraft hex code, including quartile distributions, minimum and maximum\
    \ altitudes, a count of statistical outliers, and the maximum value of a cumulative\
    \ altitude sum. The query groups records by month and aircraft hex code, captures\
    \ the minimum and maximum altitude values to show the operational range, flags\
    \ outliers as readings with z-score above 2 standard deviations from the group\
    \ mean, limits analysis to the most recent 80 data points per aircraft to focus\
    \ on recent behavior, computes PERCENT_RANK to understand each reading's relative\
    \ position within the month, calculates a cumulative sum of altitude over time-ordered\
    \ readings using a window f\n\nBusiness Value: Aggregated metrics grouped by month\
    \ and hex\n\nComplexity: moderate\n\n---\n\nUse Case: I need daily altitude statistics\
    \ by aircraft hex code showing gaps between consecutive readings, sequential altitude\
    \ differences, and quartiles.\n\nDescription: Safety analysts need to detect rapid\
    \ altitude changes between consecutive readings for each aircraft, as sudden climbs\
    \ or descents may indicate turbulence, emergency maneuvers, or data quality issues.\
    \ Understanding the time gaps between readings also helps assess data continuity.\
    \ Produce daily altitude statistics for each aircraft hex code, including sequential\
    \ differences between consecutive altitude readings and quartile distributions.\
    \ The query groups records by calendar day and aircraft hex code, orders readings\
    \ chronologically by timestamp, uses the LAG window function to retrieve the previous\
    \ altitude reading for each row (with the first reading per aircraft having no\
    \ prior value and thus NULL), computes the altitude difference from the prior\
    \ reading (current minus previous), derives a trend direction indicator from the\
    \ sign of that difference (climbing, descending, or level), uses LAG to capture\
    \ the previous altitude value and LEAD to capture the next al\n\nBusiness Value:\
    \ Aggregated metrics grouped by day and speed\n\nComplexity: moderate\n\n---\n\
    \nUse Case: I need daily altitude statistics by speed bucket with z-score-based\
    \ anomaly detection, quartiles, and counts of different trend directions.\n\n\
    Description: Quality assurance teams monitor altitude behavior within specific\
    \ speed regimes to detect anomalies such as unexpected altitude holds during high-speed\
    \ segments or erratic altitude changes during approach speeds. Identifying statistical\
    \ outliers helps flag data for manual review or operational investigation. Produce\
    \ daily altitude statistics segmented by speed bucket, including z-score-based\
    \ anomaly detection, quartile distributions, and counts of increasing versus decreasing\
    \ altitude trends. The query groups records by calendar day and speed bucket,\
    \ computes the mean and standard deviation of altitude for each group, flags anomalies\
    \ as readings where altitude deviates by more than 2 standard deviations from\
    \ the partition mean, safely handles cases where standard deviation is zero (preventing\
    \ division errors by using a conditional check), segments the altitude distribution\
    \ into octiles (8 equal-frequency bins) to understand the shape of the distribution,\
    \ calcul\n\nBusiness Value: Aggregated metrics grouped by week and hex\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: I want weekly altitude statistics by aircraft hex\
    \ code with recency and frequency scoring, quartiles, and a rolling average.\n\
    \nDescription: Maintenance planners prioritize aircraft inspections based on activity\
    \ patterns, using recency (how recently an aircraft was active) and frequency\
    \ (how often it appears in the data) as key indicators. Aircraft that are both\
    \ frequently active and recently observed may require earlier inspection scheduling.\
    \ Produce weekly altitude statistics for each aircraft hex code, incorporating\
    \ recency-frequency style metrics along with quartile distributions and rolling\
    \ averages. The query groups records by calendar week and aircraft hex code, assigns\
    \ a ROW_NUMBER to each reading ordered by timestamp descending to score recency\
    \ (with 1 being the most recent reading), uses the total record count per aircraft\
    \ per week as a frequency proxy to measure activity level, ranks aircraft by their\
    \ cumulative sum of altitude to identify those with the highest total activity,\
    \ computes a 6-row rolling average of altitude to smooth week-to-week variation,\
    \ filters to groups with at least 3\n\nBusiness Value: Aggregated metrics grouped\
    \ by month and speed\n\nComplexity: moderate\n\n---\n\nUse Case: What are the\
    \ monthly altitude patterns across different speed ranges, analyzed like cohort\
    \ retention with quartile distributions?\n\nDescription: Aviation analysts need\
    \ to understand how aircraft altitude behavior varies across different speed regimes\
    \ over time, similar to how product teams track user cohorts, to identify performance\
    \ patterns and anomalies in flight operations. Generate monthly altitude statistics\
    \ segmented by speed bucket with cohort-style progression metrics and quartile\
    \ distributions. The SQL query treats each speed range as a distinct cohort and\
    \ tracks altitude as the primary metric. It limits the dataset to 90 data points\
    \ per speed bucket for performance. Window functions calculate increasing_count\
    \ to measure how many periods show growth (analogous to retention) and trend_direction\
