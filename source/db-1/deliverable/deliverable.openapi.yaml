openapi: 3.0.3
info:
  title: Database db-1 - Database API Specification
  description: "This database implements a comprehensive chat/messaging system supporting\
    \ user profiles, chat rooms, messages, friend networks, notifications, file attachments,\
    \ anonymous chats, and chat invitations. The system is designed to work across\
    \ PostgreSQL database platforms.\n\n- User Management: User profiles with authentication,\
    \ roles, and AI character associations\n- Chat System: Multi-user chat rooms with\
    \ participants and message threads\n- Social Network: Friend connections with\
    \ status tracking (accepted, pending, declined)\n- Notifications: Real-time notification\
    \ system for user events\n- File Attachments: File sharing capabilities within\
    \ chats\n- Anonymous Chats: Temporary anonymous chat rooms with join codes\n-\
    \ Chat Invitations: Invitation system for chat room access\n\n- PostgreSQL: Full\
    \ support with UUID types, arrays, and JSONB\n- , : Compatible with Delta Lake\
    \ format\n- , : Full support with VARIANT types\n\n---\n\n---\n\nThis section\
    \ provides a comprehensive data dictionary for all tables in the database, including\
    \ column names, data types, constraints, and descriptions. Tables are organized\
    \ by functional category for easier navigation.\n\nThe database consists of 12\
    \ tables organized into logical groups:\n\n1. User Management: `profiles`\n2.\
    \ Chat System: `chats`, `chat_participants`, `messages`\n3. Social Network: `friends`\n\
    4. Notifications: `notifications`\n5. File Management: `file_attachments`\n6.\
    \ Anonymous Features: `anonymous_chats`, `anonymous_chat_users`, `anonymous_messages`\n\
    7. Invitations: `chat_invitations`\n8. Analytics: `aircraft_position_history`\
    \ (time-series)\n\n---\n\nStores user profile information including authentication\
    \ details, preferences, and AI character associations.\n\n| Column | Type | Nullable\
    \ | Default | Description |\n|--------|------|----------|---------|-------------|\n\
    | `id` | `UUID` | No | `gen_random_uuid()` | Primary key - unique user identifier\
    \ |\n| `username` | `VARCHAR(255)` | No | — | Unique username for login |\n| `display_name`\
    \ | `VARCHAR(255)` | No | — | Display name shown in UI |\n| `avatar_url` | `VARCHAR(16777216)`\
    \ | No | — | URL to user avatar image |\n| `created_at` | `TIMESTAMP_NTZ` | No\
    \ | `CURRENT_TIMESTAMP()` | Account creation timestamp |\n| `updated_at` | `TIMESTAMP_NTZ`\
    \ | No | `CURRENT_TIMESTAMP()` | Last profile update timestamp |\n| `ai_character_id`\
    \ | `VARCHAR(255)` | Yes | `NULL` | Associated AI character identifier |\n| `user_role`\
    \ | `VARCHAR(50)` | No | `'user'` | User role (user, admin, moderator) |\n| `email`\
    \ | `VARCHAR(255)` | No | — | User email address |\n| `bio` | `VARCHAR(16777216)`\
    \ | Yes | `NULL` | User biography text |\n| `last_username_changed_at` | `TIMESTAMP_NTZ`\
    \ | Yes | `NULL` | Timestamp of last username change |\n| `prompt_username_setup`\
    \ | `BOOLEAN` | No | `FALSE` | Flag indicating if username setup was prompted\
    \ |\n\nIndexes:\n- Primary Key: `id`\n- Unique Index: `username`\n- Index: `email`\n\
    - Index: `created_at`\n\nConstraints:\n- `username` must be unique\n- `email`\
    \ must be unique\n\n---\n\nStores chat room information including metadata and\
    \ AI character associations.\n\n| Column | Type | Nullable | Default | Description\
    \ |\n|--------|------|----------|---------|-------------|\n| `id` | `UUID` | No\
    \ | `gen_random_uuid()` | Primary key - unique chat identifier |\n| `title` |\
    \ `VARCHAR(255)` | No | — | Chat room title |\n| `created_at` | `TIMESTAMP_NTZ`\
    \ | No | `CURRENT_TIMESTAMP()` | Chat creation timestamp |\n| `updated_at` | `TIMESTAMP_NTZ`\
    \ | No | `CURRENT_TIMESTAMP()` | Last update timestamp |\n| `current_ai_character_id`\
    \ | `VARCHAR(255)` | Yes | `NULL` | Currently active AI character |\n| `created_by`\
    \ | `UUID` | No | — | Foreign key to `profiles.id` - creator |\n\nIndexes:\n-\
    \ Primary Key: `id`\n- Foreign Key: `created_by` → `profiles.id`\n- Index: `created_at`\n\
    - Index: `updated_at`\n\n---\n\nJunction table linking users to chat rooms they\
    \ participate in.\n\n| Column | Type | Nullable | Default | Description |\n|--------|------|----------|---------|-------------|\n\
    | `chat_id` | `UUID` | No | — | Foreign key to `chats.id` |\n| `user_id` | `UUID`\
    \ | No | — | Foreign key to `profiles.id` |\n| `joined_at` | `TIMESTAMP_NTZ` |\
    \ No | `CURRENT_TIMESTAMP()` | Timestamp when user joined |\n\nIndexes:\n- Composite\
    \ Primary Key: `(chat_id, user_id)`\n- Foreign Key: `chat_id` → `chats.id`\n-\
    \ Foreign Key: `user_id` → `profiles.id`\n- Index: `joined_at`\n\nConstraints:\n\
    - Unique combination of `chat_id` and `user_id`\n\n---\n\nStores individual messages\
    \ within chat rooms, supporting both user and AI-generated messages.\n\n| Column\
    \ | Type | Nullable | Default | Description |\n|--------|------|----------|---------|-------------|\n\
    | `id` | `UUID` | No | `gen_random_uuid()` | Primary key - unique message identifier\
    \ |\n| `chat_id` | `UUID` | No | — | Foreign key to `chats.id` |\n| `sender_id`\
    \ | `UUID` | Yes | `NULL` | Foreign key to `profiles.id` (NULL for system messages)\
    \ |\n| `content` | `VARCHAR(16777216)` | No | — | Message text content |\n| `is_ai`\
    \ | `BOOLEAN` | No | `FALSE` | Flag indicating AI-generated message |\n| `ai_character_id`\
    \ | `VARCHAR(255)` | Yes | `NULL` | AI character identifier if AI message |\n\
    | `created_at` | `TIMESTAMP_NTZ` | No | `CURRENT_TIMESTAMP()` | Message creation\
    \ timestamp |\n| `updated_at` | `TIMESTAMP_NTZ` | No | `CURRENT_TIMESTAMP()` |\
    \ Last update timestamp |\n| `deleted_at` | `TIMESTAMP_NTZ` | Yes | `NULL` | Soft\
    \ delete timestamp |\n| `mentioned_users` | `ARRAY(VARCHAR)` | Yes | `NULL` |\
    \ Array of mentioned user IDs |\n| `is_system_message` | `BOOLEAN` | No | `FALSE`\
    \ | Flag indicating system-generated message |\n| `mentions_data` | `VARIANT`\
    \ | Yes | `NULL` | JSON data for mentions  |\n\nIndexes:\n- Primary Key: `id`\n\
    - Foreign Key: `chat_id` → `chats.id`\n- Foreign Key: `sender_id` → `profiles.id`\n\
    - Index: `created_at`\n- Index: `(chat_id, created_at)`\n- Index: `deleted_at`\
    \ WHERE `deleted_at IS NULL`\n\nConstraints:\n- `sender_id` must be NULL if `is_system_message`\
    \ is TRUE\n- `content` cannot be empty\n\n---\n\nStores friend relationships between\
    \ users with status tracking.\n\n| Column | Type | Nullable | Default | Description\
    \ |\n|--------|------|----------|---------|-------------|\n| `id` | `UUID` | No\
    \ | `gen_random_uuid()` | Primary key |\n| `user_id` | `UUID` | No | — | Foreign\
    \ key to `profiles.id` - requester |\n| `friend_id` | `UUID` | No | — | Foreign\
    \ key to `profiles.id` - friend |\n| `status` | `VARCHAR(20)` | No | `'pending'`\
    \ | Relationship status (pending, accepted, declined) |\n| `created_at` | `TIMESTAMP_NTZ`\
    \ | No | `CURRENT_TIMESTAMP()` | Request creation timestamp |\n| `updated_at`\
    \ | `TIMESTAMP_NTZ` | No | `CURRENT_TIMESTAMP()` | Last status update timestamp\
    \ |\n\nIndexes:\n- Primary Key: `id`\n- Foreign Key: `user_id` → `profiles.id`\n\
    - Foreign Key: `friend_id` → `profiles.id`\n- Unique Index: `(user_id, friend_id)`\n\
    - Index: `status`\n- Index: `updated_at`\n\nConstraints:\n- `user_id` cannot equal\
    \ `friend_id`\n- Unique combination of `user_id` and `friend_id`\n\n---\n\nStores\
    \ user notifications for various events.\n\n| Column | Type | Nullable | Default\
    \ | Description |\n|--------|------|----------|---------|-------------|\n| `id`\
    \ | `UUID` | No | `gen_random_uuid()` | Primary key |\n| `user_id` | `UUID` |\
    \ No | — | Foreign key to `profiles.id` |\n| `type` | `VARCHAR(50)` | No | — |\
    \ Notification type (message, friend_request, etc.) |\n| `title` | `VARCHAR(255)`\
    \ | No | — | Notification title |\n| `message` | `VARCHAR(16777216)` | No | —\
    \ | Notification message content |\n| `data` | `VARIANT` | Yes | `NULL` | Additional\
    \ JSON data  |\n| `created_at` | `TIMESTAMP_NTZ` | No | `CURRENT_TIMESTAMP()`\
    \ | Creation timestamp |\n| `read` | `BOOLEAN` | No | `FALSE` | Read status flag\
    \ |\n| `updated_at` | `TIMESTAMP_NTZ` | No | `CURRENT_TIMESTAMP()` | Last update\
    \ timestamp |\n| `seen_at` | `TIMESTAMP_NTZ` | Yes | `NULL` | Timestamp when notification\
    \ was seen |\n\nIndexes:\n- Primary Key: `id`\n- Foreign Key: `user_id` → `profiles.id`\n\
    - Index: `(user_id, read)`\n- Index: `created_at`\n- Index: `type`\n\n---\n\n\
    Stores file attachment metadata for messages.\n\n| Column | Type | Nullable |\
    \ Default | Description |\n|--------|------|----------|---------|-------------|\n\
    | `id` | `UUID` | No | `gen_random_uuid()` | Primary key |\n| `message_id` | `UUID`\
    \ | Yes | `NULL` | Foreign key to `messages.id` |\n| `chat_id` | `UUID` | Yes\
    \ | `NULL` | Foreign key to `chats.id` |\n| `user_id` | `UUID` | Yes | `NULL`\
    \ | Foreign key to `profiles.id` - uploader |\n| `file_name` | `VARCHAR(255)`\
    \ | No | — | Original filename |\n| `file_size` | `INTEGER` | No | — | File size\
    \ in bytes |\n| `file_type` | `VARCHAR(100)` | No | — | MIME type |\n| `file_path`\
    \ | `VARCHAR(16777216)` | No | — | Storage path/URL |\n| `created_at` | `TIMESTAMP_NTZ`\
    \ | No | `CURRENT_TIMESTAMP()` | Upload timestamp |\n\nIndexes:\n- Primary Key:\
    \ `id`\n- Foreign Key: `message_id` → `messages.id`\n- Foreign Key: `chat_id`\
    \ → `chats.id`\n- Foreign Key: `user_id` → `profiles.id`\n- Index: `created_at`\n\
    \n---\n\nStores temporary anonymous chat rooms with join codes.\n\n| Column |\
    \ Type | Nullable | Default | Description |\n|--------|------|----------|---------|-------------|\n\
    | `id` | `UUID` | No | `gen_random_uuid()` | Primary key |\n| `join_code` | `VARCHAR(50)`\
    \ | Yes | `NULL` | Unique join code for anonymous access |\n| `created_at` | `TIMESTAMP_NTZ`\
    \ | No | `CURRENT_TIMESTAMP()` | Creation timestamp |\n| `expires_at` | `TIMESTAMP_NTZ`\
    \ | Yes | `NULL` | Expiration timestamp |\n\nIndexes:\n- Primary Key: `id`\n-\
    \ Unique Index: `join_code`\n- Index: `expires_at`\n\n---\n\nStores anonymous\
    \ users participating in anonymous chats.\n\n| Column | Type | Nullable | Default\
    \ | Description |\n|--------|------|----------|---------|-------------|\n| `id`\
    \ | `UUID` | No | `gen_random_uuid()` | Primary key |\n| `chat_id` | `UUID` |\
    \ No | — | Foreign key to `anonymous_chats.id` |\n| `guest_id` | `VARCHAR(100)`\
    \ | Yes | `NULL` | Temporary guest identifier |\n| `created_at` | `TIMESTAMP_NTZ`\
    \ | No | `CURRENT_TIMESTAMP()` | Join timestamp |\n\nIndexes:\n- Primary Key:\
    \ `id`\n- Foreign Key: `chat_id` → `anonymous_chats.id`\n- Index: `guest_id`\n\
    \n---\n\nStores messages in anonymous chat rooms.\n\n| Column | Type | Nullable\
    \ | Default | Description |\n|--------|------|----------|---------|-------------|\n\
    | `id` | `UUID` | No | `gen_random_uuid()` | Primary key |\n| `chat_id` | `UUID`\
    \ | No | — | Foreign key to `anonymous_chats.id` |\n| `guest_id` | `VARCHAR(100)`\
    \ | Yes | `NULL` | Guest identifier of sender |\n| `content` | `VARCHAR(16777216)`\
    \ | No | — | Message content |\n| `created_at` | `TIMESTAMP_NTZ` | No | `CURRENT_TIMESTAMP()`\
    \ | Message timestamp |\n\nIndexes:\n- Primary Key: `id`\n- Foreign Key: `chat_id`\
    \ → `anonymous_chats.id`\n- Index: `created_at`\n- Index: `(chat_id, created_at)`\n\
    \n---\n\nStores chat room invitations sent between users.\n\n| Column | Type |\
    \ Nullable | Default | Description |\n|--------|------|----------|---------|-------------|\n\
    | `id` | `UUID` | No | `gen_random_uuid()` | Primary key |\n| `chat_id` | `UUID`\
    \ | No | — | Foreign key to `chats.id` |\n| `inviting_user_id` | `UUID` | No |\
    \ — | Foreign key to `profiles.id` - inviter |\n| `invited_user_id` | `UUID` |\
    \ No | — | Foreign key to `profiles.id` - invitee |\n| `status` | `VARCHAR(20)`\
    \ | No | `'pending'` | Invitation status (pending, accepted, declined) |\n| `created_at`\
    \ | `TIMESTAMP_NTZ` | No | `CURRENT_TIMESTAMP()` | Invitation timestamp |\n\n\
    Indexes:\n- Primary Key: `id`\n- Foreign Key: `chat_id` → `chats.id`\n- Foreign\
    \ Key: `inviting_user_id` → `profiles.id`\n- Foreign Key: `invited_user_id` →\
    \ `profiles.id`\n- Unique Index: `(chat_id, invited_user_id)`\n- Index: `status`\n\
    - Index: `created_at`\n\n---\n\n---\n\n---\n\nThis database includes 30 production\
    \ SQL queries, each designed to solve specific business problems for companies\
    \ with $1M+ ARR. Each query includes:\n\n- Business Use Case: The specific business\
    \ problem this query solves\n- Description: Technical explanation of what the\
    \ query does\n- Client Deliverable: What output or report this query generates\n\
    - Business Value: The business impact and value delivered\n- Complexity: Technical\
    \ complexity indicators\n- SQL Code: Complete, production-ready SQL query\n\n\
    ---\n\nUse Case: How has aircraft altitude varied over the past year? I'd like\
    \ to see rolling averages and outlier counts broken down by day and aircraft.\n\
    \nDescription: The query constructs four CTEs. First, it retains the 60 most recent\
    \ telemetry points per aircraft (cte_level_1). Second, it computes a 5-row rolling\
    \ average and cumulative sum via window functions (cte_level_2). Third, it uses\
    \ LAG, LEAD, and partition statistics for trend and z-score calculation (cte_level_3).\
    \ Fourth, it flags outliers (z-score > 2) and trend direction, then aggregates\
    \ by day and hex with PERCENTILE_CONT, SUM for outlier/increasing counts, and\
    \ AVG for rolling average.\n\nBusiness Value: Aggregated metrics grouped by day\
    \ and hex\n\nComplexity: moderate\n\n---\n\nUse Case: Can you show me weekly altitude\
    \ statistics grouped by speed range? I need quartiles, outlier counts, and how\
    \ many readings show an upward trend.\n\nDescription: The query groups telemetry\
    \ by week and speed bucket. It divides altitude into sextiles (NTILE(6)), calculates\
    \ z-scores per partition, flags outliers (>2 std dev), and uses LAG/LEAD to compare\
    \ consecutive readings for trend direction. Aggregates include quartiles (PERCENTILE_CONT),\
    \ outlier count, and increasing-trend count.\n\nBusiness Value: Aggregated metrics\
    \ grouped by week and speed\n\nComplexity: moderate\n\n---\n\nUse Case: Give me\
    \ monthly altitude summaries for each aircraft—quartiles, median, outlier count,\
    \ and rolling average.\n\nDescription: The query groups by month and aircraft\
    \ hex. It uses PERCENTILE_CONT for Q1, median, Q3; computes a 6-row rolling average;\
    \ flags outliers via z-score; and aggregates record count, stddev, min, max, outlier\
    \ count, and increasing count. ROW_NUMBER limits to 80 points per aircraft.\n\n\
    Business Value: Aggregated metrics grouped by month and hex\n\nComplexity: moderate\n\
    \n---\n\nUse Case: I need a daily altitude breakdown by speed—how many outliers\
    \ are there, how many readings are increasing, and what's the maximum cumulative\
    \ sum?\n\nDescription: The query groups by date and speed. It calculates running\
    \ cumulative sum of altitude changes, applies a 7-row rolling window, uses NTILE(8)\
    \ for distribution, and aggregates outlier count, increasing-trend count, and\
    \ max cumulative sum per group.\n\nBusiness Value: Aggregated metrics grouped\
    \ by day and speed\n\nComplexity: moderate\n\n---\n\nUse Case: Show me weekly\
    \ altitude metrics for each aircraft—record count, quartiles, standard deviation,\
    \ and how many readings are trending upward.\n\nDescription: The query groups\
    \ by week and hex. It calculates STDDEV, PERCENTILE_CONT for quartiles, and uses\
    \ LAG/LEAD with delta_value to derive trend_direction. Aggregates include record\
    \ count, quartiles, stddev, outlier count, and increasing count. ROW_NUMBER limits\
    \ to 100 points per aircraft.\n\nBusiness Value: Aggregated metrics grouped by\
    \ week and hex\n\nComplexity: moderate\n\n---\n\nUse Case: I need daily altitude\
    \ statistics broken down by speed bucket, including quartiles, a rolling average,\
    \ and a count of outlier readings.\n\nDescription: The query groups by day and\
    \ speed bucket. It computes z-scores (mean, stddev per partition; zero when stddev=0),\
    \ flags outliers, calculates a 5-row rolling average, and filters to groups with\
    \ ≥2 records. Output includes quartiles, rolling average, and outlier count.\n\
    \nBusiness Value: Aggregated metrics grouped by day and speed\n\nComplexity: moderate\n\
    \n---\n\nUse Case: I want a monthly altitude analysis for each aircraft hex code,\
    \ including quartiles, minimum and maximum values, outlier count, and the maximum\
    \ cumulative sum.\n\nDescription: The query groups by month and hex. It captures\
    \ min/max altitude, flags outliers (z-score > 2), limits to 80 points per aircraft,\
    \ uses PERCENT_RANK, and calculates cumulative sum via window. Aggregates include\
    \ quartiles, min, max, outlier count, and max cumulative sum.\n\nBusiness Value:\
    \ Aggregated metrics grouped by month and hex\n\nComplexity: moderate\n\n---\n\
    \nUse Case: I need daily altitude statistics by aircraft hex code showing gaps\
    \ between consecutive readings, sequential altitude differences, and quartiles.\n\
    \nDescription: The query groups by day and hex. It uses LAG to get previous altitude,\
    \ computes delta (current minus previous), derives trend_direction from the sign,\
    \ and uses LEAD for next value. Aggregates include quartiles and sequential difference\
    \ metrics.\n\nBusiness Value: Aggregated metrics grouped by day and speed\n\n\
    Complexity: moderate\n\n---\n\nUse Case: I need daily altitude statistics by speed\
    \ bucket with z-score-based anomaly detection, quartiles, and counts of different\
    \ trend directions.\n\nDescription: The query groups by day and speed bucket.\
    \ It computes mean and stddev per group, flags anomalies (|z| > 2), handles stddev=0\
    \ safely, segments into octiles (NTILE(8)), and aggregates quartiles, outlier\
    \ count, and trend direction counts.\n\nBusiness Value: Aggregated metrics grouped\
    \ by week and hex\n\nComplexity: moderate\n\n---\n\nUse Case: I want weekly altitude\
    \ statistics by aircraft hex code with recency and frequency scoring, quartiles,\
    \ and a rolling average.\n\nDescription: The query groups by week and hex. It\
    \ assigns ROW_NUMBER (desc timestamp) for recency scoring, uses record count as\
    \ frequency proxy, ranks by cumulative sum, computes 6-row rolling average, and\
    \ filters to groups with ≥3 records. Output includes quartiles and rolling average.\n\
    \nBusiness Value: Aggregated metrics grouped by month and speed\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: What are the monthly altitude patterns across different\
    \ speed ranges, analyzed like cohort retention with quartile distributions?\n\n\
    Description: The query treats each speed range as a cohort. It limits to 90 points\
    \ per speed bucket, uses window functions for increasing_count and trend_direction\
    \ (analogous to retention), and orders by time period and average value. Output\
    \ includes cohort-style progression and quartile boundaries.\n\nBusiness Value:\
    \ Aggregated metrics grouped by day and hex\n\nComplexity: moderate\n\n---\n\n\
    Use Case: What are the daily altitude change patterns for each aircraft, including\
    \ acceleration-like metrics, quartiles, and outlier detection?\n\nDescription:\
    \ The query uses LAG to create first derivative (altitude change). trend_direction\
    \ captures sign of change. LAG and LEAD together enable second-order derivative\
    \ (rate of change of rate). Z-scores flag outliers. Limited to 60 points per aircraft.\
    \ Output includes change rate metrics, quartiles, and outlier count.\n\nBusiness\
    \ Value: Aggregated metrics grouped by week and speed\n\nComplexity: moderate\n\
    \n---\n\nUse Case: How do weekly altitude distributions compare across speed categories,\
    \ with percentile rankings and quartile breakdowns?\n\nDescription: The query\
    \ employs PERCENT_RANK for cross-category benchmarking and PERCENTILE_CONT for\
    \ percentile values. Data segmented into sextiles. Speed categories ranked by\
    \ cumulative altitude sum. Partition-level avg/stddev enable z-scores. Output\
    \ includes percentile rankings and quartile distributions.\n\nBusiness Value:\
    \ Aggregated metrics grouped by month and hex\n\nComplexity: moderate\n\n---\n\
    \nUse Case: What are the monthly altitude trends for each aircraft using smoothed\
    \ moving averages, with quartiles and trend pattern counts?\n\nDescription: The\
    \ query implements a 6-row rolling window for simple moving average (avg_rolling).\
    \ It counts periods where altitude is increasing and flags statistical outliers.\
    \ Limited to 80 points per aircraft, minimum 1 record per group. Output includes\
    \ quartiles and trend pattern counts.\n\nBusiness Value: Aggregated metrics grouped\
    \ by day and speed\n\nComplexity: moderate\n\n---\n\nUse Case: What are the daily\
    \ peak altitude periods for each speed category, including efficiency metrics\
    \ and quartile distributions?\n\nDescription: The query ranks altitude within\
    \ each day using window functions to identify peaks per speed category. Extracts\
    \ hour and day-of-week for temporal analysis. Calculates max_cumulative and avg_rolling\
    \ as efficiency proxies. Output includes peak period identification and quartile\
    \ distributions.\n\nBusiness Value: Aggregated metrics grouped by week and hex\n\
    \nComplexity: moderate\n\n---\n\nUse Case: What are the weekly altitude statistics\
    \ for each aircraft with lifetime value metrics, quartiles, and cumulative totals?\n\
    \nDescription: The query computes cumulative_sum as total exposure proxy, tracks\
    \ max_cumulative for lifetime activity, ranks aircraft by cumulative sum, applies\
    \ PERCENT_RANK for quartile placement. Limited to 60 points per aircraft, ≥3 records\
    \ per group. Output includes LTV metrics, quartiles, and cumulative totals.\n\n\
    Business Value: Aggregated metrics grouped by month and speed\n\nComplexity: moderate\n\
    \n---\n\nUse Case: How do monthly altitude patterns vary by speed range with year-over-year\
    \ growth analysis and quartiles?\n\nDescription: The query extracts hour_val and\
    \ dow_val for temporal context. It uses window functions (rolling avg, cumulative\
    \ sum, LAG, LEAD) and aggregates by period and hex. Output includes temporal correlation\
    \ metrics.\n\nBusiness Value: Aggregated metrics grouped by day and hex\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: What are the daily altitude statistics by aircraft\
    \ for creating heatmap visualizations with quartiles and outliers?\n\nDescription:\
    \ The query segments by speed and time period. It uses PARTITION BY speed for\
    \ window functions, groups by week and speed, and produces regime-specific aggregates\
    \ including quartiles and trend counts.\n\nBusiness Value: Aggregated metrics\
    \ grouped by week and speed\n\nComplexity: moderate\n\n---\n\nUse Case: What are\
    \ the weekly altitude statistics by speed range showing running percentile distributions,\
    \ quartiles, and trend patterns?\n\nDescription: The query calculates STDDEV per\
    \ partition as volatility measure. It uses PERCENTILE_CONT for quartiles and trend_direction\
    \ for consistency. Aggregates include stddev, quartiles, outlier count, and increasing\
    \ count.\n\nBusiness Value: Aggregated metrics grouped by month and hex\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: What are the monthly altitude statistics by aircraft\
    \ showing correlation patterns with prior readings, quartiles, and rolling averages?\n\
    \nDescription: The query uses PERCENT_RANK and PERCENTILE_CONT for cross-aircraft\
    \ and cross-speed distribution comparison. DENSE_RANK and NTILE support benchmarking.\
    \ Output includes percentile rankings and quartile distributions.\n\nBusiness\
    \ Value: Aggregated metrics grouped by day and speed\n\nComplexity: moderate\n\
    \n---\n\nUse Case: What are the daily altitude statistics by speed category, including\
    \ status transitions, quartile distributions, and outlier counts?\n\nDescription:\
    \ The query implements rolling windows (ROWS BETWEEN N PRECEDING AND CURRENT ROW)\
    \ for moving average and cumulative sum. Window functions (LAG, LEAD, FIRST_VALUE,\
    \ LAST_VALUE) support trend analysis. Output includes rolling and cumulative metrics.\n\
    \nBusiness Value: Aggregated metrics grouped by week and hex\n\nComplexity: moderate\n\
    \n---\n\nUse Case: What are the weekly altitude statistics by aircraft hex code\
    \ with complete dashboard metrics including quartiles?\n\nDescription: The query\
    \ partitions by speed and groups by day and speed. It combines temporal (DATE_TRUNC)\
    \ and speed dimensions. Output includes speed-temporal segmented aggregates.\n\
    \nBusiness Value: Aggregated metrics grouped by month and speed\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: What are the monthly altitude statistics by speed\
    \ category showing sequential patterns and quartiles?\n\nDescription: The query\
    \ uses PERCENTILE_CONT(0.25), (0.5), (0.75) for quartiles. NTILE provides distribution\
    \ bins. Output includes q1, median, q3, and distribution shape metrics.\n\nBusiness\
    \ Value: Aggregated metrics grouped by day and hex\n\nComplexity: moderate\n\n\
    ---\n\nUse Case: What are the daily altitude statistics by aircraft hex code including\
    \ concentration indices, quartiles, and outlier counts?\n\nDescription: The query\
    \ extracts EXTRACT(HOUR) and EXTRACT(DOW) for temporal features. It correlates\
    \ these with altitude via partition and grouping. Output includes time-of-day\
    \ correlation metrics.\n\nBusiness Value: Aggregated metrics grouped by week and\
    \ speed\n\nComplexity: moderate\n\n---\n\nUse Case: What are the weekly altitude\
    \ statistics by speed category with anomaly scores, quartiles, and trend counts?\n\
    \nDescription: The query uses PERCENT_RANK across partitions for cross-aircraft\
    \ and cross-speed comparison. PERCENTILE_CONT and NTILE support distribution analysis.\
    \ Output includes percentile rankings and quartile breakdowns.\n\nBusiness Value:\
    \ Aggregated metrics grouped by month and hex\n\nComplexity: moderate\n\n---\n\
    \nUse Case: What are the monthly altitude statistics by aircraft with quartile\
    \ breakdowns for fiscal period comparative reporting?\n\nDescription: The query\
    \ computes delta_value (current minus LAG) as first derivative. trend_direction\
    \ (Increasing/Decreasing/Stable) captures sign. LAG+LEAD enable second derivative.\
    \ Z-scores flag outliers. Output includes rate-of-change and acceleration-like\
    \ metrics.\n\nBusiness Value: Aggregated metrics grouped by day and speed\n\n\
    Complexity: moderate\n\n---\n\nUse Case: What are the daily altitude statistics\
    \ grouped by speed range, including throughput indicators, quartiles, and rolling\
    \ averages for optimization?\n\nDescription: The query groups by week and speed.\
    \ It aggregates altitude metrics per speed-temporal cell. Output includes regime-specific\
    \ trend aggregates.\n\nBusiness Value: Aggregated metrics grouped by week and\
    \ hex\n\nComplexity: moderate\n\n---\n\nUse Case: What are the weekly cumulative\
    \ altitude trends by aircraft with quartile analysis for pattern recognition?\n\
    \nDescription: The query computes cumulative_sum and max_cumulative. ROW_NUMBER\
    \ (desc) scores recency. Record count proxies frequency. Output includes LTV-style\
    \ and recency-frequency metrics.\n\nBusiness Value: Aggregated metrics grouped\
    \ by month and speed\n\nComplexity: moderate\n\n---\n\nUse Case: What are the\
    \ monthly altitude statistics segmented by speed range with multi-dimensional\
    \ aggregation and quartiles for pivot analysis?\n\nDescription: The query uses\
    \ PERCENTILE_CONT and PERCENT_RANK for distribution metrics. Groups by month and\
    \ hex or speed. Output includes quartiles and percentile distributions across\
    \ dimensions.\n\nBusiness Value: Aggregated metrics grouped by day and hex\n\n\
    Complexity: moderate\n\n---\n\nUse Case: What are the weekly altitude statistics\
    \ by speed range with IQR-based outlier detection and quartile analysis?\n\nDescription:\
    \ The query correlates altitude with period (day/week/month), hex, and speed.\
    \ Multi-dimensional grouping and window functions (PARTITION BY hex, speed) produce\
    \ cross-dimensional aggregates.\n\nBusiness Value: Aggregated metrics grouped\
    \ by week and speed\n\nComplexity: moderate\n\n---\n\n1. Database Access: Ensure\
