info:
  title: Database db-10 - Database API Specification
  description: "This database implements a comprehensive marketing intelligence system\
    \ with full Brickseek.com functionality for retail inventory tracking, pricing\
    \ intelligence, and deal discovery. The database integrates data from U.S. government\
    \ sources (Census Bureau MRTS, BLS CPI/PPI, FTC consumer data) and other reputable\
    \ sources, providing real-time pricing comparisons, inventory availability tracking,\
    \ market trend analysis, and deal alert generation.\n\n- Product Catalog Management:\
    \ Comprehensive product tracking with SKUs, UPCs, categories, brands, and detailed\
    \ product information\n- Retailer Intelligence: Multi-retailer tracking with store\
    \ locations, market coverage, and competitive positioning\n- Pricing Intelligence:\
    \ Historical pricing tracking with deal detection, price comparison, and market\
    \ positioning analysis\n- Inventory Tracking: Real-time inventory levels by store\
    \ with stock status and availability metrics\n- Market Intelligence: Aggregated\
    \ market data for competitive analysis, market share, and trend forecasting\n\
    - Deal Discovery: Automated deal detection and alert generation for promotions,\
    \ sales, and clearance events\n- Government Data Integration: Census Bureau retail\
    \ trade data, BLS price indices, and FTC consumer complaint data\n- Spatial Analysis:\
    \ Geographic market analysis with store location mapping and market area definitions\n\
    - Data Lineage: Complete source tracking and data quality scoring for all data\
    \ sources\n\n- PostgreSQL: Full support with PostGIS for spatial data (GEOGRAPHY\
    \ types)\n- , : Compatible with Delta Lake format and distributed query execution\n\
    - , : Full support with GEOGRAPHY types and time-series functions\n\nThis database\
    \ powers a marketing intelligence platform sourced from businesses with at least\
    \ $1M ARR per year. The queries demonstrate production-grade patterns used by:\n\
    - Brickseek.com: Retail inventory tracking and pricing intelligence\n- Honey:\
    \ Price tracking and deal discovery\n- CamelCamelCamel: Amazon price history and\
    \ deal alerts\n- RetailMeNot: Coupon and deal aggregation\n- PriceGrabber: Price\
    \ comparison and market intelligence\n\n- U.S. Census Bureau: Monthly Retail Trade\
    \ Survey (MRTS), Advance Retail Inventories\n- BLS Public Data API: Consumer Price\
    \ Index (CPI), Producer Price Index (PPI)\n- Federal Trade Commission: Consumer\
    \ complaint data, pricing accuracy studies\n- Data.gov: Retail datasets, economic\
    \ indicators, consumer data\n- Retail APIs: Product catalogs, pricing, inventory\
    \ data\n\n- Target Size: 1 GB of real data from public sources\n- Products: ~10,000\
    \ products across major categories\n- Retailers: 20-30 major retailers\n- Stores:\
    \ ~5,000 store locations\n- Pricing History: Daily snapshots for 2 years (~7.3M\
    \ records)\n- Inventory Data: Weekly snapshots for 1 year (~2.6M records)\n- Government\
    \ Data: Monthly/quarterly data from Census, BLS, FTC\n\n---\n\n---\n\nThis section\
    \ provides a comprehensive data dictionary for all tables in the database, including\
    \ column names, data types, constraints, and descriptions. Tables are organized\
    \ by functional category for easier navigation.\n\nThe Marketing Intelligence\
    \ Database consists of 12 main tables designed to store products, retailers, stores,\
    \ inventory, pricing, market intelligence, deals, and government economic data.\
    \ The database supports spatial analysis with GEOGRAPHY types for store locations\
    \ and market boundaries.\n\n1. Product Management: `products`\n2. Retailer Management:\
    \ `retailers`, `stores`\n3. Inventory & Pricing: `product_inventory`, `product_pricing`\n\
    4. Market Intelligence: `market_intelligence`, `deal_alerts`\n5. Government Data:\
    \ `census_retail_data`, `bls_price_data`\n6. Geographic Data: `geographic_markets`\n\
    7. Data Management: `data_sources`, `pipeline_metadata`\n\nProduct catalog with\
    \ SKUs, UPCs, categories, and brand information.\n\nKey Columns:\n- `product_id`\
    \ (VARCHAR, PK): Unique identifier for each product\n- `sku` (VARCHAR, UNIQUE):\
    \ Stock Keeping Unit identifier\n- `upc` (VARCHAR, UNIQUE): Universal Product\
    \ Code (barcode)\n- `product_name` (VARCHAR): Product name/title\n- `brand` (VARCHAR):\
    \ Brand name\n- `category` (VARCHAR): Product category\n- `subcategory` (VARCHAR):\
    \ Product subcategory\n- `is_active` (BOOLEAN): Whether product is currently active\n\
    \nRetailer information including headquarters and market coverage.\n\nKey Columns:\n\
    - `retailer_id` (VARCHAR, PK): Unique identifier for each retailer\n- `retailer_name`\
    \ (VARCHAR, UNIQUE): Retailer name\n- `retailer_type` (VARCHAR): Type: 'big_box',\
    \ 'department_store', 'online', 'specialty', 'discount'\n- `market_coverage` (VARCHAR):\
    \ Coverage: 'national', 'regional', 'local', 'international'\n- `retailer_status`\
    \ (VARCHAR): Status: 'active', 'inactive', 'bankrupt'\n\nStore locations with\
    \ geographic data for spatial analysis.\n\nKey Columns:\n- `store_id` (VARCHAR,\
    \ PK): Unique identifier for each store\n- `retailer_id` (VARCHAR, FK): Reference\
    \ to retailers table\n- `store_name` (VARCHAR): Store name\n- `store_address`\
    \ (VARCHAR): Store address\n- `store_city`, `store_state`, `store_zip` (VARCHAR):\
    \ Location details\n- `store_latitude`, `store_longitude` (NUMERIC): Geographic\
    \ coordinates\n- `store_geom` (GEOGRAPHY): Point geometry for store location (spatial)\n\
    - `store_type` (VARCHAR): Type: 'supercenter', 'neighborhood', 'express', 'warehouse'\n\
    - `store_status` (VARCHAR): Status: 'open', 'closed', 'temporary_closed'\n\nInventory\
    \ levels by store with stock status tracking.\n\nKey Columns:\n- `inventory_id`\
    \ (VARCHAR, PK): Unique identifier for each inventory record\n- `product_id` (VARCHAR,\
    \ FK): Reference to products table\n- `store_id` (VARCHAR, FK): Reference to stores\
    \ table\n- `stock_level` (INTEGER): Current stock level\n- `stock_status` (VARCHAR):\
    \ Status: 'in_stock', 'out_of_stock', 'low_stock', 'limited_availability'\n- `available_quantity`\
    \ (INTEGER): Available quantity\n- `last_checked_at` (TIMESTAMP_NTZ): Last inventory\
    \ check timestamp\n- `last_restocked_at` (TIMESTAMP_NTZ): Last restock timestamp\n\
    - `confidence_score` (NUMERIC): Data quality confidence (0-100)\n\nPricing data\
    \ with historical tracking and deal detection.\n\nKey Columns:\n- `pricing_id`\
    \ (VARCHAR, PK): Unique identifier for each pricing record\n- `product_id` (VARCHAR,\
    \ FK): Reference to products table\n- `retailer_id` (VARCHAR, FK): Reference to\
    \ retailers table\n- `store_id` (VARCHAR, FK, nullable): Reference to stores table\
    \ (null for online-only pricing)\n- `current_price` (NUMERIC): Current price\n\
    - `original_price` (NUMERIC): Original/regular price\n- `sale_price` (NUMERIC):\
    \ Sale price\n- `discount_percentage` (NUMERIC): Discount percentage\n- `price_effective_date`\
    \ (TIMESTAMP_NTZ): Price effective date\n- `price_expiry_date` (TIMESTAMP_NTZ):\
    \ Price expiry date\n- `price_type` (VARCHAR): Type: 'regular', 'sale', 'clearance',\
    \ 'promotional'\n- `is_online_price` (BOOLEAN): Whether this is an online price\n\
    \nAggregated market data for competitive analysis and trends.\n\nKey Columns:\n\
    - `intelligence_id` (VARCHAR, PK): Unique identifier for each intelligence record\n\
    - `product_id` (VARCHAR, FK): Reference to products table\n- `market_area` (VARCHAR):\
    \ Market area identifier (ZIP, city, state, or 'national')\n- `market_type` (VARCHAR):\
    \ Type: 'zip', 'city', 'state', 'msa', 'national'\n- `average_price` (NUMERIC):\
    \ Average market price\n- `price_range_min` (NUMERIC): Minimum price in market\n\
    - `price_range_max` (NUMERIC): Maximum price in market\n- `availability_rate`\
    \ (NUMERIC): Percentage of stores with product in stock\n- `market_share` (NUMERIC):\
    \ Market share percentage\n- `competitor_count` (INTEGER): Number of competitors\n\
    - `intelligence_date` (DATE): Intelligence date\n- `data_quality_score` (NUMERIC):\
    \ Data quality score\n\nDeal tracking and alert generation for promotions and\
    \ sales.\n\nKey Columns:\n- `deal_id` (VARCHAR, PK): Unique identifier for each\
    \ deal\n- `product_id` (VARCHAR, FK): Reference to products table\n- `retailer_id`\
    \ (VARCHAR, FK): Reference to retailers table\n- `store_id` (VARCHAR, FK, nullable):\
    \ Reference to stores table (null for online deals)\n- `discount_percentage` (NUMERIC):\
    \ Discount percentage\n- `deal_start_date` (TIMESTAMP_NTZ): Deal start date\n\
    - `deal_end_date` (TIMESTAMP_NTZ): Deal end date\n- `deal_type` (VARCHAR): Type:\
    \ 'sale', 'clearance', 'promotion', 'flash_sale'\n- `is_active` (BOOLEAN): Whether\
    \ deal is currently active\n\nU.S. Census Bureau Monthly Retail Trade Survey (MRTS)\
    \ data.\n\nKey Columns:\n- `census_id` (VARCHAR, PK): Unique identifier for each\
    \ census record\n- `naics_code` (VARCHAR): NAICS industry code\n- `time_period`\
    \ (VARCHAR): Time period (YYYY-MM format)\n- `cell_value` (NUMERIC): Data value\
    \ (sales, inventory, etc.)\n- `source` (VARCHAR): Data source identifier\n- `extracted_date`\
    \ (TIMESTAMP_NTZ): Data extraction timestamp\n\nBLS Consumer Price Index (CPI)\
    \ and Producer Price Index (PPI) data.\n\nKey Columns:\n- `bls_id` (VARCHAR, PK):\
    \ Unique identifier for each BLS record\n- `series_id` (VARCHAR): BLS series identifier\n\
    - `year` (INTEGER): Year\n- `period` (VARCHAR): Period (month code: M01-M12)\n\
    - `value` (NUMERIC): Price index value\n- `source` (VARCHAR): Data source identifier\n\
    - `extracted_date` (TIMESTAMP_NTZ): Data extraction timestamp\n\nMarket area definitions\
    \ with demographics and spatial boundaries.\n\nKey Columns:\n- `market_id` (VARCHAR,\
    \ PK): Unique identifier for each market\n- `market_type` (VARCHAR): Type: 'zip',\
    \ 'city', 'state', 'msa', 'national'\n- `market_name` (VARCHAR): Market name\n\
    - `market_code` (VARCHAR): Market code (ZIP, city name, state code, etc.)\n- `market_boundary`\
    \ (GEOGRAPHY): Polygon geometry for market boundary (spatial)\n- `population`\
    \ (INTEGER): Market population\n- `median_income` (NUMERIC): Median household\
    \ income\n- `demographics_json` (VARCHAR): Additional demographics as JSON\n\n\
    Source tracking for data lineage and quality management.\n\nKey Columns:\n- `source_id`\
    \ (VARCHAR, PK): Unique identifier for each data source\n- `source_name` (VARCHAR):\
    \ Source name\n- `source_type` (VARCHAR): Type: 'api', 'scraper', 'manual', 'government'\n\
    - `source_url` (VARCHAR): Source URL or endpoint\n- `update_frequency` (VARCHAR):\
    \ Update frequency\n- `last_successful_extraction` (TIMESTAMP_NTZ): Last successful\
    \ extraction timestamp\n- `data_quality_score` (NUMERIC): Overall data quality\
    \ score\n\nETL pipeline execution tracking and performance metrics.\n\nKey Columns:\n\
    - `pipeline_id` (VARCHAR, PK): Unique identifier for each pipeline run\n- `pipeline_name`\
    \ (VARCHAR): Pipeline name\n- `execution_start_time` (TIMESTAMP_NTZ): Execution\
    \ start timestamp\n- `execution_end_time` (TIMESTAMP_NTZ): Execution end timestamp\n\
    - `status` (VARCHAR): Status: 'success', 'failed', 'partial'\n- `records_processed`\
    \ (INTEGER): Number of records processed\n- `error_message` (VARCHAR): Error message\
    \ if failed\n\n---\n\n---\n\n---\n\nThis database includes 30 production SQL queries,\
    \ each designed to solve specific business problems for companies with $1M+ ARR.\
    \ Each query includes:\n\n- Business Use Case: The specific business problem this\
    \ query solves\n- Description: Technical explanation of what the query does\n\
    - Client Deliverable: What output or report this query generates\n- Business Value:\
    \ The business impact and value delivered\n- Complexity: Technical complexity\
    \ indicators\n- SQL Code: Complete, production-ready SQL query\n\n---\n\nUse Case:\
    \ Can you show me a multi-retailer price comparison that includes geographic filtering\
    \ and temporal trend analysis?\n\nDescription: The pricing analytics team needs\
    \ to monitor competitive pricing across multiple retailers and regions to inform\
    \ pricing strategy decisions. Retailers are adjusting prices dynamically, and\
    \ the business needs visibility into which competitors offer the best prices in\
    \ specific markets and how these prices trend over time. Generate a product pricing\
    \ comparison report that identifies the best prices by retailer and location,\
    \ reveals price trends over time, and calculates competitive positioning metrics.\
    \ The query joins product, retailer, and location tables, groups by product, retailer,\
    \ and geographic dimensions, computes price aggregates (min, max, avg) and quartiles\
    \ for competitive positioning, applies window functions to calculate rolling averages\
    \ and period-over-period price changes, filters by specified date ranges and geographic\
    \ boundaries, and handles NULL values in optional location fields. The output\
    \ returns a dataset with product-level pricing by r\n\nBusiness Value: Product\
    \ pricing comparison report showing best prices by retailer and location, price\
    \ trends, and competitive positioning metrics\n\nComplexity: moderate\n\n---\n\
    \nUse Case: Can you show me inventory availability predictions based on historical\
    \ patterns along with geographic distribution?\n\nDescription: The supply chain\
    \ team needs to anticipate stockouts and optimize inventory allocation across\
    \ different warehouse locations. Historical sales patterns and inventory turnover\
    \ rates vary significantly by region, and the business requires predictive insights\
    \ to proactively manage restocking decisions. Generate inventory availability\
    \ predictions with confidence scores, provide restocking recommendations, and\
    \ analyze geographic distribution patterns. The query aggregates historical inventory\
    \ and sales data by product and location, calculates inventory turnover rates\
    \ and average days-to-stockout, applies time-series pattern recognition using\
    \ window functions to compute moving averages and seasonal trends, groups by geographic\
    \ regions to identify location-specific patterns, computes prediction confidence\
    \ scores based on historical variance, generates restocking priority flags based\
    \ on predicted stockout dates, and handles NULL values for products without sufficient\
    \ his\n\nBusiness Value: Inventory availability predictions with confidence scores,\
    \ restocking recommendations, and geographic distribution analysis\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: Can you show me a market share analysis with competitive\
    \ positioning and temporal trends?\n\nDescription: The market intelligence team\
    \ needs to understand how retailers are performing relative to competitors across\
    \ different product categories over time. Market dynamics are shifting, and leadership\
    \ requires visibility into which retailers are gaining or losing market share\
    \ and how competitive positions are evolving. Generate a market share report that\
    \ displays retailer rankings, calculates share percentages, provides competitive\
    \ positioning metrics, and reveals temporal trends segmented by product category.\
    \ The query aggregates sales or revenue data across retailers and product categories,\
    \ computes total market size by category and time period, calculates each retailer's\
    \ market share percentage, applies window functions to rank retailers within each\
    \ category and compute period-over-period share changes, groups by product category\
    \ and time dimensions to enable trend analysis, identifies market leaders and\
    \ challengers using quartile-based positioning, and handles edg\n\nBusiness Value:\
    \ Market share report showing retailer rankings, share percentages, competitive\
    \ positioning, and temporal trends by product category\n\nComplexity: moderate\n\
    \n---\n\nUse Case: Can you show me deal detection and alert generation based on\
    \ temporal patterns?\n\nDescription: The consumer insights team monitors pricing\
    \ across retailers to identify deals and promotional opportunities that drive\
    \ purchase decisions. Customers respond to price drops and limited-time offers,\
    \ and the business needs automated detection of significant deals with alert generation\
    \ to capitalize on competitive promotions. Generate a deal detection and alert\
    \ analysis report that identifies significant price drops, recognizes promotional\
    \ patterns, creates alert triggers, and characterizes temporal deal patterns.\
    \ The query compares current prices against historical baselines by product and\
    \ retailer, calculates percentage and absolute price changes using window functions\
    \ with lag comparisons, applies threshold logic to flag significant price drops\
    \ as deals (e.g., >15% reduction), groups by temporal dimensions to identify recurring\
    \ promotional patterns (weekly, monthly cycles), computes deal duration and frequency\
    \ metrics, generates alert priority scores based on d\n\nBusiness Value: Detailed\
    \ analysis report with metrics and insights\n\nComplexity: moderate\n\n---\n\n\
    Use Case: Can you show me product category trend analysis with seasonal decomposition?\n\
    \nDescription: The merchandising and planning teams need to understand product\
    \ category performance trends and seasonal demand patterns to optimize inventory\
    \ buying and promotional calendar planning. Sales exhibit strong seasonality and\
    \ cyclical patterns that vary by category, requiring decomposition of trends from\
    \ seasonal effects. Generate a product category trend analysis report that decomposes\
    \ seasonal patterns, calculates growth metrics, identifies cyclical components,\
    \ and provides demand forecasts. The query aggregates sales or transaction data\
    \ by product category and time period, calculates period-over-period growth rates\
    \ and year-over-year comparisons, applies time-series decomposition logic using\
    \ window functions to separate trend, seasonal, and residual components, groups\
    \ by category and temporal dimensions (month, quarter, year) to reveal cyclical\
    \ patterns, computes seasonal indices for each period to quantify seasonality\
    \ strength, generates trend-based forward pro\n\nBusiness Value: Detailed analysis\
    \ report with metrics and insights\n\nComplexity: moderate\n\n---\n\nUse Case:\
    \ Can you generate the marketing intelligence analysis report for query 6?\n\n\
    Description: The marketing team needs to evaluate campaign effectiveness across\
    \ multiple segments and time periods. Historical data from campaigns, metrics,\
    \ and customer segments tables contains performance indicators including click-through\
    \ rates, conversion rates, and ROI that require analysis to inform strategic decisions.\
    \ Generate a comprehensive analysis report that aggregates marketing metrics across\
    \ relevant dimensions and time periods. The query joins campaign, metrics, and\
    \ segment tables using LEFT JOINs to preserve all campaign records. It groups\
    \ results by campaign type, segment, and time period (month/quarter), computing\
    \ aggregate metrics such as total impressions, average click-through rate, and\
    \ total conversions. Window functions calculate rolling 3-month averages and period-over-period\
    \ growth rates. Quartile calculations identify top and bottom performing campaigns.\
    \ The query handles NULL values in optional fields and filters records within\
    \ the specified date\n\nBusiness Value: Analysis report with comprehensive metrics\n\
    \nComplexity: moderate\n\n---\n\nUse Case: Can you generate the marketing intelligence\
    \ analysis report for query 7?\n\nDescription: Marketing leadership requires insights\
    \ into customer segment behavior and campaign ROI to optimize budget allocation\
    \ for the upcoming quarter. The campaigns, metrics, and segments tables store\
    \ historical performance data spanning multiple channels and audience demographics\
    \ that need to be synthesized. Produce a comprehensive marketing analysis report\
    \ showing key performance indicators aggregated by strategic dimensions. The query\
    \ performs inner joins between campaigns and metrics tables, with a left join\
    \ to segments to include campaigns without segment assignments. Data is grouped\
    \ by channel, segment demographic, and fiscal quarter. Aggregate functions calculate\
    \ total spend, revenue generated, customer acquisition cost, and return on ad\
    \ spend. Window functions compute cumulative totals and moving averages over 90-day\
    \ windows. CASE statements handle division-by-zero scenarios and NULL segment\
    \ values, assigning default labels. Date filtering restricts analysis to\n\nBusiness\
    \ Value: Analysis report with comprehensive metrics\n\nComplexity: moderate\n\n\
    ---\n\nUse Case: Can you generate the marketing intelligence analysis report for\
    \ query 8?\n\nDescription: The digital marketing division is preparing for quarterly\
    \ business review and needs to demonstrate campaign performance across all digital\
    \ channels. Data resides in campaigns, metrics, and segments tables, capturing\
    \ impressions, engagements, conversions, and demographic information that must\
    \ be analyzed to show trends and identify optimization opportunities. Create a\
    \ comprehensive metrics analysis report that highlights performance trends and\
    \ comparative statistics across campaigns. The query establishes a base dataset\
    \ by joining campaigns to metrics on campaign ID, then left joining to segments\
    \ to include segmentation attributes. Results are grouped by campaign name, channel\
    \ type, and month. Aggregate calculations include SUM for impressions and clicks,\
    \ AVG for engagement rates, and COUNT DISTINCT for unique conversions. Window\
    \ functions partition by channel to calculate percentile ranks for each campaign's\
    \ performance and generate year-over-year comparisons u\n\nBusiness Value: Analysis\
    \ report with comprehensive metrics\n\nComplexity: moderate\n\n---\n\nUse Case:\
    \ Can you generate the marketing intelligence analysis report for query 9?\n\n\
    Description: The marketing analytics team must deliver insights on customer segment\
    \ profitability and campaign efficiency to support the annual planning process.\
    \ Campaign performance data, cost metrics, and customer segment attributes are\
    \ stored across normalized tables and require integration to provide a holistic\
    \ view of marketing effectiveness by segment and time period. Build a comprehensive\
    \ analysis report showing profitability and efficiency metrics segmented by customer\
    \ demographics and campaign attributes. The query creates a foundation by joining\
    \ campaigns, metrics, and segments tables using appropriate join types to preserve\
    \ campaign records even when segment data is incomplete. Data is aggregated by\
    \ customer segment (age, geography, interests), campaign category, and quarter.\
    \ Computed metrics include total marketing spend, revenue attributed to campaigns,\
    \ profit margin percentages, and customer lifetime value estimates. Window functions\
    \ calculate running totals a\n\nBusiness Value: Analysis report with comprehensive\
    \ metrics\n\nComplexity: moderate\n\n---\n\nUse Case: Can you generate the marketing\
    \ intelligence analysis report for query 10?\n\nDescription: Senior management\
    \ has requested a data-driven assessment of marketing channel effectiveness to\
    \ guide the reallocation of a multi-million dollar marketing budget. Historical\
    \ campaign data across channels, detailed performance metrics, and customer segment\
    \ responses are available in the database and must be analyzed to identify high-performing\
    \ channels and underperforming segments. Generate a comprehensive marketing intelligence\
    \ report that evaluates channel performance with detailed metrics across multiple\
    \ analytical dimensions. The query constructs a unified view by joining campaigns\
    \ to metrics on campaign identifiers and left joining segments to retain all campaign\
    \ records. Grouping is applied across multiple dimensions including channel, campaign\
    \ objective, customer segment, and time period (weekly, monthly, quarterly). Aggregate\
    \ functions compute total impressions, clicks, conversions, cost per acquisition,\
    \ and conversion rates. Advanced window functions cal\n\nBusiness Value: Analysis\
    \ report with comprehensive metrics\n\nComplexity: moderate\n\n---\n\nUse Case:\
    \ Can you generate the marketing intelligence analysis for query 11?\n\nDescription:\
    \ The marketing team needs to evaluate campaign effectiveness across multiple\
    \ channels and customer segments. Historical data from the campaigns, metrics,\
    \ and segments tables contains performance indicators including impressions, conversions,\
    \ revenue, and engagement rates that must be analyzed to inform budget allocation\
    \ decisions. Generate a comprehensive analysis report that aggregates marketing\
    \ performance metrics across campaigns and segments with statistical breakdowns.\
    \ The query joins campaign, metrics, and segments tables using appropriate keys\
    \ while handling NULL values through LEFT JOINs. It groups results by campaign\
    \ type, channel, and customer segment dimensions. Aggregate functions calculate\
    \ totals for spend, revenue, conversions, and engagement. Window functions compute\
    \ rolling 7-day and 30-day averages for trend analysis. Quartile calculations\
    \ using NTILE identify top and bottom performing campaigns. Date range filters\
    \ ensure only active campaign pe\n\nBusiness Value: Analysis report with comprehensive\
    \ metrics\n\nComplexity: moderate\n\n---\n\nUse Case: Can you generate the marketing\
    \ intelligence analysis for query 12?\n\nDescription: Marketing operations requires\
    \ visibility into cross-channel campaign performance to optimize customer acquisition\
    \ costs. The campaigns table stores campaign metadata, the metrics table tracks\
    \ daily performance indicators, and the segments table defines customer demographics.\
    \ These datasets must be integrated to provide actionable insights on which customer\
    \ segments respond best to specific campaign types. Produce a comprehensive analysis\
    \ report aggregating marketing metrics by segment and campaign with trend analysis.\
    \ The query performs multi-table joins between campaigns, metrics, and segments\
    \ tables, applying outer joins to preserve campaigns with incomplete metric data.\
    \ Grouping occurs across campaign ID, segment ID, and date dimensions. Aggregate\
    \ computations include SUM for cumulative spend and revenue, AVG for engagement\
    \ rates, and COUNT DISTINCT for unique customer reach. Window functions with PARTITION\
    \ BY clauses calculate running totals and period comp\n\nBusiness Value: Analysis\
    \ report with comprehensive metrics\n\nComplexity: moderate\n\n---\n\nUse Case:\
    \ Can you generate the marketing intelligence analysis for query 13?\n\nDescription:\
    \ The CMO needs to present quarterly marketing performance to the executive board,\
    \ requiring an integrated view of all campaign activities. Data resides in separate\
    \ tables: campaigns contains strategy and budget information, metrics holds daily\
    \ KPIs including impressions and conversions, and segments categorizes audiences\
    \ by behavior and demographics. Historical patterns and comparative analysis are\
    \ essential for strategic planning. Create a comprehensive analytical report that\
    \ synthesizes campaign performance metrics with segment-level insights and temporal\
    \ trends. The query establishes relationships between campaigns, metrics, and\
    \ segments tables through JOIN operations, using COALESCE to handle missing segment\
    \ associations. GROUP BY clauses aggregate data across campaign hierarchy levels\
    \ (channel, type, objective) and time periods (daily, weekly, monthly). Aggregate\
    \ functions compute totals and averages for financial metrics (spend, CPA, ROAS)\
    \ and engagement m\n\nBusiness Value: Analysis report with comprehensive metrics\n\
    \nComplexity: moderate\n\n---\n\nUse Case: Can you generate the marketing intelligence\
    \ analysis for query 14?\n\nDescription: The marketing analytics team must deliver\
    \ weekly performance reviews to campaign managers who need granular insights into\
    \ which tactics are driving results. The data infrastructure includes campaigns\
    \ (strategic details and budgets), metrics (time-series performance data captured\
    \ daily), and segments (customer groupings based on value and behavior). Analysis\
    \ must identify underperforming campaigns early while highlighting successes for\
    \ scaling. Build a comprehensive analytical report that evaluates campaign effectiveness\
    \ across segments with statistical measures and trending indicators. The query\
    \ integrates data from campaigns, metrics, and segments tables using LEFT JOIN\
    \ operations to retain all campaigns regardless of metric availability. The WHERE\
    \ clause restricts analysis to the current and previous fiscal quarters. GROUP\
    \ BY statements organize data by campaign attributes (channel, objective, creative\
    \ type) and segment characteristics (demographic, behaviora\n\nBusiness Value:\
    \ Analysis report with comprehensive metrics\n\nComplexity: moderate\n\n---\n\n\
    Use Case: Can you generate the marketing intelligence analysis for query 15?\n\
    \nDescription: Leadership is conducting annual planning and requires a data-driven\
    \ assessment of marketing channel effectiveness and customer segment profitability.\
    \ The organization maintains separate tables for campaigns (containing budget\
    \ allocations and strategic goals), metrics (tracking daily performance across\
    \ channels), and segments (defining customer cohorts by value tier and engagement\
    \ level). Multi-dimensional analysis is needed to inform next year's marketing\
    \ investment strategy and channel mix. Generate a comprehensive analysis report\
    \ that synthesizes performance metrics across campaigns and segments with advanced\
    \ statistical breakdowns. The query connects campaigns, metrics, and segments\
    \ tables through a series of JOIN operations, applying LEFT JOINS to preserve\
    \ full campaign inventory even when metrics are incomplete or segments are undefined.\
    \ Complex grouping occurs across multiple dimensions including channel hierarchy,\
    \ campaign objective categories, segment t\n\nBusiness Value: Analysis report\
    \ with comprehensive metrics\n\nComplexity: moderate\n\n---\n\nUse Case: Can you\
