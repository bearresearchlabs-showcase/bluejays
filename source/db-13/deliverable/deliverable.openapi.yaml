  title: Database db-13 - Database API Specification
  description: "This database implements a comprehensive AI benchmark marketing system\
    \ that mirrors and extends Artificial Analysis (artificialanalysis.ai) functionality\
    \ for comprehensive AI model benchmark tracking, competitive analysis, and marketing\
    \ insights. The database integrates data from Artificial Analysis, U.S. government\
    \ sources (NIST, NSF, Data.gov, DARPA), Papers with Code, Hugging Face, GitHub,\
    \ and other reputable sources, providing comprehensive benchmark evaluations,\
    \ performance tracking, pricing analysis, adoption metrics, and government compliance\
    \ tracking.\n\n- AI Model Catalog: Comprehensive tracking of AI models with metadata,\
    \ creator information, and technical specifications\n- Performance Metrics: Artificial\
    \ Analysis Intelligence Index scores, coding performance, agentic capabilities,\
    \ and benchmark evaluations\n- Benchmark Evaluations: Individual benchmark test\
    \ results from various evaluations (GDPval-AA, Terminal-Bench, SciCode, etc.)\n\
    - Competitive Analysis: Model-to-model comparisons and competitive positioning\
    \ analysis\n- Marketing Insights: Aggregated marketing insights, trends, and market\
    \ positioning\n- Government Compliance: Benchmark data from NIST, NSF, DARPA,\
    \ and other government sources\n- Adoption Tracking: Usage and adoption metrics\
    \ for marketing insights\n- Pricing Analysis: Historical pricing data for trend\
    \ analysis and cost optimization\n- Performance History: Historical performance\
    \ metrics for trend analysis and forecasting\n- Data Lineage: Complete source\
    \ tracking and data quality scoring for all data sources\n\n- PostgreSQL: Full\
    \ support with standard SQL features\n- , : Compatible with Delta Lake format\
    \ and distributed query execution\n- , : Full support with time-series functions\
    \ and advanced analytics\n\nThis database powers an AI benchmark marketing platform\
    \ sourced from businesses with at least $1M ARR per year. The queries demonstrate\
    \ production-grade patterns used by:\n- Artificial Analysis: AI model benchmarking\
    \ and performance tracking\n- Papers with Code: Research paper and benchmark data\
    \ aggregation\n- Hugging Face: Model Hub and community data analysis\n- GitHub:\
    \ Open source model repository tracking\n- Enterprise AI Platforms: Model selection,\
    \ performance monitoring, and competitive intelligence\n\n- Artificial Analysis:\
    \ Primary benchmark and performance data (artificialanalysis.ai)\n- NIST: AI Risk\
    \ Management Framework and safety benchmarks\n- NSF: National Science Foundation\
    \ AI research data\n- Data.gov: Federal open data via CKAN API (AI and ML datasets)\n\
    - DARPA: Defense Advanced Research Projects Agency AI programs\n- Papers with\
    \ Code: Research paper and benchmark data\n- Hugging Face: Model Hub and community\
    \ data\n- GitHub: Open source model repositories\n\n- Target Size: ~2GB of comprehensive\
    \ benchmark and marketing data\n- AI Models: ~500+ models from major AI companies\
    \ and research institutions\n- Performance Metrics: Daily snapshots for 2 years\
    \ (~365K records)\n- Benchmark Evaluations: ~50,000+ individual benchmark test\
    \ results\n- Model Comparisons: ~100,000+ competitive comparisons\n- Marketing\
    \ Insights: Monthly snapshots for 2 years (~24K records)\n- Government Benchmark\
    \ Data: ~10,000+ government benchmark results\n- Adoption Metrics: Monthly snapshots\
    \ for 2 years (~12K records)\n- Pricing History: Daily pricing snapshots for 2\
    \ years (~365K records)\n- Performance History: Daily performance snapshots for\
    \ 2 years (~365K records)\n\n---\n\n---\n\nThis section provides a comprehensive\
    \ data dictionary for all tables in the database, including column names, data\
    \ types, constraints, and descriptions. Tables are organized by functional category\
    \ for easier navigation.\n\nThe AI Benchmark Marketing Database consists of 11\
    \ main tables designed to store AI models, performance metrics, benchmark evaluations,\
    \ model comparisons, marketing insights, government benchmark data, adoption metrics,\
    \ pricing history, performance history, data sources, and pipeline metadata.\n\
    \n1. Core Model Tables: `ai_models`, `model_performance_metrics`, `model_performance_history`\n\
    2. Benchmark & Evaluation Tables: `benchmark_evaluations`, `government_benchmark_data`,\
    \ `model_comparisons`\n3. Marketing Tables: `marketing_intelligence`, `model_adoption_metrics`,\
    \ `model_pricing_history`\n4. Metadata & Pipeline Tables: `data_sources`, `pipeline_metadata`\n\
    \nCore AI model catalog with metadata, creator information, and technical specifications.\n\
    \nKey Columns:\n- `model_id` (VARCHAR, PK): Unique identifier for each AI model\n\
    - `model_name` (VARCHAR): Full name of the AI model\n- `creator_company` (VARCHAR):\
    \ Company that created the model (OpenAI, Anthropic, Google, Meta, etc.)\n- `model_family`\
    \ (VARCHAR): Model family (GPT, Claude, Gemini, Llama, etc.)\n- `license_type`\
    \ (VARCHAR): License type (open, proprietary, commercial_restricted)\n- `context_window`\
    \ (INTEGER): Maximum context window in tokens\n- `total_parameters_billions` (NUMERIC):\
    \ Total parameters in billions\n- `is_reasoning_model` (BOOLEAN): Flag indicating\
    \ if model supports reasoning\n\nPerformance metrics from Artificial Analysis\
    \ Intelligence Index and other benchmarks.\n\nKey Columns:\n- `metric_id` (VARCHAR,\
    \ PK): Unique identifier for each performance metric record\n- `model_id` (VARCHAR,\
    \ FK): Reference to ai_models table\n- `evaluation_date` (DATE): Date of performance\
    \ evaluation\n- `intelligence_index_score` (NUMERIC): Artificial Analysis Intelligence\
    \ Index v4.0 score\n- `output_speed_tokens_per_sec` (NUMERIC): Output tokens per\
    \ second\n- `latency_seconds` (NUMERIC): Time to first token\n- `blended_price_per_million_tokens`\
    \ (NUMERIC): Blended price (3:1 input:output ratio)\n- `omniscience_index` (NUMERIC):\
    \ AA-Omniscience Index (-100 to 100)\n\nIndividual benchmark test results from\
    \ various evaluations (GDPval-AA, Terminal-Bench, SciCode, etc.).\n\nKey Columns:\n\
    - `evaluation_id` (VARCHAR, PK): Unique identifier for each benchmark evaluation\n\
    - `model_id` (VARCHAR, FK): Reference to ai_models table\n- `benchmark_name` (VARCHAR):\
    \ Name of benchmark (GDPval-AA, Terminal-Bench Hard, SciCode, etc.)\n- `benchmark_category`\
    \ (VARCHAR): Category (intelligence, coding, reasoning, knowledge, agentic)\n\
    - `evaluation_date` (DATE): Date of evaluation\n- `score` (NUMERIC): Raw benchmark\
    \ score\n- `normalized_score` (NUMERIC): Normalized score (0-100 or percentile)\n\
    - `percentile_rank` (NUMERIC): Percentile ranking\n- `accuracy_percentage` (NUMERIC):\
    \ Accuracy percentage\n\nCompetitive analysis and model-to-model comparisons.\n\
    \nKey Columns:\n- `comparison_id` (VARCHAR, PK): Unique identifier for each comparison\n\
    - `model_id_1` (VARCHAR, FK): First model in comparison\n- `model_id_2` (VARCHAR,\
    \ FK): Second model in comparison\n- `comparison_date` (DATE): Date of comparison\n\
    - `comparison_dimension` (VARCHAR): Dimension of comparison (intelligence, speed,\
    \ price, overall)\n- `winner_model_id` (VARCHAR, FK): Model with better score\n\
    - `score_difference` (NUMERIC): Absolute score difference\n- `score_difference_percent`\
    \ (NUMERIC): Percentage difference\n\nAggregated marketing insights, trends, and\
    \ market positioning.\n\nKey Columns:\n- `intelligence_id` (VARCHAR, PK): Unique\
    \ identifier for each intelligence record\n- `analysis_date` (DATE): Date of analysis\n\
    - `analysis_type` (VARCHAR): Type of analysis (market_share, trend_analysis, competitive_positioning,\
    \ price_analysis)\n- `creator_company` (VARCHAR): Company being analyzed\n- `model_family`\
    \ (VARCHAR): Model family being analyzed\n- `market_segment` (VARCHAR): Market\
    \ segment (high_intelligence, cost_effective, fast, open_source, etc.)\n- `market_share_percentage`\
    \ (NUMERIC): Market share percentage\n- `market_position` (VARCHAR): Market position\
    \ (leader, challenger, follower, niche)\n- `growth_rate_percent` (NUMERIC): Growth\
    \ rate percentage\n- `trend_direction` (VARCHAR): Trend direction (increasing,\
    \ decreasing, stable)\n\nBenchmark data from NIST, NSF, DARPA, and other government\
    \ sources.\n\nKey Columns:\n- `gov_benchmark_id` (VARCHAR, PK): Unique identifier\
    \ for each government benchmark record\n- `source_agency` (VARCHAR): Source agency\
    \ (NIST, NSF, DARPA, NIST_AI_RMF, etc.)\n- `benchmark_name` (VARCHAR): Name of\
    \ benchmark\n- `benchmark_category` (VARCHAR): Category (safety, robustness, bias,\
    \ efficiency, accuracy)\n- `model_id` (VARCHAR, FK): Reference to ai_models table\
    \ (nullable)\n- `evaluation_date` (DATE): Date of evaluation\n- `score` (NUMERIC):\
    \ Benchmark score\n- `compliance_level` (VARCHAR): Compliance level (compliant,\
    \ partially_compliant, non_compliant)\n- `safety_score` (NUMERIC): Safety score\
    \ (if applicable)\n- `robustness_score` (NUMERIC): Robustness score (if applicable)\n\
    \nUsage and adoption metrics for marketing insights.\n\nKey Columns:\n- `adoption_id`\
    \ (VARCHAR, PK): Unique identifier for each adoption record\n- `model_id` (VARCHAR,\
    \ FK): Reference to ai_models table\n- `metric_date` (DATE): Date of metric\n\
    - `api_calls_millions` (NUMERIC): Estimated API calls in millions\n- `active_users_thousands`\
    \ (INTEGER): Estimated active users in thousands\n- `market_penetration_percent`\
    \ (NUMERIC): Market penetration percentage\n- `developer_sentiment_score` (NUMERIC):\
    \ Sentiment score (-100 to 100)\n- `github_stars` (INTEGER): GitHub stars (for\
    \ open source models)\n- `adoption_trend` (VARCHAR): Adoption trend (growing,\
    \ stable, declining)\n\nHistorical pricing data for trend analysis.\n\nKey Columns:\n\
    - `pricing_id` (VARCHAR, PK): Unique identifier for each pricing record\n- `model_id`\
    \ (VARCHAR, FK): Reference to ai_models table\n- `pricing_date` (DATE): Date of\
    \ pricing\n- `input_price_per_million_tokens` (NUMERIC): Input price per million\
    \ tokens\n- `output_price_per_million_tokens` (NUMERIC): Output price per million\
    \ tokens\n- `blended_price_per_million_tokens` (NUMERIC): Blended price\n- `price_change_percent`\
    \ (NUMERIC): Price change percentage from previous period\n- `pricing_tier` (VARCHAR):\
    \ Pricing tier (free, tier_1, tier_2, enterprise, etc.)\n\nHistorical performance\
    \ metrics for trend analysis.\n\nKey Columns:\n- `performance_history_id` (VARCHAR,\
    \ PK): Unique identifier for each performance history record\n- `model_id` (VARCHAR,\
    \ FK): Reference to ai_models table\n- `performance_date` (DATE): Date of performance\
    \ measurement\n- `intelligence_index_score` (NUMERIC): Intelligence index score\n\
    - `output_speed_tokens_per_sec` (NUMERIC): Output speed\n- `latency_seconds` (NUMERIC):\
    \ Latency\n- `performance_change_percent` (NUMERIC): Performance change from previous\
    \ period\n\nSource tracking for data lineage and quality monitoring.\n\nKey Columns:\n\
    - `source_id` (VARCHAR, PK): Unique identifier for each data source\n- `source_name`\
    \ (VARCHAR, UNIQUE): Unique source name\n- `source_type` (VARCHAR): Source type\
    \ (api, scraper, government, research, aggregated)\n- `source_category` (VARCHAR):\
    \ Source category (benchmark, pricing, adoption, government, research)\n- `api_endpoint`\
    \ (VARCHAR): API endpoint URL\n- `data_quality_score` (NUMERIC): Data quality\
    \ score (0-100)\n- `is_active` (BOOLEAN): Active status flag\n\nETL pipeline execution\
    \ tracking and error logging.\n\nKey Columns:\n- `pipeline_id` (VARCHAR, PK):\
    \ Unique identifier for each pipeline execution\n- `source_id` (VARCHAR, FK):\
    \ Reference to data_sources table\n- `extraction_date` (TIMESTAMP_NTZ): Date/time\
    \ of extraction\n- `pipeline_type` (VARCHAR): Pipeline type (extract, transform,\
    \ load, full, incremental)\n- `records_processed` (INTEGER): Number of records\
    \ processed\n- `records_successful` (INTEGER): Number of successful records\n\
    - `records_failed` (INTEGER): Number of failed records\n- `status` (VARCHAR):\
    \ Pipeline status (running, success, failed, partial)\n\n---\n\n---\n\n---\n\n\
    This database includes 30 production SQL queries, each designed to solve specific\
    \ business problems for companies with $1M+ ARR. Each query includes:\n\n- Business\
    \ Use Case: The specific business problem this query solves\n- Description: Technical\
    \ explanation of what the query does\n- Client Deliverable: What output or report\
    \ this query generates\n- Business Value: The business impact and value delivered\n\
    - Complexity: Technical complexity indicators\n- SQL Code: Complete, production-ready\
    \ SQL query\n\n---\n\nUse Case: Competitive intelligence analysis for AI model\
    \ benchmarking platforms - identify top-performing models across different performance\
    \ dimensions\n\nDescription: Description: Analyzes AI model performance across\
    \ multiple dimensions including Intelligence Index scores, output speed, latency,\
    \ and pricing. Uses multiple CTEs to rank models, calculate competitive positioning\
    \ metrics, identify market leaders, and perform percentile-based analysis with\
    \ window functions for comprehensive performance comparison. Use Case: Competitive\
    \ intelligence analysis for AI model benchmarking platforms - identify top-performing\
    \ models across different performance dimensions\n\nBusiness Value: Model performance\
    \ comparison report showing top models by intelligence, speed, and price-performance\
    \ ratio with competitive positioning metrics\n\nComplexity: Deep nested CTEs (7+\
    \ levels), multiple joins across ai_models/model_performance_metrics/benchmark_evaluations\
    \ tables, window functions with frame clauses, percentile calculations, ranking\
    \ functions, correlated subqueries, complex aggregations\n\n---\n\nUse Case: Pricing\
    \ strategy analysis for AI model providers - understand how pricing changes affect\
    \ market share and adoption rates\n\nDescription: Description: Analyzes historical\
    \ pricing trends for AI models, correlating price changes with market share shifts\
    \ and adoption metrics. Uses recursive CTEs for temporal analysis, window functions\
    \ for trend detection, and complex aggregations to identify pricing strategies\
    \ and their market impact. Use Case: Pricing strategy analysis for AI model providers\
    \ - understand how pricing changes affect market share and adoption rates Business\
    \ Value: Enables AI companies to optimize pricing strategies bas\n\nBusiness Value:\
