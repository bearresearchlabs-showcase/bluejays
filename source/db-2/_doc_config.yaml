# Internal doc config — consumed by format.py. Replaces DELIVERABLE.md.
database:
  id: db-2
  name: Filling Station Retail / POS
  type: Filling Station Retail / POS (phppos)
  status: Complete

overview:
  description: |
    Real-world retail Point-of-Sale (POS) database from a family business in Kenya.
    Minimal phppos schema with sales transactions, products, employees, and
    multi-location support.
  key_features:
    - Sales transactions (phppos_sales)
    - Product catalog and location inventory (phppos_items, phppos_location_items)
    - Employee and location management
  platforms:
    - PostgreSQL

schema:
  overview: |
    Minimal 8-table phppos subset. See `docs/SCHEMA.md` for full LUCASA schema.
    Tables: `phppos_people`, `phppos_employees`, `phppos_employees_locations`,
    `phppos_items`, `phppos_locations`, `phppos_location_items`, `phppos_sales`.
    ACID-compliant with PKs and FKs.

usage:
  instructions: |
    Load schema.sql and data.sql into PostgreSQL. See docs/POSTGRES_MIGRATION.md for
    migration from MySQL format.
