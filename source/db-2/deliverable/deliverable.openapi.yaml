    quartile distributions, counts of outlier transactions, and identification of
    increasing transaction trends. The query groups transactions by week and payment
    type, then computes quartiles to understand the spread of transaction amounts
    within each payment method. It applies an 8-row rolling window to smooth weekly
    fluctuations, segments data into octiles (eight equal groups) for finer distribution
    analysis, flags statistical outliers, counts transactions that increase compared
    to prior periods to identify momentum, and requires at least two records per week
    per payme


    Business Value: Aggregated metrics for payment type revenue distribution


    Complexity: challenging


