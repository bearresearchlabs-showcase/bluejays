info:
  title: Database db-2 - Database API Specification
  description: 'Real-world retail Point-of-Sale (POS) database from a family business
    in Kenya, featuring complete transactional history, inventory management, and
    multi-location operations. Includes phppos schema with sales, line items, payments,
    inventory, products, and suppliers.


    - Sales transactions and line items

    - Payment records and inventory movements

    - Product catalog and purchase orders

    - Supplier receivings and multi-location support


    - PostgreSQL: Full support


    ---


    ---


    This section provides a comprehensive data dictionary for all tables in the database,
    including column names, data types, constraints, and descriptions. Tables are
    organized by functional category for easier navigation.


    See `docs/SCHEMA.md` for full LUCASA schema. This deliverable uses a minimal 8-table
    subset: `phppos_people`, `phppos_employees`, `phppos_employees_locations`, `phppos_items`,
    `phppos_locations`, `phppos_location_items`, `phppos_sales`. ACID-compliant with
    PKs and FKs.


    ---


    ---


    ---


    This database includes 30 production SQL queries, each designed to solve specific
    business problems for companies with $1M+ ARR. Each query includes:


    - Business Use Case: The specific business problem this query solves

    - Description: Technical explanation of what the query does

    - Client Deliverable: What output or report this query generates

    - Business Value: The business impact and value delivered

    - Complexity: Technical complexity indicators

    - SQL Code: Complete, production-ready SQL query


    ---


    Use Case: Can you show me how each employee''s daily sales have been trending
    over the past year? I''d like to see rolling 7-day averages and identify how many
    transactions exceed their personal average.


    Description: Store managers monitor employee performance to identify top performers
    for recognition and struggling employees who need coaching. They need visibility
    into daily sales patterns smoothed by weekly trends to distinguish genuine performance
    shifts from day-to-day noise. Generate daily sales metrics for each employee that
    include a rolling 7-day average and a count of transactions exceeding the employee''s
    personal average. The query groups transactions by date and employee, then computes
    each employee''s overall average transaction value as a benchmark. It applies
    a 7-row rolling window ordered by date to calculate smoothed averages, compares
    individual transactions against the employee''s benchmark to count above-average
    performance, retains only the 100 most recent transactions per employee to focus
    on current trends, and excludes days with single transactions to avoid statistical
    noise. A dataset containing daily metrics for each employee showing their ro


    Business Value: Daily aggregated sales metrics with rolling averages and trend
    indicators


    Complexity: challenging


    ---


    Use Case: Can you break down monthly purchase behavior by customer? I need to
    see quartile distributions, how many outlier transactions occurred, and which
    customers show increasing purchase trends.


    Description: Marketing and customer success teams segment customers by purchase
    patterns to tailor retention campaigns, identify VIP customers with unusual high
    spending, and detect disengagement early. Understanding statistical distributions
    and trend directions enables targeted interventions. Produce monthly aggregated
    sales statistics per customer that include quartile breakdowns, counts of statistical
    outliers, and identification of upward spending trends. The query groups purchases
    by month and customer, then calculates quartiles by segmenting spend into sextiles
    (six equal groups). It computes z-scores for each transaction and flags those
    exceeding two standard deviations as outliers. To detect momentum, it derives
    trend direction by comparing consecutive transaction amounts and counts how many
    show increases. The query limits each customer to their 70 most recent data points
    for manageability and requires at least three transactions per month per customer
    to ensure s


    Business Value: Aggregated metrics for customer purchase frequency segmentation


    Complexity: challenging


