    75th percentiles) for distribution analysis, computes a 10-day rolling average
    to smooth short-term fluctuations, applies z-score methodology to flag statistical
    outliers beyond normal variance, and accommodates employees who may have only
    a single transaction on certain days. A dataset containing daily performance metrics
    for each employee including quartile values for understanding sales distribution,


    Business Value: Aggregated metrics for hourly sales pattern detection


