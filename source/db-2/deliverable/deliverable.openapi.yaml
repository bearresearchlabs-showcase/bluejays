    Use Case: Show me daily performance quartiles for each employee — I want to see
    transaction count, median sales, outlier count, and a rolling average.


    Description: Operations managers compare employee performance daily to ensure
    fair workload distribution, recognize high achievers, and identify employees whose
    sales patterns deviate significantly from the norm, which may indicate training
    needs or exceptional customer service. Quartile analysis provides a standardized
    benchmark across the team. Generate daily sales statistics for each employee that
    include transaction count, first quartile, median, third quartile, outlier count,
    and a rolling average. The query groups sales by date and employee, then applies
    PERCENTILE_CONT to compute Q1 (25th percentile), median (50th percentile), and
    Q3 (75th percentile) for robust statistical summaries. It calculates a 7-row rolling
    average to smooth daily volatility, segments transactions into septiles (seven
    equal groups) to classify distribution spread, and permits single-transaction
    days to accommodate newly hired employees who are ramping up. Daily performance
    metrics for


    Business Value: Aggregated metrics for employee performance quartile ranking


    Complexity: challenging


