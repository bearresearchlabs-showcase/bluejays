    Use Case: What are the daily sales statistics by location, including acceleration
    rate, quartiles, and outlier count?


    Description: The retail operations team is planning regional expansion and needs
    to understand how quickly revenue is growing at each location. Sales acceleration
    metrics reveal which stores are gaining momentum versus plateauing, helping prioritize
    investment decisions. Calculate daily sales statistics for each location including
    acceleration rate, quartile distribution, and outlier identification. The query
    groups transactions by calendar day and location, computes delta_value to measure
    day-over-day change in sales velocity, calculates quartile boundaries (Q1, Q2,
    Q3) for the distribution, identifies outliers beyond typical ranges, and filters
    to locations with at least 2 days of data to ensure meaningful trend analysis.
    A dataset showing daily performance metrics for each location—acceleration indicators
    measuring growth momentum, quartile values showing the sales distribution, and
    outlier counts flagging anomalous days that may require investigation.


    Business Value: Aggregated metrics for sales acceleration rate computation


    Complexity: challenging


