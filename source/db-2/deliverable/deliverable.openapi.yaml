    by month and customer, uses window functions LAG and LEAD to compute differences
    between consecutive months (measuring changes in purchase frequency and amounts),
    derives trend direction indicators (increasing, stable, or decreasing), calculates
    quartile boundaries for spend distribution analysis, and filters to include only
    customers with at least 3 months of purchase history to ensure meaningful trend
    detection. A dataset containing monthly metrics for each customer inclu


    Business Value: Aggregated metrics for invoice gap analysis


    Complexity: challenging


