    Use Case: Show me monthly sales by employee with cohort-style retention analysis
    and quartile distributions.


    Description: The human resources and sales management teams need to track how
    employee sales performance evolves over their tenure to identify which employees
    are improving, plateauing, or declining, informing decisions about additional
    training needs, recognition programs, and retention strategies for high performers.
    Generate monthly sales statistics for each employee that apply cohort analysis
    methodology to compare performance trajectories over time, combined with quartile
    distributions for peer benchmarking. The query aggregates sales by month and employee,
    calculates an increasing_count metric that tracks cumulative months of activity
    to enable cohort-based comparisons, derives trend_direction indicators to classify
    performance momentum (improving, stable, declining), computes quartile boundaries
    to enable relative performance assessment against peers, and accommodates single-record
    months to include newly hired employees in the analysis without distorting statistical


    Business Value: Aggregated metrics for multi-period cohort retention


    Complexity: challenging


