    Use Case: I need a weekly breakdown of sales by payment type — show me quartiles,
    outlier counts, and how many transactions are on an upward trend.


    Description: Finance and fraud prevention teams monitor payment method usage patterns
    to ensure accurate reconciliation, detect anomalies that may indicate fraud or
    processing errors, and understand customer payment preferences over time. Weekly
