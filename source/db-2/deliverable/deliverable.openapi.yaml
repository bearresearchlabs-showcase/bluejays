    for each customer that incorporate RFM-style (recency-frequency-monetary) metrics,
    quartile distributions for spend segmentation, and rolling averages for trend
    identification. The query groups sales transactions by week and customer, uses
    the ROW_NUMBER window function to establish recency ordering (identifying most
    recent purchases), ranks customers by cumulative spending to determine monetary
    value tiers, calculates quartile boundaries for spend distribution analysis, computes
    rolling averages to smooth weekly volatility, and filters to include only customers
    with at least 3 weeks of purchase activity to ensure statistically meaningful
    metri


    Business Value: Aggregated metrics for customer recency-frequency analysis


