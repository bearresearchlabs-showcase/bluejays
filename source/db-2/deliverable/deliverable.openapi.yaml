    Use Case: Give me monthly sales velocity by store location — I want quartiles,
    standard deviation, outlier count, and cumulative totals.


    Description: Regional managers and operations executives compare store performance
    across multiple locations to allocate marketing budgets, decide on new store openings
    or closures, and identify underperforming sites that require operational improvements.
    Monthly aggregation provides enough data to smooth daily volatility while remaining
    actionable for quarterly planning cycles. Generate monthly sales statistics for
    each location that include quartile distributions, standard deviation as a measure
    of sales volatility, count of outlier transactions, and the maximum cumulative
    sales sum. The query groups sales by month and location, then calculates Q1, median,
    and Q3 to profile the spending distribution at each site. It computes standard
    deviation to quantify sales variability, which helps distinguish consistently
    performing stores from volatile ones. A 9-row rolling window smooths multi-month
    trends, and the data is segmented into noniles (nine equal groups) for granular
    dis


    Business Value: Aggregated metrics for location-based sales velocity


    Complexity: challenging


