    Use Case: Show me a comprehensive pre-acquisition flood risk assessment that combines
    multiple data sources and projects future risk scenarios.


    Description: A real estate investment firm is conducting due diligence on potential
    property acquisitions and needs to understand comprehensive flood risk exposure.
    The Flood Risk Assessment system integrates data from flood_zones (FEMA designations),
    properties (location and characteristics), and risk_scores (multi-model risk assessments)
    to provide operational and analytical insights for investment decisions. Generate
    property-level flood risk scores that synthesize FEMA flood zone classifications,
    sea level rise projections, streamflow analysis, and NASA climate model outputs,
    then categorize overall risk levels and estimate potential financial impacts for
    each property. The query joins flood_zones, properties, and risk_scores tables
    on property identifiers, aggregates risk components by property, calculates composite
    risk scores using weighted averages, applies risk category thresholds (low/medium/high/extreme),
    computes financial impact estimates based on property valu


    Business Value: Property-level flood risk scores with FEMA, sea level rise, streamflow,
    and NASA model components, plus composite risk category and financial impact estimates.


    Complexity: moderate


