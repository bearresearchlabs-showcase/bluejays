info:
  title: Database db-16 - Database API Specification
  description: 'The Flood Risk Assessment Database provides comprehensive physical
    climate risk assessment capabilities for large real estate firms specializing
    in Mergers & Acquisitions (M&A). Integrates data from FEMA, NOAA, USGS, and NASA
    for location-specific flood risk assessments.


    - FEMA flood zone mapping and Base Flood Elevations

    - NOAA sea level rise projections

    - USGS streamflow and flood stage data

    - NASA flood model predictions

    - Property-level and portfolio-level risk assessment


    - PostgreSQL: Full support with PostGIS

    - , : Delta Lake with spatial extensions

    - , : GEOGRAPHY support


    ---


    ---


    This section provides a comprehensive data dictionary for all tables in the database,
    including column names, data types, constraints, and descriptions. Tables are
    organized by functional category for easier navigation.


    See docs/ for schema details. Core tables: fema_flood_zones, real_estate_properties,
    noaa_sea_level_rise, usgs_streamflow_gauges, usgs_streamflow_observations, nasa_flood_models,
    flood_risk_assessments, property_flood_zone_intersections, historical_flood_events,
    model_performance_metrics, portfolio_risk_summaries, data_quality_metrics.


    ---


    ---


    ---


    This database includes 30 production SQL queries, each designed to solve specific
    business problems for companies with $1M+ ARR. Each query includes:


    - Business Use Case: The specific business problem this query solves

    - Description: Technical explanation of what the query does

    - Client Deliverable: What output or report this query generates

    - Business Value: The business impact and value delivered

    - Complexity: Technical complexity indicators

    - SQL Code: Complete, production-ready SQL query


