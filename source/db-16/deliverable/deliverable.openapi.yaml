    analysis leveraging gauge network coverage data to assess historical flood patterns,
    identify recurrence intervals for various flood magnitudes, evaluate gauge network
    adequacy for each property, and recognize historical peak flow patterns that indicate
    elevated risk. The query identifies properties within catchment areas of stream
    gauges, joins properties with the nearest upstream and downstream gauge stations,
