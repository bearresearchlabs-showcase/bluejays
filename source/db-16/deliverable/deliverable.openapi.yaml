    Use Case: Can you show me how flood risk levels have changed over time with detailed
    trend analysis and forecasting insights?


    Description: Climate change and urban development are altering flood risk profiles
    across regions, making historical trend analysis essential for long-term planning.
    The risk_scores table contains timestamped risk assessments for properties and
    flood zones, enabling temporal analysis of how risk levels evolve. Emergency management
    agencies need these trends to allocate resources and update preparedness plans.
    Generate a comprehensive time-series analysis of flood risk trends showing historical
    patterns, seasonal variations, and rate of change indicators. The query extracts
    risk scores with associated timestamps, groups data by time periods (monthly,
    quarterly, yearly) and geographic dimensions, calculates aggregate risk metrics
    and growth rates for each period, uses window functions to compute rolling averages,
    year-over-year comparisons, and moving trend indicators, applies quartile analysis
    to identify accelerating risk areas, and handles NULL values in historical records


