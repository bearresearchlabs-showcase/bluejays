    and patterns. Conduct historical flood event due diligence analysis that identifies
    frequency patterns, detects temporal clustering of events, calculates recurrence
    intervals, reveals seasonal trends, and compares historical experience to predicted
    risk levels for each acquisition target. The query joins properties with historical
    flood event records, groups events by property and time dimensions (year, season,
    decade), calculates event frequencies and time intervals between occurrences,
    uses window functions to compute rolling averages of event frequency


