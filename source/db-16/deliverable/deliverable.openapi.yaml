    face elevated flood exposure. The query spatially joins properties with flood_zones
    using geographic coordinates, groups properties by region and sub-region, calculates
    aggregate risk metrics (average, maximum, standard deviation) for each geographic
    cluster, identifies hotspots where risk scores exceed regional thresholds, uses
