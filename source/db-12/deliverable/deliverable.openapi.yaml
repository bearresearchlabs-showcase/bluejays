    \ database connection credentials\n3. Schema: Ensure all tables are created and\
    \ populated with data\n\n1. Open Query File: Navigate to `queries/queries.md`\n\
    2. Select Query: Choose the query number you want to execute\n3. Review Business\
    \ Case: Understand the use case and expected output\n4. Copy SQL: Copy the SQL\
    \ code from the code block\n5. Execute: Run the query in your database client:\n\
    \   - PostgreSQL: Use `psql` or pgAdmin\n   - , : Use, SQL editor or notebook\n\
    \   - , : Use, web interface or SnowSQL\n\n- Each query includes a \"Use Case\"\
    \ section explaining the real-world application\n- Review the \"Business Value\"\
    \ section to understand what the query produces\n- Check the \"Expected Output\"\
    \ section for result set descriptions\n- Spatial queries return geographic data\
    \ that can be visualized on maps\n\n1. Create Tables: Execute the schema creation\
    \ scripts from `data/schema.sql`\n2. Load Data: Populate tables with credit card\
    \ data:\n   - Credit card issuer and card data\n   - Rewards categories and structures\n\
    \   - Bank offers and eligibility\n   - Merchant and location data\n   - User\
    \ profiles and transactions\n   - CFPB complaint data\n   - Federal Reserve credit\
    \ data\n3. Verify: Run validation queries to ensure data integrity\n\n- Indexes:\
    \ Ensure all indexes are created for optimal query performance\n- Partitioning:\
    \ Consider partitioning large tables (`spending_transactions`) by date\n- Monitoring:\
    \ Monitor query execution times\n- Optimization: Review join strategies and consider\
    \ query optimization\n\n- Spatial Types: For location-based queries, use GEOGRAPHY\
    \ type (PostgreSQL PostGIS) or GEOMETRY type (, )\n- Standard SQL: All queries\
    \ use standard SQL syntax for maximum compatibility\n- Test queries on your target\
    \ database before production use\n\n1. Credit Card Data: Load from issuer websites\
    \ and promotional materials\n2. CFPB Data: Use ETL pipelines to load complaint\
    \ data from CFPB database\n3. Federal Reserve Data: Load G.19 credit statistics\
    \ from Federal Reserve\n4. Merchant Data: Load merchant location databases and\
    \ category mappings\n\n---\n\n---\n\nAll queries in this database are designed\
    \ to work across multiple database platforms:\n\n- PostgreSQL: Full support with\
    \ standard SQL features\n\nQueries use standard SQL syntax and avoid platform-specific\
    \ features to ensure compatibility.\n\n---\n\nDocument Information:\n\n- Generated:\
