info:
  title: Database db-12 - Database API Specification
  description: "This database contains comprehensive credit card data for rewards\
    \ optimization, card management, and portfolio analysis. The database mirrors\
    \ the functionality of CardPointers for Credit Cards app, providing data-driven\
    \ insights for maximizing credit card rewards and optimizing card portfolios.\n\
    \n- Multi-Dimensional Rewards Optimization: Analyzes card portfolios across multiple\
    \ dimensions (categories, merchants, offers, time periods)\n- Location-Based Recommendations:\
    \ Uses geospatial data to recommend optimal cards at specific merchant locations\n\
    - Bank Offers Management: Tracks and optimizes bank offers (Amex Offers, Chase\
    \ Offers, etc.)\n- Chase 5/24 Rule Tracking: Monitors application history for\
    \ Chase application strategy\n- Annual Fee ROI Analysis: Calculates return on\
    \ investment for card retention decisions\n- Signup Bonus Tracking: Monitors progress\
    \ toward signup bonus completion\n- Merchant-Specific Recommendations: Recommends\
    \ optimal cards for specific merchants based on spending history\n- Category Bonus\
    \ Period Optimization: Optimizes spending during rotating category bonus periods\n\
    - CFPB Consumer Complaint Analysis: Assesses issuer reputation based on complaint\
    \ data\n- Federal Reserve Credit Trend Analysis: Monitors market trends and credit\
    \ statistics\n\n- PostgreSQL: Full support with standard SQL\n- , : Compatible\
    \ with Delta Lake and distributed execution\n- , : Cloud data warehouse compatible\n\
    \n- CFPB Consumer Complaints: Consumer Financial Protection Bureau complaint database\n\
    - Federal Reserve G.19 Data: Federal Reserve consumer credit statistics\n- Credit\
    \ Card Data: Card issuer websites, terms, and promotional materials\n- Merchant\
    \ Data: Merchant location databases and category mappings\n\n---\n\n---\n\nThis\
    \ section provides a comprehensive data dictionary for all tables in the database,\
    \ including column names, data types, constraints, and descriptions. Tables are\
    \ organized by functional category for easier navigation.\n\nThe database consists\
    \ of 15 main tables organized into logical groups:\n\n1. Core Card Data: `credit_card_issuers`,\
    \ `credit_cards`, `rewards_categories`, `card_rewards_structure`\n2. Bank Offers:\
    \ `bank_offers`, `card_offer_eligibility`\n3. Merchants and Locations: `merchants`,\
    \ `merchant_locations`\n4. User Data: `user_profiles`, `user_cards`, `spending_transactions`,\
    \ `card_recommendations`\n5. Regulatory Data: `cfpb_consumer_complaints`, `federal_reserve_credit_data`\n\
    6. Analytics: `rewards_optimization_analytics`\n\n---\n\n---\n\n---\n\nThis database\
    \ includes 30 production SQL queries, each designed to solve specific business\
    \ problems for companies with $1M+ ARR. Each query includes:\n\n- Business Use\
    \ Case: The specific business problem this query solves\n- Description: Technical\
    \ explanation of what the query does\n- Client Deliverable: What output or report\
    \ this query generates\n- Business Value: The business impact and value delivered\n\
    - Complexity: Technical complexity indicators\n- SQL Code: Complete, production-ready\
    \ SQL query\n\n---\n\nUse Case: Can you show me a multi-dimensional analysis that\
    \ compares my credit card portfolio and calculates how much I'm missing out on\
    \ in rewards?\n\nDescription: A credit card user maintains multiple cards with\
    \ varying reward structures across different merchants and spending categories.\
    \ They want to understand whether they are maximizing their rewards or leaving\
    \ money on the table by using suboptimal cards for specific purchases. The transactions,\
    \ cards, and rewards tables contain historical spending patterns and redemption\
    \ data needed for this optimization analysis. Generate a comprehensive report\
    \ showing the optimal card for each category and merchant combination, calculate\
    \ potential rewards lost from current usage patterns, evaluate portfolio performance\
    \ metrics, and provide ranked recommendations by savings potential. The query\
    \ joins transaction, card, and rewards data to match spending patterns with reward\
    \ structures. It groups by category and merchant to identify optimal cards, computes\
    \ aggregate reward amounts and lost opportunity costs, uses window functions to\
    \ rank cards by savings potential within each catego\n\nBusiness Value: Comprehensive\
    \ report showing optimal card for each category/merchant combination, potential\
    \ rewards lost from current usage, portfolio performance metrics, and ranked recommendations\
    \ by savings potent\n\nComplexity: challenging\n\n---\n\nUse Case: Can you recommend\
    \ which credit cards I should use at nearby merchants based on my location and\
    \ show me the best rewards opportunities around me?\n\nDescription: A credit card\
    \ user is planning shopping trips or evaluating spending opportunities in their\
    \ geographic area. They want to know which nearby merchants offer the best rewards\
    \ potential when paired with their existing credit cards, and whether there are\
    \ location-specific offers they should activate. The system contains merchant\
    \ location data, card reward structures, offer details, and geospatial information\
    \ needed for proximity-based optimization. Generate a ranked list of nearby merchants\
    \ with optimal card recommendations, calculate expected rewards for each merchant-card\
    \ pairing, determine distance from the user's current location, and identify the\
    \ activation status of applicable location-based offers. The query performs geospatial\
    \ joins to identify merchants within a specified radius, calculates distances\
    \ using latitude/longitude coordinates, matches merchants with card reward rates\
    \ and category bonuses, aggregates expected rewards based on historical or projec\n\
    \nBusiness Value: Ranked list of nearby merchants with optimal card recommendations,\
    \ expected rewards, distance, and activation status of applicable offers.\n\n\
    Complexity: moderate\n\n---\n\nUse Case: Can you show me all available bank offers\
    \ across my credit cards, tell me which ones I'm eligible for, and help me prioritize\
    \ which offers to activate for maximum savings?\n\nDescription: Credit card issuers\
    \ frequently provide targeted offers such as cash back bonuses, statement credits,\
    \ or elevated rewards at specific merchants. A user with multiple credit cards\
    \ needs to track which offers are available across their portfolio, determine\
    \ eligibility based on card type and account status, and prioritize which offers\
    \ to activate to maximize savings given their typical spending patterns. The cards,\
    \ offers, and transactions tables contain eligibility rules, offer terms, activation\
    \ status, and spending history needed for this optimization. Generate a comprehensive\
    \ list of available offers with eligibility status across all cards, provide activation\
    \ recommendations prioritized by potential savings, calculate estimated value\
    \ based on spending patterns, track redemption progress toward offer thresholds,\
    \ and create a prioritized activation checklist. The query joins card accounts\
    \ with available offers using eligibility criteria such as card product type\n\
    \nBusiness Value: Comprehensive list of available offers with eligibility status,\
    \ activation recommendations, potential savings, redemption tracking, and prioritized\
    \ activation list.\n\nComplexity: moderate\n\n---\n\nUse Case: Can you analyze\
    \ consumer complaint data from the CFPB to assess which credit card issuers have\
    \ the highest risk profiles and help me avoid problematic cards?\n\nDescription:\
    \ Credit card users want to make informed decisions not just based on rewards\
    \ and fees, but also on issuer reliability and customer service quality. The Consumer\
    \ Financial Protection Bureau (CFPB) maintains a public database of consumer complaints\
    \ against financial institutions. By analyzing complaint patterns, volumes, response\
    \ quality, and trends, users can assess issuer risk and avoid cards from banks\
    \ with poor customer service track records or increasing complaint trajectories.\
    \ The CFPB complaints data includes issuer names, complaint types, dates, resolutions,\
    \ and company responses. Generate a comprehensive issuer risk assessment showing\
    \ complaint trends over time, forecast future complaint volumes using historical\
    \ patterns, calculate risk scores based on complaint frequency and severity, and\
    \ provide card selection recommendations that incorporate issuer reputation alongside\
    \ traditional reward optimization. The query aggregates CFPB complaint data by\
    \ issuer\n\nBusiness Value: Comprehensive issuer risk assessment with complaint\
    \ trends, forecasted complaint volumes, risk scores, and recommendations for card\
    \ selection based on issuer reputation.\n\nComplexity: challenging\n\n---\n\n\
    Use Case: Can you analyze Federal Reserve credit data to show market trends, identify\
    \ different consumer segments, and provide predictive indicators for the credit\
    \ card industry?\n\nDescription: The Federal Reserve publishes aggregate consumer\
    \ credit data including revolving credit balances, delinquency rates, charge-off\
    \ rates, and credit utilization across different consumer segments and time periods.\
    \ Analyzing this macroeconomic data helps credit card users, financial advisors,\
    \ and industry analysts understand broader market trends, identify how different\
    \ demographic segments are managing credit, anticipate economic conditions that\
    \ affect credit availability and pricing, and make informed decisions about credit\
    \ card applications, balance management, and debt strategies in the current market\
    \ environment. Generate a comprehensive market trend analysis showing credit card\
    \ debt levels over time, segment the market by consumer demographics and credit\
    \ profiles, calculate delinquency and charge-off rates across segments, identify\
    \ seasonal patterns in credit usage and payment behavior, and develop predictive\
    \ indicators for future credit market conditions including e\n\nBusiness Value:\
    \ [Description of expected output]\n\nComplexity: moderate\n\n---\n\nUse Case:\
    \ Can you show me Chase 5/24 rule tracking with application strategy optimization\
    \ and timing recommendations?\n\nDescription: Credit card enthusiasts managing\
    \ multiple card applications need to track their eligibility under Chase's 5/24\
    \ rule, which denies applications to consumers who have opened 5 or more credit\
    \ cards across all issuers in the past 24 months. Understanding application timing\
    \ and eligibility windows is critical for optimizing approval success rates. Track\
    \ all credit card applications across issuers within rolling 24-month windows,\
    \ determine current 5/24 status, identify optimal application timing windows,\
    \ and provide strategic recommendations for when to apply for Chase cards to maximize\
    \ approval probability. The query calculates rolling 24-month application counts\
    \ using window functions partitioned by applicant, filters applications by date\
    \ ranges to determine current eligibility status, identifies gaps in application\
    \ history to recommend optimal timing windows, computes days until eligibility\
    \ restoration, and aggregates Chase-specific application patterns to provide\n\
    \nBusiness Value: [Description of expected output]\n\nComplexity: challenging\n\
    \n---\n\nUse Case: Can you show me annual fee optimization with card renewal value\
    \ analysis and portfolio cost-benefit calculation?\n\nDescription: Credit card\
    \ holders with multiple premium cards face significant annual fee burdens that\
    \ may not be justified by the rewards and benefits earned. Evaluating whether\
    \ each card's annual fee is offset by its value generation is essential for portfolio\
    \ optimization and renewal decisions. Calculate total annual fees paid per card,\
    \ quantify value received from rewards earned and benefits utilized, compute net\
    \ value (rewards minus fees) for each card, assess renewal worthiness based on\
    \ cost-benefit ratios, and identify portfolio optimization opportunities to minimize\
    \ fees while maximizing value. The query aggregates annual fees by card and year,\
    \ sums all rewards earned and redeemed per card using joins to rewards tables,\
    \ calculates monetary value of benefits utilized (lounge access, credits, insurance),\
    \ computes net value as total rewards plus benefits minus annual fees, uses window\
    \ functions to compare year-over-year value trends, calculates break-even spending\
    \ thres\n\nBusiness Value: [Description of expected output]\n\nComplexity: moderate\n\
    \n---\n\nUse Case: Can you show me signup bonus tracking and optimization with\
    \ minimum spend requirement analysis and timing recommendations?\n\nDescription:\
    \ New credit card signups typically offer lucrative signup bonuses contingent\
    \ on meeting minimum spend requirements within specified timeframes (usually 3-6\
    \ months). Cardholders managing multiple new cards need to track spend progress\
    \ against these requirements to ensure bonus capture while optimizing spending\
    \ allocation across cards. Track all active signup bonus offers with their terms,\
    \ monitor spending progress toward minimum spend thresholds on each card, calculate\
    \ remaining spend needed and days remaining until deadlines, identify optimal\
    \ spending allocation strategies across multiple cards with concurrent bonus periods,\
    \ and provide timing recommendations for future applications to avoid overlapping\
    \ spend requirements. The query joins card opening dates with bonus terms to identify\
    \ active bonus periods, aggregates transaction spending by card since opening\
    \ date to calculate progress toward minimum spend, computes remaining spend needed\
    \ and days until deadlin\n\nBusiness Value: [Description of expected output]\n\
    \nComplexity: moderate\n\n---\n\nUse Case: Can you show me merchant-specific card\
    \ recommendations with historical spending pattern analysis and predictive scoring?\n\
    \nDescription: Credit card users want to maximize rewards by using the optimal\
    \ card for each merchant based on category bonuses, promotional rates, and spending\
    \ patterns. With multiple cards offering varying reward rates across merchant\
    \ categories, selecting the best card for each transaction requires analyzing\
    \ historical spending and current reward structures. Analyze historical transaction\
    \ data to identify top merchants by spending volume, match merchants to card reward\
    \ categories, calculate effective reward rates for each card-merchant combination,\
    \ generate predictive scores for reward optimization, and provide merchant-specific\
    \ card recommendations ranked by expected reward value. The query aggregates historical\
    \ transactions by merchant to calculate total spending and frequency, joins merchant\
    \ data with category mappings to identify applicable bonus categories, calculates\
    \ effective reward rates per card-merchant pair accounting for base rates and\
    \ category bonuses, uses wi\n\nBusiness Value: [Description of expected output]\n\
    \nComplexity: moderate\n\n---\n\nUse Case: Can you show me category bonus period\
    \ optimization with quarterly rotation analysis and spending allocation strategy?\n\
    \nDescription: Several credit cards offer rotating quarterly bonus categories\
    \ (e.g., 5% cash back on up to $1,500 in combined purchases in categories that\
    \ change each quarter after activation). Cardholders need to track which categories\
    \ are active each quarter across multiple cards, analyze their spending patterns\
    \ by category, and strategically allocate spending to maximize bonus earnings\
    \ while staying within quarterly caps. Track rotating bonus categories and their\
    \ schedules across all cards with quarterly rotations, analyze historical spending\
    \ patterns by category and quarter, identify which cards offer bonuses for upcoming\
    \ spending needs, calculate optimal spending allocation to maximize rewards while\
    \ respecting quarterly spending caps, and provide quarterly activation reminders\
    \ and strategic recommendations. The query retrieves quarterly bonus category\
    \ schedules for all applicable cards, aggregates historical transactions by category\
    \ and quarter to identify spending patte\n\nBusiness Value: [Description of expected\
    \ output]\n\nComplexity: moderate\n\n---\n\nUse Case: Can you show me how our\
    \ spending is distributed across different categories and where we might be able\
    \ to optimize our expenses?\n\nDescription: The finance team is reviewing quarterly\
    \ credit card expenses to identify cost reduction opportunities. With thousands\
    \ of transactions across multiple categories, they need visibility into spending\
    \ patterns to make informed budgeting decisions and identify categories where\
    \ expenses are unusually high or could be consolidated. Analyze transaction spending\
    \ by category to identify optimization opportunities and spending anomalies. The\
    \ query joins the transactions table with cards and calculates aggregate metrics\
    \ (total spend, transaction count, average transaction amount) grouped by spending\
    \ category. It computes quartile distributions to identify outlier categories,\
    \ applies window functions to calculate each category's percentage of total spend,\
    \ and ranks categories by spend volume. Date range filters ensure only relevant\
    \ periods are analyzed, and LEFT JOINs handle cases where category information\
    \ may be missing. The output returns each spending category w\n\nBusiness Value:\
    \ [Expected output description]\n\nComplexity: moderate\n\n---\n\nUse Case: Can\
    \ you analyze our credit card portfolio to show how diversified our card usage\
    \ is across different card types?\n\nDescription: The consumer credit team manages\
    \ a diverse portfolio of credit card products and needs to assess whether customers\
    \ are appropriately diversified across card types (cash back, travel rewards,\
    \ business cards) or over-concentrated in specific products. This analysis helps\
    \ evaluate portfolio risk, identify underutilized card products, and inform marketing\
    \ strategies for card acquisition. Evaluate card portfolio diversification by\
    \ analyzing the distribution and usage patterns across different card types and\
    \ issuers. The query groups cards by card type, issuer, and status (active/inactive),\
    \ computing counts and percentages for each segment. It uses window functions\
    \ to calculate concentration ratios (percentage of portfolio in each card type)\
    \ and comparative metrics such as average credit limits and utilization rates\
    \ across card categories. CTEs separate active and total card populations, and\
    \ the analysis handles NULL values in optional card attributes. Rolling calcul\n\
    \nBusiness Value: [Expected output description]\n\nComplexity: moderate\n\n---\n\
    \nUse Case: Can you help me understand how much we're paying in foreign transaction\
    \ fees and identify opportunities to reduce these costs?\n\nDescription: As international\
    \ spending increases among cardholders, foreign transaction fees (typically 1-3%\
    \ per transaction) have become a significant cost. The operations team needs to\
    \ identify which cards and customers are incurring the highest foreign transaction\
    \ fees and evaluate whether switching to no-foreign-fee cards or adjusting travel\
    \ card usage could generate meaningful savings. Quantify foreign transaction fees\
    \ across the card portfolio and identify optimization opportunities through fee-free\
    \ card alternatives. The query filters transactions for foreign purchases (where\
    \ transaction country differs from card country or currency conversion occurred),\
    \ joins with the cards table to retrieve foreign transaction fee rates, and calculates\
    \ total fees paid by card, by customer, and by merchant category. Window functions\
    \ compute rolling 12-month fee totals and compare actual fees against hypothetical\
    \ scenarios using zero-fee cards. The analysis groups by card type to ide\n\n\
    Business Value: [Expected output description]\n\nComplexity: moderate\n\n---\n\
    \nUse Case: Can you analyze the fees we're paying for authorized users and determine\
    \ if these costs are justified by the usage patterns?\n\nDescription: Many premium\
    \ credit cards charge annual fees for authorized users (additional cardholders\
    \ on an account), ranging from $0 to $175+ per user. The account management team\
    \ needs to evaluate whether these fees are justified by reviewing how actively\
    \ authorized users are using their cards, and identify accounts where authorized\
    \ user fees could be eliminated by removing inactive users or consolidating to\
    \ cards with lower or no authorized user fees. Analyze authorized user fees relative\
    \ to usage patterns to identify cost optimization opportunities. The query joins\
    \ the cards table with transaction data, grouping by primary cardholder and authorized\
    \ user status. It calculates total authorized user fees paid annually, counts\
    \ the number of authorized users per account, and aggregates transaction activity\
    \ (count and volume) attributed to each authorized user. Window functions compute\
    \ the cost-per-transaction for authorized users and compare their spending activity\
    \ against\n\nBusiness Value: [Expected output description]\n\nComplexity: moderate\n\
    \n---\n\nUse Case: Can you show me how we're using our available credit limits\
    \ and identify opportunities to optimize our credit utilization?\n\nDescription:\
    \ Credit utilization (the percentage of available credit being used) is a critical\
    \ metric that affects credit scores and borrowing costs. The credit risk team\
    \ needs to monitor utilization across the portfolio to identify customers using\
    \ too much of their available credit (high utilization hurts credit scores and\
    \ indicates potential default risk) or too little (underutilized credit represents\
    \ opportunity costs). Optimal utilization is typically between 10-30% for score\
    \ optimization. Analyze credit limit utilization across the card portfolio and\
    \ identify optimization opportunities through limit adjustments or balance management.\
    \ The query joins cards with current balance information, calculating utilization\
    \ rate (current balance divided by credit limit) for each card. It groups accounts\
    \ by utilization bands (0-10%, 10-30%, 30-50%, 50-100%, over 100%) and uses window\
    \ functions to calculate rolling average utilization over 3, 6, and 12 months\
    \ to identify trends. The\n\nBusiness Value: [Expected output description]\n\n\
    Complexity: moderate\n\n---\n\nUse Case: Can you show me an analysis of how customers\
    \ are redeeming their rewards points?\n\nDescription: The rewards program manager\
    \ needs to understand how cardholders are utilizing their accumulated points across\
    \ various redemption channels (cash back, travel, gift cards, statement credits)\
    \ to optimize reward offerings and identify which redemption options drive the\
    \ most engagement. Analyze reward redemption patterns by computing total redemption\
    \ values, average redemption amounts, conversion rates from points to currency,\
    \ and identify trending redemption categories over time. The query joins the rewards\
    \ and transactions tables to link redemptions with earning patterns, groups by\
    \ redemption type and time period (monthly or quarterly), calculates aggregate\
    \ metrics including total points redeemed and dollar values, computes conversion\
    \ rates and percentile distributions using window functions to identify high-value\
    \ vs. low-value redemptions, and applies rolling averages to detect seasonal trends\
    \ while handling NULL values for incomplete redemption records.\n\nBusiness Value:\
    \ [Expected output description]\n\nComplexity: moderate\n\n---\n\nUse Case: Can\
    \ you provide me with an analysis of our transfer partner program performance?\n\
    \nDescription: The partnerships team manages relationships with airline, hotel,\
    \ and retail transfer partners where cardholders can convert reward points at\
    \ various exchange rates, and needs visibility into which partnerships deliver\
    \ the most value and customer engagement to inform contract renewals and identify\
    \ underperforming partners. Evaluate transfer partner utilization by measuring\
    \ transfer volumes to each partner, calculating effective transfer rates, identifying\
    \ the most and least popular partners, and analyzing customer transfer frequency\
    \ and patterns. The query joins rewards data with partner transfer tables and\
    \ card profiles, groups by partner name and transfer destination category, computes\
    \ total points transferred and number of unique customers using each partner,\
    \ calculates average transfer amounts and effective exchange rates using aggregate\
    \ functions, employs window functions to rank partners by popularity and compare\
    \ quarter-over-quarter growth, and handles ca\n\nBusiness Value: [Expected output\
    \ description]\n\nComplexity: moderate\n\n---\n\nUse Case: Can you generate card\
    \ upgrade and downgrade recommendations for our customers?\n\nDescription: The\
    \ customer retention and growth team wants to proactively identify cardholders\
    \ whose spending behavior suggests they would derive more value from a different\
    \ card tier—either upgrading high-spenders to premium cards with better rewards\
    \ but higher fees, or downgrading low-utilization customers to no-fee cards to\
    \ reduce churn—while maximizing customer lifetime value and satisfaction. Identify\
    \ upgrade and downgrade candidates by analyzing each cardholder's spending patterns,\
    \ annual fee costs, rewards earned, and comparing their current card benefits\
    \ against alternative card products to determine potential value gained or saved.\
    \ The query joins transactions, cards, and rewards tables to build comprehensive\
    \ customer profiles, calculates total annual spending by category and rewards\
    \ earned per customer, compares current annual fees against reward value generated,\
    \ groups cardholders by current card tier, uses window functions to compute spending\
    \ percentiles within e\n\nBusiness Value: [Expected output description]\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: Can you show me how customers are tracking against\
    \ their spending limits?\n\nDescription: The credit risk and customer service\
    \ teams need real-time visibility into how cardholders are utilizing their available\
    \ credit limits across different time periods (daily, monthly, billing cycle)\
    \ to identify customers at risk of overlimit situations, manage credit risk exposure,\
    \ support customers proactively before declines occur, and detect unusual spending\
    \ spikes that may indicate fraud. Monitor spending limit utilization by calculating\
    \ current spending totals against assigned credit limits, computing utilization\
    \ percentages, identifying accounts approaching thresholds (e.g., 80%, 90%, 100%),\
    \ and flagging unusual spending velocity. The query aggregates transaction amounts\
    \ from the transactions table grouped by card and time period, joins with card\
    \ limit information from the cards table, calculates running totals using window\
    \ functions to track cumulative spending within billing cycles, computes utilization\
    \ percentages and remaining available credit, applies c\n\nBusiness Value: [Expected\
    \ output description]\n\nComplexity: moderate\n\n---\n\nUse Case: Can you provide\
    \ an overview of card management across multiple customer profiles?\n\nDescription:\
    \ Many customers maintain multiple card products (primary, authorized users, business\
    \ cards, household members) that should be viewed holistically for relationship\
    \ management, and the account management team needs consolidated visibility across\
    \ all linked profiles to understand total customer value, identify cross-sell\
    \ opportunities, manage household credit exposure, and provide coordinated customer\
    \ service. Aggregate card activity across related profiles by identifying linked\
    \ customer accounts, consolidating spending and rewards data across all associated\
    \ cards, calculating total household relationship value, and presenting unified\
    \ metrics. The query joins multiple tables including customer profiles, card accounts,\
    \ transactions, and rewards using hierarchical relationships (primary account\
    \ holder, authorized users, household links), groups transactions and rewards\
    \ by customer profile while maintaining card-level detail through CTEs or subqueries,\
    \ calculates aggr\n\nBusiness Value: [Expected output description]\n\nComplexity:\
    \ moderate\n\n---\n\nUse Case: Can you show me how our credit card offers are\
    \ performing in terms of expiration tracking?\n\nDescription: The credit card\
    \ marketing team needs to monitor offer lifecycles to ensure timely renewals and\
    \ prevent gaps in promotional campaigns. With multiple offers across different\
    \ card products, tracking expiration dates is critical to maintain customer acquisition\
    \ momentum and avoid leaving cardholders without competitive offers. Generate\
    \ an offer expiration tracking report that identifies which offers are expiring\
    \ soon and their current utilization status. The query joins the offers table\
    \ with cards and transactions data, filters for active offers, groups by offer\
    \ ID and expiration date, calculates days until expiration using date functions,\
    \ counts associated active cards per offer, and ranks offers by urgency using\
    \ window functions ordered by expiration date. The query handles NULL expiration\
    \ dates by treating them as indefinite offers. The output returns a list of offers\
    \ with their names, expiration dates, days remaining, number of active cards using\
    \ each o\n\nBusiness Value: [Expected output description]\n\nComplexity: moderate\n\
    \n---\n\nUse Case: Can you provide an analysis of statement credits issued through\
    \ our rewards program?\n\nDescription: The rewards operations team is reviewing\
    \ the financial impact of statement credit redemptions as customers increasingly\
    \ prefer cash-back style rewards over points or miles. Understanding redemption\
    \ patterns helps forecast liabilities and optimize reward program profitability.\
    \ Create a statement credit analysis that quantifies redemption volumes, values,\
    \ and patterns across different customer and card segments. The query joins the\
    \ rewards table with transactions and cards tables, filters for redemption type\
    \ equal to statement credit, groups by card type, customer segment, and time period\
    \ (monthly), computes aggregate metrics including total credits issued, average\
    \ credit amount, count of redemptions, and calculates month-over-month growth\
    \ rates using LAG window functions. The query also calculates redemption rate\
    \ as a percentage of total rewards points earned. The output delivers monthly\
    \ statement credit metrics segmented by card type and customer tier,\n\nBusiness\
    \ Value: [Expected output description]\n\nComplexity: moderate\n\n---\n\nUse Case:\
    \ Can you help me optimize our card network distribution across different payment\
    \ networks?\n\nDescription: The product management team is evaluating the portfolio's\
    \ card network distribution as processing fees and acceptance rates vary significantly\
    \ across networks. Optimizing the network mix can reduce costs while maintaining\
    \ customer satisfaction and merchant acceptance. Generate a card network optimization\
    \ report comparing performance and costs across all payment networks in the portfolio.\
    \ The query joins cards, transactions, and network fee tables, groups by card\
    \ network and merchant category, calculates total transaction volume and count\
    \ per network, computes average processing fees and acceptance decline rates,\
    \ determines market share percentage of each network in the portfolio using SUM\
    \ window functions, and ranks networks by profitability score calculated from\
    \ volume divided by processing costs. The query includes LEFT JOINs to handle\
    \ cards that have not yet been used. The output provides a comparative analysis\
    \ by network showing transaction volumes,\n\nBusiness Value: [Expected output\
    \ description]\n\nComplexity: moderate\n\n---\n\nUse Case: Can you analyze the\
    \ value proposition of our metal credit cards compared to standard plastic cards?\n\
    \nDescription: The product development team is debating whether to expand the\
    \ metal card lineup given the significantly higher manufacturing costs ($15-20\
    \ per metal card vs $1-2 for plastic). Metal cards are perceived as premium products\
    \ that attract high-value customers, but the financial justification needs quantification.\
    \ Create a metal card value analysis that compares key performance metrics between\
    \ metal and plastic card segments to assess ROI. The query segments cards by material\
    \ type (metal vs plastic) using a CASE statement, joins with transactions and\
    \ customer tables, groups by card material and card product, calculates average\
    \ monthly spend per card, annual fee revenue, retention rate after year one, and\
    \ customer lifetime value using a CLV formula with discount rate. The query uses\
    \ window functions to compute percentile rankings of metal cardholders within\
    \ the overall customer base and calculates the incremental value (difference)\
    \ between metal and plastic segments\n\nBusiness Value: [Expected output description]\n\
    \nComplexity: moderate\n\n---\n\nUse Case: Can you provide insights to optimize\
    \ our business credit card offerings?\n\nDescription: The business card division\
    \ is underperforming compared to consumer cards, with lower activation rates and\
    \ spend velocity. The team needs to understand business cardholder behavior patterns\
    \ to tailor product features, rewards categories, and credit limits that better\
    \ align with small business needs. Generate a business card optimization report\
    \ analyzing spending patterns, credit usage, and profitability across business\
    \ card products and customer segments. The query filters for business card types,\
    \ joins cards with transactions and business customer profile tables, groups by\
    \ card product, business size (revenue bands), and merchant category, calculates\
    \ total spend and average transaction size per category, computes credit utilization\
    \ percentage as balance divided by credit limit, determines rewards earn and redemption\
