info:
  title: Database db-12 - Database API Specification
  description: "This database contains comprehensive credit card data for rewards\
    \ optimization, card management, and portfolio analysis. The database mirrors\
    \ the functionality of CardPointers for Credit Cards app, providing data-driven\
    \ insights for maximizing credit card rewards and optimizing card portfolios.\n\
    \n- Multi-Dimensional Rewards Optimization: Analyzes card portfolios across multiple\
    \ dimensions (categories, merchants, offers, time periods)\n- Location-Based Recommendations:\
    \ Uses geospatial data to recommend optimal cards at specific merchant locations\n\
    - Bank Offers Management: Tracks and optimizes bank offers (Amex Offers, Chase\
    \ Offers, etc.)\n- Chase 5/24 Rule Tracking: Monitors application history for\
    \ Chase application strategy\n- Annual Fee ROI Analysis: Calculates return on\
    \ investment for card retention decisions\n- Signup Bonus Tracking: Monitors progress\
    \ toward signup bonus completion\n- Merchant-Specific Recommendations: Recommends\
    \ optimal cards for specific merchants based on spending history\n- Category Bonus\
    \ Period Optimization: Optimizes spending during rotating category bonus periods\n\
    - CFPB Consumer Complaint Analysis: Assesses issuer reputation based on complaint\
    \ data\n- Federal Reserve Credit Trend Analysis: Monitors market trends and credit\
    \ statistics\n\n- PostgreSQL: Full support with standard SQL\n- , : Compatible\
    \ with Delta Lake and distributed execution\n- , : Cloud data warehouse compatible\n\
    \n- CFPB Consumer Complaints: Consumer Financial Protection Bureau complaint database\n\
    - Federal Reserve G.19 Data: Federal Reserve consumer credit statistics\n- Credit\
    \ Card Data: Card issuer websites, terms, and promotional materials\n- Merchant\
    \ Data: Merchant location databases and category mappings\n\n---\n\n---\n\nThis\
    \ section provides a comprehensive data dictionary for all tables in the database,\
    \ including column names, data types, constraints, and descriptions. Tables are\
    \ organized by functional category for easier navigation.\n\nThe database consists\
    \ of 15 main tables organized into logical groups:\n\n1. Core Card Data: `credit_card_issuers`,\
    \ `credit_cards`, `rewards_categories`, `card_rewards_structure`\n2. Bank Offers:\
    \ `bank_offers`, `card_offer_eligibility`\n3. Merchants and Locations: `merchants`,\
    \ `merchant_locations`\n4. User Data: `user_profiles`, `user_cards`, `spending_transactions`,\
    \ `card_recommendations`\n5. Regulatory Data: `cfpb_consumer_complaints`, `federal_reserve_credit_data`\n\
    6. Analytics: `rewards_optimization_analytics`\n\n---\n\n---\n\n---\n\nThis database\
    \ includes 30 production SQL queries, each designed to solve specific business\
    \ problems for companies with $1M+ ARR. Each query includes:\n\n- Business Use\
    \ Case: The specific business problem this query solves\n- Description: Technical\
    \ explanation of what the query does\n- Client Deliverable: What output or report\
    \ this query generates\n- Business Value: The business impact and value delivered\n\
    - Complexity: Technical complexity indicators\n- SQL Code: Complete, production-ready\
    \ SQL query\n\n---\n\nUse Case: CardPointers Best Card Wizard - Identify which\
    \ card to use for ma\n\nDescription: Description: Analyzes user spending patterns\
    \ across multiple dimensions (categories, merchants, time periods) to identify\
    \ optimal card usage, calculate potential rewards lost from suboptimal card selection,\
    \ and compare portfolio performance against optimal strategy. Uses recursive CTEs\
    \ for hierarchical category analysis, window functions for temporal trends, and\
    \ complex aggregations for multi-card portfolio optimization. Use Case: CardPointers\
    \ Best Card Wizard - Identify which card to use for ma\n\nBusiness Value: Comprehensive\
    \ report showing optimal card for each category/merchant combination, potential\
    \ rewards lost from current usage, portfolio performance metrics, and ranked recommendations\
    \ by savings potent\n\nComplexity: Deep nested CTEs (8+ levels), recursive CTEs\
    \ for category hierarchies, complex window functions with multiple frame clauses,\
    \ correlated subqueries, percentile calculations, multi-dimensional aggregations,\
    \ opportunity cost calculations\n\n---\n\nUse Case: CardPointers Location-Based\
    \ Recommendations - Show which card to use at nearby stores using AR camera or\
    \ location services with real-time merchant matching.\n\nDescription: Description:\
    \ Analyzes user location and nearby merchants to provide real-time card recommendations\
    \ using geospatial calculations, merchant category matching, and distance-based\
    \ optimization. Uses spatial joins, proximity calculations, and multi-dimensional\
    \ scoring to identify optimal cards for nearby merchants. Use Case: CardPointers\
    \ Location-Based Recommendations - Show which card to use at nearby stores using\
    \ AR camera or location services with real-time merchant matching. Business Value:\
    \ Prov\n\nBusiness Value: Prov\n\nComplexity: Geospatial operations (ST_DISTANCE,\
    \ ST_WITHIN), multiple CTEs (7+ levels), window functions, proximity scoring,\
    \ merchant category matching, distance-weighted recommendations\n\n---\n\nUse\
    \ Case: CardPointers Offer Management - Auto-add and track Amex, Chase, BoA, Citi,\
    \ Wells Fargo, and US Bank o\n\nDescription: Description: Analyzes bank offers\
    \ across multiple issuers (Amex, Chase, BoA, Citi, Wells Fargo, US Bank) to identify\
    \ optimal offers for user's card portfolio, tracks activation status, calculates\
    \ potential savings, and provides activation recommendations. Uses complex joins\
    \ across offer tables, aggregations, window functions, and multi-dimensional scoring\
    \ to optimize offer utilization. Use Case: CardPointers Offer Management - Auto-add\
    \ and track Amex, Chase, BoA, Citi, Wells Fargo, and US Bank o\n\nBusiness Value:\
    \ Comprehensive list of available offers with eligibility status, activation recommendations,\
    \ potential savings, redemption tracking, and prioritized activation list.\n\n\
    Complexity: Multiple CTEs (8+ levels), complex joins across offer tables, window\
    \ functions with multiple frame clauses, activation status tracking, savings calculations,\
    \ offer ranking, multi-card eligibility analysis\n\n---\n\nUse Case: Credit Card\
    \ Analysis - Assess issuer reputation and risk based on CFPB complaint data for\
    \ card selection d\n\nDescription: Description: Analyzes CFPB consumer complaints\
    \ to assess issuer risk, identify complaint trends, forecast future complaint\
    \ volumes, and correlate complaints with card features. Uses time-series analysis,\
    \ correlation calculations, window functions with multiple frame clauses, trend\
    \ forecasting, and risk scoring algorithms to evaluate issuer quality and customer\
    \ service performance. Use Case: Credit Card Analysis - Assess issuer reputation\
    \ and risk based on CFPB complaint data for card selection d\n\nBusiness Value:\
    \ Comprehensive issuer risk assessment with complaint trends, forecasted complaint\
    \ volumes, risk scores, and recommendations for card selection based on issuer\
    \ reputation.\n\nComplexity: Time-series analysis, correlation calculations, window\
    \ functions with multiple frame clauses (ROWS BETWEEN, RANGE BETWEEN), trend forecasting,\
    \ risk scoring algorithms, recursive CTEs for trend analysis, percentile calculations,\
    \ moving averages\n\n---\n\nUse Case: Market Analysis - Understand consumer credit\
    \ trends and market conditions for strategic card portfolio decisions\n\nDescription:\
    \ Description: Analyzes Federal Reserve G.19 consumer credit data to identify\
    \ trends, segment markets, forecast credit growth, and correlate with card features.\
    \ Uses advanced time-series analysis, segmentation algorithms, and predictive\
    \ modeling. Use Case: Market Analysis - Understand consumer credit trends and\
    \ market conditions for strategic card portfolio decisions Business Value: Provides\
    \ market insights showing credit growth trends, interest rate movements, and market\
    \ conditions affecting card\n\nBusiness Value: Provides market insights showing\
    \ credit growth trends, interest rate movements, and market conditions affecting\
    \ card\n\nComplexity: Time-series analysis, market segmentation, trend forecasting,\
    \ correlation analysis, window functions, predictive indicators, multiple CTEs\
    \ (8+ levels)\n\n---\n\nUse Case: Chase Application Strategy - Track 5/24 status\
    \ and optimize application timing for maximum Chase card approvals\n\nDescription:\
    \ Description: Tracks Chase 5/24 status across user profiles, calculates optimal\
    \ application timing, identifies eligible cards, and provides application strategy\
    \ recommendations. Uses recursive CTEs for application history tracking and complex\
    \ timing calculations. Use Case: Chase Application Strategy - Track 5/24 status\
    \ and optimize application timing for maximum Chase card approvals Business Value:\
    \ Prevents wasted applications by tracking 5/24 status, identifies optimal timing\
    \ for Chase applicati\n\nBusiness Value: Prevents wasted applications by tracking\
    \ 5/24 status, identifies optimal timing for Chase applicati\n\nComplexity: Recursive\
    \ CTEs for application history, date calculations, timing optimization, window\
    \ functions, strategy recommendations, multiple CTEs (8+ levels)\n\n---\n\nUse\
    \ Case: Card Portfolio Management - Determine which cards to keep or cancel based\
    \ on annual fee value analysis\n\nDescription: Description: Analyzes annual fees\
    \ across card portfolio, calculates renewal value based on rewards earned, identifies\
    \ cards to cancel or keep, and optimizes portfolio cost structure. Uses complex\
    \ cost-benefit analysis, ROI calculations, and portfolio optimization. Use Case:\
    \ Card Portfolio Management - Determine which cards to keep or cancel based on\
    \ annual fee value analysis Business Value: Saves $200-500 annually by identifying\
    \ cards with negative ROI, optimizing portfolio costs, and maximizing\n\nBusiness\
    \ Value: Saves $200-500 annually by identifying cards with negative ROI, optimizing\
    \ portfolio costs, and maximizing\n\nComplexity: Cost-benefit analysis, ROI calculations,\
    \ portfolio optimization, window functions, value scoring algorithms, multiple\
    \ CTEs (8+ levels)\n\n---\n\nUse Case: Signup Bonus Optimization - Track progress\
    \ toward signup bonuses and optimize spending to maximize bonus earnings\n\nDescription:\
    \ Description: Tracks signup bonus progress across all cards, calculates minimum\
    \ spend requirements, identifies optimal spending allocation, and provides timing\
    \ recommendations for bonus completion. Uses complex spend tracking, allocation\
    \ optimization, and timing calculations. Use Case: Signup Bonus Optimization -\
    \ Track progress toward signup bonuses and optimize spending to maximize bonus\
    \ earnings Business Value: Maximizes signup bonus earnings by tracking progress,\
    \ optimizing spend allocation, a\n\nBusiness Value: Maximizes signup bonus earnings\
    \ by tracking progress, optimizing spend allocation, a\n\nComplexity: Spend tracking,\
    \ allocation optimization, timing calculations, window functions, bonus progress\
    \ analysis, multiple CTEs (8+ levels)\n\n---\n\nUse Case: Merchant-Specific Optimization\
    \ - Get optimal card recommendations for specific merchants based on historical\
    \ spending patterns\n\nDescription: Description: Analyzes historical spending\
    \ patterns at specific merchants, identifies optimal cards for each merchant,\
    \ calculates expected rewards, and provides predictive recommendations. Uses pattern\
    \ recognition, predictive scoring, and merchant-specific optimization. Use Case:\
    \ Merchant-Specific Optimization - Get optimal card recommendations for specific\
    \ merchants based on historical spending patterns Business Value: Maximizes rewards\
    \ at frequently visited merchants by providing merchant-speci\n\nBusiness Value:\
    \ Maximizes rewards at frequently visited merchants by providing merchant-speci\n\
    \nComplexity: Pattern recognition, predictive scoring, historical analysis, merchant-specific\
    \ optimization, window functions, multiple CTEs (8+ levels)\n\n---\n\nUse Case:\
    \ Rotating Category Optimization - Maximize rewards from cards with quarterly\
    \ rotating bonus categories\n\nDescription: Description: Analyzes rotating category\
    \ bonus periods, tracks quarterly rotations, optimizes spending allocation across\
    \ categories, and provides strategic recommendations. Uses temporal analysis,\
    \ rotation tracking, and allocation optimization. Use Case: Rotating Category\
    \ Optimization - Maximize rewards from cards with quarterly rotating bonus categories\
    \ Business Value: Maximizes rewards from rotating category bonuses by tracking\
    \ quarterly rotations and optimizing spending allocation across bonus\n\nBusiness\
    \ Value: Maximizes rewards from rotating category bonuses by tracking quarterly\
    \ rotations and optimizing spending allocation across bonus\n\nComplexity: Temporal\
    \ analysis, rotation tracking, allocation optimization, window functions, quarterly\
    \ period analysis, multiple CTEs (8+ levels)\n\n---\n\nUse Case: [Use case description]\n\
