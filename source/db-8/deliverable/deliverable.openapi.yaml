    Use Case: What skill combinations do successful candidates have, and which skill
    portfolios command the highest market value?


    Description: Situation: Job seekers frequently ask which additional skills they
    should learn to maximize their career opportunities and earning potential. Our
    skills and applications tables contain rich data about which skill combinations
    appear together in job postings and successful applications, but this insight
    isn''t currently accessible to users or career advisors. Task: Analyze skill combination
    patterns to identify frequently co-occurring skills, determine which skill pairs
    correlate with higher salaries and application success rates, and generate evidence-based
    skill portfolio recommendations for different career paths. Action: The query
    performs self-joins on the skills table to identify skill pairs within the same
    job posting or user profile, groups by skill combination and job category, computes
    co-occurrence frequencies and lift metrics using aggregates, calculates average
    salary premiums for each skill combination by joining with job_postings compensation
    data, applies window functions


    Business Value: Skill combination analysis with co-occurrence patterns, high-value
    skill pairs, and optimal skill portfolio recommendations.


    Complexity: moderate


