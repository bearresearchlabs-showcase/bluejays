    Use Case: Which companies are growing rapidly, and what do their hiring trends
    and expansion patterns look like?


    Description: Situation: The job_postings table contains employer information and
    posting dates that reveal company hiring activity over time. Investment analysts
    and job seekers want to identify fast-growing companies by analyzing their hiring
    velocity and expansion strategies. Task: Conduct company growth analysis showing
    hiring trends over time, expansion patterns across locations and departments,
    and quantitative growth indicators. Action: The query groups job postings by company
    and time windows (month, quarter) to calculate hiring velocity metrics such as
    new posting counts and growth rates. Window functions compute period-over-period
    changes, rolling averages for trend smoothing, and year-over-year comparisons.
    The query aggregates across additional dimensions like location and department
    to detect geographic expansion and organizational growth patterns. It handles
    companies with sparse posting history and filters out inactive employers. Result:
    Returns a company-level dataset showing monthly


    Business Value: Company growth analysis with hiring trends, expansion patterns,
    and growth indicators.


    Complexity: moderate


