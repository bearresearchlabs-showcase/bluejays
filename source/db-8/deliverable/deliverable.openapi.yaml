    Use Case: Can you provide an analysis of federal job opportunities, including
    agency patterns and usajobs.gov data insights?


    Description: Situation: As a federal employment analyst or career counselor specializing
    in government positions, I need to understand hiring patterns across federal agencies.
    The job market intelligence system integrates data from usajobs.gov, capturing
    job_postings with federal-specific attributes (agency, pay plan, grade level,
    security clearance), user_profiles of candidates interested in government work,
    applications to federal positions, and skills mapped to federal competency frameworks.
    This analysis supports candidates seeking federal careers and agencies benchmarking
    their hiring practices. Task: Produce a comprehensive federal job opportunities
    analysis that includes hiring patterns by agency and department, distributions
    of pay plans (GS, FP, SES, etc.) and grade levels, geographic distribution of
    federal positions, trend analysis over time, and competitive intelligence on agency
    hiring volumes. Action: The query filters job_postings for federal positions (using
    agency identifiers or so


    Business Value: Federal job opportunities analysis with agency patterns, pay plan
    distributions, grade level trends, and geographic distribution.


    Complexity: moderate


