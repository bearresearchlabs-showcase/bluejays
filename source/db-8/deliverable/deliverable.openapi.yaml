    Use Case: Can you help me normalize and cluster similar job titles to see which
    ones are essentially the same role?


    Description: Situation: The job_postings table contains thousands of job titles
    with inconsistent naming conventions (e.g., ''Software Engineer'', ''Software
    Developer'', ''SWE''). Product analysts need to cluster similar titles to improve
    job recommendation algorithms and provide cleaner reporting categories. Task:
    Perform job title normalization analysis to identify title clusters, calculate
    similarity scores between variants, and map raw titles to standardized canonical
    forms. Action: The query groups job postings by title variations and computes
    string similarity metrics using fuzzy matching or text distance functions. It
    aggregates posting counts per title variant, applies clustering logic to group
    similar titles, and uses window functions to rank titles within clusters by frequency.
    The query handles NULL or empty titles and filters out low-frequency outliers.
    Result: Returns a mapping table showing original job titles, their assigned cluster
    ID, similarity scores to the cluster centroid, standardi


    Business Value: Job title normalization analysis with clusters, similarity scores,
    and standardized titles.


    Complexity: moderate


