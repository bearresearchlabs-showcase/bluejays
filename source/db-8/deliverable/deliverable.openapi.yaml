    Use Case: Can you analyze our application funnel to show me where candidates are
    dropping off and how we can improve conversion rates?


    Description: Situation: Our talent acquisition team has noticed declining application
    completion rates across job postings, but we don''t have visibility into which
    specific funnel stages are causing the most friction. The applications table tracks
    each stage from initial view through final submission, along with timestamps,
    allowing us to diagnose conversion bottlenecks. Task: Perform application funnel
    analysis to calculate conversion rates between each stage, identify the highest
    drop-off points, measure time-to-conversion metrics at each step, and generate
    optimization recommendations to improve overall completion rates. Action: The
    query joins applications with job_postings and user_profiles to construct the
    complete funnel journey, groups by funnel stage and job characteristics, computes
    stage-by-stage conversion rates and drop-off percentages using aggregates and
    LAG window functions, calculates time-to-conversion metrics including median and
    quartile durations between stages, applies cohort


    Business Value: Application funnel analysis with conversion rates, drop-off points,
    time-to-conversion metrics, and optimization recommendations.


    Complexity: moderate


