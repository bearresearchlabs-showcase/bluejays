    Use Case: How quickly are positions being filled across our platform, and which
    factors are affecting hiring velocity?


    Description: Situation: Hiring managers are reporting inconsistent time-to-fill
    across different roles and departments, impacting business operations and recruitment
    costs. Our job_postings and applications tables track posting dates, application
    timestamps, and hire dates, enabling us to measure hiring velocity and identify
    inefficiencies in the recruitment process. Task: Perform time-to-fill analysis
    to calculate hiring velocity metrics, establish market efficiency indicators and
    benchmarks by job category and company size, identify factors that accelerate
    or delay hiring, and provide optimization insights to reduce time-to-hire. Action:
    The query joins job_postings with applications to calculate time-to-fill (days
    from posting to acceptance), groups by job category, seniority level, location,
    and company attributes, computes velocity metrics including median, quartile distributions,
    and trend direction using aggregates, applies window functions to calculate rolling
    averages and compare current p


    Business Value: Time-to-fill analysis with hiring velocity metrics, market efficiency
    indicators, and optimization insights.


    Complexity: moderate


