    Use Case: Can you show me a quality analysis of our data sources, including how
    well we''re extracting data and how fresh it is?


    Description: Situation: Our Job Market Intelligence platform ingests data from
    multiple sources into user_profiles, job_postings, skills, and applications tables.
    Data quality engineers need to monitor source reliability to identify failing
    extractions and stale data that could impact analytics accuracy. Task: Generate
    a comprehensive data source quality report showing extraction metrics, freshness
    tracking, and reliability scores for each data source. Action: The query groups
    records by data source and time period, computing aggregation metrics such as
    extraction success rates, record counts, and data age. Window functions calculate
    rolling averages for trend detection and comparative metrics across sources. The
    query handles NULL values in extraction timestamps and applies date range filters
    to focus on recent activity. Result: Returns a dataset with per-source quality
    metrics including extraction success percentage, average data freshness in hours,
    staleness flags, and reliability scores, enabli


    Business Value: Data source quality analysis with extraction metrics, freshness
    tracking, and reliability scores.


    Complexity: moderate


