    skills and experience patterns. Action: The query joins user_profiles with applications
    and job_postings to track industry changes over time, groups by source and target
    industry pairs, computes success rate aggregates and transition frequency counts,
    uses window functions to identify sequential career moves and calculate rolling
    success metrics, applies quartile analysis to segment transitions by difficulty,
    and handles NULL values in industry


    Business Value: Industry transition analysis with career paths, transition success
    rates, and optimal transition strategies.


    Complexity: moderate


