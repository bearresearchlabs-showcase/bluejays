    growing, mature, declining). Action: The query groups skills by time periods to
    compute demand metrics such as mention frequency in job postings and growth rates.
    Window functions calculate moving averages to smooth volatility, period-over-period
    percentage changes for trend detection, and cumulative growth metrics. The query
    compares current demand against historical baselines to identify acceleration
    patterns and applies thresholds to classify lifecycle stages. It handles skills
    with limited historical data and filters o


    Business Value: Skill evolution analysis with emerging skills, trend indicators,
    and lifecycle stages.


    Complexity: moderate


