openapi: 3.0.3
info:
  title: Database db-8 - Database API Specification
  description: 'This database implements a comprehensive Job Market Intelligence and
    Targeted Application System integrating data from .gov sources (USAJobs.gov, BLS,
    Department of Labor) and aggregated sources. Supports targeted job applications,
    market analytics, skill demand analysis, and AI-powered job recommendations mirroring
    jobright.ai functionality.


    - AI-Powered Job Matching: Multi-dimensional scoring algorithm with skill alignment
    analysis

    - Market Intelligence: Comprehensive trend analysis with time-series forecasting

    - Skill Demand Analysis: Demand vs supply analysis with learning path recommendations

    - Application Tracking: Success rate analysis with cohort segmentation

    - Company Intelligence: Competitive analysis and employer insights

    - Geographic Analysis: Location-based insights and market trends

    - Salary Benchmarking: Market positioning and compensation analysis

    - Federal Job Analysis: USAJobs.gov integration for federal positions

    - Remote Work Trends: Work model evolution tracking

    - Predictive Analytics: Market forecasting and skill demand projections


    - PostgreSQL: Full support with UUID types, arrays, JSONB, and PostGIS for spatial
    data

    - , : Compatible with Delta Lake format

    - , : Full support with VARIANT types


    - USAJobs.gov API: Federal job listings (requires API key)

    - BLS Public Data API: Employment statistics and wage data

    - Department of Labor Open Data Portal: Labor datasets via Data.gov CKAN API

    - State Employment Boards: State-level job data

    - Aggregated Sources: Commercial job aggregators


    - Internet-Pulled Data: 1.18 GB from public APIs (Data.gov, BLS)

    - Transformed Data: 0.98 GB cleaned and normalized

    - Total Volume: 4.32 GB (exceeds 1 GB minimum requirement)


    ---


    ---


    This section provides a comprehensive data dictionary for all tables in the database,
    including column names, data types, constraints, and descriptions. Tables are
    organized by functional category for easier navigation.


    The database consists of 12 tables organized into logical groups:


    1. User Management: `user_profiles`

    2. Company Management: `companies`

    3. Job Postings: `job_postings`

    4. Skills Management: `skills`, `job_skills_requirements`, `user_skills`

    5. Application Tracking: `job_applications`

    6. Recommendations: `job_recommendations`

    7. Market Intelligence: `market_trends`, `job_market_analytics`

    8. Metadata: `data_source_metadata`

    9. User Behavior: `user_job_search_history`


    ---


    ---


    ---


    This database includes 30 production SQL queries, each designed to solve specific
    business problems for companies with $1M+ ARR. Each query includes:


    - Business Use Case: The specific business problem this query solves

    - Description: Technical explanation of what the query does

    - Client Deliverable: What output or report this query generates

    - Business Value: The business impact and value delivered

    - Complexity: Technical complexity indicators

    - SQL Code: Complete, production-ready SQL query


    ---


    Use Case: Can you show me a production-grade AI-powered job matching engine that
    provides multi-dimensional scoring and analyzes skill alignment between candidates
    and positions?


    Description: Situation: A job marketplace platform needs to connect candidates
    with relevant opportunities by analyzing user profiles, job postings, required
    skills, and historical application data. The matching engine must consider multiple
    dimensions including skills, location preferences, salary expectations, and career
    goals to improve placement success rates. Task: Generate a ranked list of job
    recommendations for each user profile with comprehensive match scores, skill alignment
    details, location compatibility assessments, salary match indicators, and personalized
    recommendation reasons. Action: The query joins user_profiles with job_postings
    and skills tables, groups results by user and job to calculate multi-dimensional
    match scores, computes skill overlap percentages and gap analysis, evaluates location
    and salary compatibility using threshold comparisons, applies window functions
    to rank recommendations per user based on composite scores, and handles NULL values
    in optional profile fields


    Business Value: Ranked list of job recommendations with match scores, skill alignment
    details, location compatibility, salary match, and recommendation reasons.


    Complexity: moderate


    ---


    Use Case: Can you provide a recursive skill gap analysis that identifies missing
    skills, maps hierarchical skill dependencies, and recommends personalized learning
    paths?


    Description: Situation: Job seekers need to understand their skill gaps relative
    to desired positions and receive actionable learning recommendations. The skills
    database contains hierarchical relationships where advanced skills have prerequisite
    dependencies that must be learned first. Understanding these dependency chains
    is critical for creating realistic upskilling roadmaps. Task: Perform skill gap
    analysis identifying missing skills relative to target job postings, trace prerequisite
    skill chains through hierarchical dependencies, generate prioritized learning
    path recommendations respecting skill prerequisites, and estimate time required
    to acquire each skill based on complexity levels. Action: The query uses a recursive
    CTE to traverse the skills hierarchy and identify prerequisite chains, joins user_profiles
    with job_postings to identify required versus possessed skills, groups by user
    and skill category to aggregate gap metrics, applies window functions to sequence
    learning recommendations


    Business Value: Skill gap analysis with missing skills, prerequisite skill chains,
    learning path recommendations, and estimated time to acquire skills.


    Complexity: challenging


    ---


    Use Case: Can you show me market trend analysis with time-series forecasting for
    skill demand and projections of salary trends and geographic market shifts?


    Description: Situation: The job market intelligence team needs to identify emerging
    trends, forecast skill demand, and track salary movements to advise both job seekers
    and employers on market dynamics. Historical data from job postings, applications,
    and skills provides the foundation for trend analysis and predictive insights
    across time periods and geographic regions. Task: Conduct market trend analysis
    computing growth rates for job postings and applications, project future skill
    demand based on historical patterns, analyze salary trends across roles and locations,
    identify geographic shifts in job market concentration, and calculate competitive
    intensity metrics. Action: The query aggregates job_postings and applications
    data by month, location, and skill category using GROUP BY with date functions,
    calculates period-over-period growth rates using LAG window functions for comparison
    metrics, computes rolling averages and quartile distributions for salary trends,
    applies time-series aggregation


    Business Value: Market trend analysis with growth rates, skill demand projections,
    salary trends, geographic shifts, and competitive metrics.


    Complexity: moderate


    ---


    Use Case: Can you provide application success rate analysis with cohort segmentation,
    conversion funnel analytics, and identification of success factors?


    Description: Situation: The platform analytics team needs to understand application
    conversion patterns to optimize the candidate-employer matching process. By analyzing
    the applications table with user_profiles and job_postings data, they can identify
    bottlenecks in the hiring funnel, measure success rates across different cohorts,
    and determine which candidate or job attributes correlate with successful outcomes.
    Task: Calculate application success rates segmented by user cohorts and job categories,
    measure conversion funnel metrics tracking applications through stages from submission
    to offer, compute time-to-response statistics between application events, and
    identify success factor correlations examining which attributes predict positive
    outcomes. Action: The query joins applications with user_profiles and job_postings
    to create cohort segments based on attributes like experience level, location,
    and industry, groups by cohort and application stage to calculate conversion rates
    at each funnel


    Business Value: Application success rates by cohort, conversion funnel metrics,
    time-to-response statistics, and success factor correlations.


    Complexity: moderate


    ---


    Use Case: Can you show me company competitive intelligence including market share
    analysis, employer branding metrics, and competitive rankings in the job marketplace?


    Description: Situation: Employers and market analysts need visibility into competitive
    dynamics among companies in the job marketplace. By analyzing job_postings and
    applications data across companies, stakeholders can assess market positioning,
    track employer brand strength, identify competitive threats, and benchmark performance
    against industry peers to inform talent acquisition and employer branding strategies.
    Task: Conduct company competitive analysis calculating market share based on job
    posting volume and application volume, analyze job posting trends and growth patterns
    by company, measure application rates and candidate attraction metrics, assess
    employer brand strength through engagement indicators, and generate competitive
    rankings across key performance dimensions. Action: The query aggregates job_postings
    by company to calculate posting volumes and market share percentages, groups applications
    by company to measure candidate interest and application rates, applies time-series
    grouping


    Business Value: Company competitive analysis with market share, posting trends,
    application rates, brand metrics, and competitive rankings.


    Complexity: moderate


    ---


    Use Case: Can you show me a geographic analysis of job market trends, including
    location-based opportunities and remote work patterns?


    Description: Situation: As a job market analyst, I need to understand regional
    employment dynamics across different locations. The job market intelligence system
    contains user_profiles showing candidate locations, job_postings with geographic
    and remote work data, skills indicating regional demand, and applications revealing
    competition patterns. This analysis helps identify high-opportunity markets and
    emerging remote work trends for strategic workforce planning. Task: Produce a
    comprehensive geographic market analysis that includes job density per location,
    salary range distributions, remote work adoption rates, competition metrics (applications
    per job), and calculated location attractiveness scores. Action: The query joins
    user_profiles, job_postings, skills, and applications tables, then groups results
    by geographic dimensions (city, state, region). It computes aggregate metrics
    including job counts, average salaries, percentiles for compensation, remote work
    percentages, and application-to-jo


    Business Value: Geographic market analysis with job density, salary ranges, remote
    work rates, competition metrics, and location attractiveness scores.


    Complexity: moderate


    ---


    Use Case: Can you provide a salary benchmarking report that shows how compensation
    compares across the market with percentile rankings?


    Description: Situation: As a compensation analyst or hiring manager, I need to
    understand how salaries compare across different roles, experience levels, and
    industries to ensure competitive offers. The job market intelligence database
    contains job_postings with salary information, user_profiles with experience data,
    skills associated with compensation premiums, and applications reflecting market
    responsiveness to salary levels. This benchmarking enables data-driven compensation
    decisions and competitive positioning. Task: Generate a comprehensive salary benchmarking
    analysis that includes percentile rankings (25th, 50th, 75th, 90th), market positioning
    scores relative to competitors, salary ranges segmented by job title and industry,
    and compensation trend indicators over time. Action: The query joins job_postings
    with skills and related tables, then groups by relevant dimensions such as job
    title, industry, experience level, and company size. It calculates aggregate statistics
    including mean, med


    Business Value: Salary benchmarking analysis with percentile rankings, market
    positioning, salary ranges, and compensation trends.


    Complexity: moderate


    ---


    Use Case: Can you analyze user cohorts to track retention rates and career progression
    patterns over time?


    Description: Situation: As a platform product manager or workforce analyst, I
    need to understand how different user cohorts behave over time—specifically their
    engagement, retention, and career advancement. The system tracks user_profiles
    with registration dates and career information, applications showing ongoing engagement,
    job_postings indicating career level changes, and skills reflecting professional
    development. This cohort analysis reveals user lifecycle patterns and helps optimize
    platform features and career services. Task: Produce a user cohort analysis that
    segments users by registration period (monthly or quarterly cohorts), calculates
    retention rates at various time intervals, analyzes application patterns and frequency,
    and tracks career progression indicators such as job level changes and skill acquisitions.
    Action: The query creates cohorts by extracting registration date periods from
    user_profiles, then uses self-joins or window functions to track user activity
    over subsequent peri


    Business Value: User cohort analysis with registration cohorts, retention metrics,
    application patterns, and career progression indicators.


    Complexity: moderate


    ---


    Use Case: Can you show me an analysis of skill demand versus supply in the market
    to identify gaps and opportunities?


    Description: Situation: As a talent strategist or training program director, I
    need to identify where skill demand from employers exceeds candidate supply, creating
    market opportunities. The database contains skills data linked to job_postings
    (showing demand), user_profiles (showing supply), and applications (revealing
    competition intensity). Understanding these imbalances helps prioritize training
    programs, guide career transitions, and inform workforce development initiatives.
    Task: Generate a skill demand versus supply analysis that quantifies market imbalances
    by comparing job postings requiring each skill against users possessing that skill,
    identifies significant skill gaps representing opportunities, highlights high-demand
    skills with low supply, and provides market trend indicators showing momentum.
    Action: The query aggregates skills from job_postings to measure demand (count
    of postings per skill) and from user_profiles to measure supply (count of users
    per skill). It joins these aggrega


    Business Value: Skill demand vs supply analysis with market imbalances, skill
    gap opportunities, and market trend indicators.


    Complexity: moderate


