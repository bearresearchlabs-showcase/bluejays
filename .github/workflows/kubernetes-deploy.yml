# Deploy DB validation infrastructure to Kubernetes (optional, manual trigger)
name: Kubernetes Deploy

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "Kubernetes namespace"
        required: false
        default: "db-validation"
      skip_deploy:
        description: "Skip deploy, only validate manifests"
        required: false
        default: false
        type: boolean

jobs:
  validate-manifests:
    name: Validate K8s manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate YAML
        run: |
          for f in k8s/*.yaml; do
            echo "Checking $f"
            python3 -c "import yaml; yaml.safe_load(open('$f'))" || true
          done

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: validate-manifests
    if: ${{ !inputs.skip_deploy }}
    environment: db-validation  # Create in GitHub repo settings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Create namespace
        run: |
          kubectl create namespace ${{ inputs.namespace || 'db-validation' }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifests
        run: |
          kubectl apply -f k8s/ -n ${{ inputs.namespace || 'db-validation' }}
