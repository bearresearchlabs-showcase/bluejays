# Build and push hardened PostgreSQL images to Docker Hub
# Images: {DOCKER_HUB_USER}/db-postgres-hardened:base, {DOCKER_HUB_USER}/db-postgres-db-{N}:latest
# Repo: https://github.com/1digitaldesign/db

name: Docker Hardened Images

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'source/**'
      - '.github/workflows/docker-hardened.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push to Docker Hub"
        required: false
        default: true
        type: boolean

jobs:
  build-and-push:
    name: Build and push hardened images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.push_images == 'true')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build hardened base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.postgres-hardened
          push: false
          load: true
          tags: db-postgres-hardened:base
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push base image to Docker Hub
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.push_images == 'true')
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
        run: |
          docker tag db-postgres-hardened:base $DOCKER_HUB_USER/db-postgres-hardened:base
          docker tag db-postgres-hardened:base $DOCKER_HUB_USER/db-postgres-hardened:${{ github.sha }}
          docker push $DOCKER_HUB_USER/db-postgres-hardened:base
          docker push $DOCKER_HUB_USER/db-postgres-hardened:${{ github.sha }}

      - name: Start hardened containers and load schema
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.push_images == 'true')
        run: |
          docker compose -f docker/docker-compose.hardened.yml build --quiet 2>/dev/null || true
          docker compose -f docker/docker-compose.hardened.yml up -d
          echo "Waiting for PostgreSQL..."
          sleep 20
          docker compose -f docker/docker-compose.hardened.yml ps

      - name: Load schema and data
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.push_images == 'true')
        env:
          POSTGRES_PASSWORD: postgres
        run: |
          for n in $(seq 1 16); do
            container="postgres-db-${n}"
            dbname="db${n}"
            client_data="$GITHUB_WORKSPACE/client/db/db-${n}/DATABASE"
            source_data="$GITHUB_WORKSPACE/source/db-${n}/app/DATABASE"
            source_legacy="$GITHUB_WORKSPACE/source/db-${n}/data"
            data_dir=""
            [ -d "$client_data" ] && data_dir="$client_data"
            [ -z "$data_dir" ] && [ -d "$source_data" ] && data_dir="$source_data"
            [ -z "$data_dir" ] && [ -d "$source_legacy" ] && data_dir="$source_legacy"
            [ -z "$data_dir" ] && continue
            schema=""
            [ -f "$data_dir/schema.sql" ] && schema="$data_dir/schema.sql"
            [ -n "$schema" ] && docker exec -i -e PGPASSWORD=postgres "$container" psql -U postgres -d "$dbname" -f - < "$schema" 2>/dev/null || true
            [ -f "$data_dir/data.sql" ] && docker exec -i -e PGPASSWORD=postgres "$container" psql -U postgres -d "$dbname" -f - < "$data_dir/data.sql" 2>/dev/null || true
          done

      - name: Push per-DB images to Docker Hub
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.push_images == 'true')
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
        run: |
          for n in $(seq 1 16); do
            container="postgres-db-${n}"
            img="$DOCKER_HUB_USER/db-postgres-db-${n}:latest"
            if docker commit "$container" "$img" 2>/dev/null; then
              docker push "$img" && echo "Pushed $img" || echo "Push failed: $img"
            fi
          done

      - name: Stop containers
        if: always()
        run: docker compose -f docker/docker-compose.hardened.yml down -v 2>/dev/null || true

