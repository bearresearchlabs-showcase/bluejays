# Deploy db-red-three.vercel.app
# Push to main → Vercel auto-deploys (when repo connected in Vercel dashboard)
# Repo: https://github.com/1digitaldesign/db

name: Vercel Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (verify deploy will succeed)
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Deploy to Vercel (optional)
        if: github.event_name == 'workflow_dispatch'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: "--prod"

      - name: Deploy info
        if: github.event_name == 'push'
        run: |
          echo "Build verified. Vercel auto-deploys when repo is connected."
          echo "db-red-three.vercel.app updates from https://github.com/1digitaldesign/db main branch."
