# Hardened multi-DB PostgreSQL for QA (security_opt, no-new-privileges)
# Ports 5436-5451. Usage: docker compose -f docker/docker-compose.hardened.yml up -d
# Each DB gets its own hardened image; push with: DOCKER_HUB_USER=x ./scripts/docker_postgres_qa.sh --push

services:
  postgres-db-1:
    build:
      context: .
      dockerfile: Dockerfile.postgres-hardened
    image: db-postgres-hardened:base
    container_name: postgres-db-1
    security_opt:
      - no-new-privileges:true
    read_only: false
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db1
    volumes:
      - postgres-db-1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db-network

