# Dedicated PostgreSQL instance for testing db-1 through db-16
# Consistency, ACID, and query execution testing
# Port 5433 - avoids conflicts with per-db containers (5436-5445)

services:
  postgres-test:
    image: postgis/postgis:15-3.4
    container_name: db-test-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db-network

volumes:
  postgres-test-data:
    name: db-test-postgres-data

networks:
  db-network:
    driver: bridge
