# Microservices on hardened Docker images
# Annotator (Next.js) deploys to Vercel; these backends run on Docker
# Usage: docker compose -f docker/docker-compose.microservices.yml up -d
# Sources API: http://localhost:8011 | Work API: http://localhost:8010 | Qdrant: http://localhost:6333

services:
  qdrant:
    build:
      context: ..
      dockerfile: docker/Dockerfile.qdrant-hardened
    image: db-qdrant-hardened:latest
    container_name: qdrant-work
    security_opt:
      - no-new-privileges:true
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-work-data:/qdrant/storage
    environment:
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
      QDRANT__SERVICE__TELEMETRY_DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - microservices

  sources-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sources-api
    image: db-sources-api:latest
    container_name: sources-api
    security_opt:
      - no-new-privileges:true
    ports:
      - "8011:8000"
    volumes:
      - ../source:/app/source:ro
      - ../template:/app/template:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - microservices

  work-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.work-api
    image: db-work-api:latest
    container_name: work-api
    security_opt:
      - no-new-privileges:true
    ports:
      - "8010:8000"
    volumes:
      - ../source:/app/source:ro
      - ../template:/app/template:ro
    environment:
      QDRANT_URL: http://qdrant:6333
      WORK_COLLECTION: work_items
      WORK_VECTOR_SIZE: "384"
      SOURCE_DIR: /app/source
      TEMPLATE_DIR: /app/template
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - microservices

  annotator-python:
    build:
      context: ..
      dockerfile: docker/Dockerfile.annotator
    image: db-annotator:latest
    container_name: annotator-python
    security_opt:
      - no-new-privileges:true
    ports:
      - "8768:8766"
    volumes:
      - ../source:/app/source:rw
      - ../template:/app/template:rw
    environment:
      ANNOTATOR_ROOT: /app
      WORK_API_URL: http://work-api:8000
      PG_HOST: host.docker.internal
      PG_BASE_PORT: "5436"
      PG_USER: postgres
      PG_PASSWORD: postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      work-api:
        condition: service_healthy
    networks:
      - microservices

volumes:
  qdrant-work-data: {}

networks:
  microservices:
    driver: bridge
