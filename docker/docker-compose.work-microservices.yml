# Work storage microservices: Qdrant (vector DB) + Work API + Annotator
# Hardened images, microservice architecture
# Usage: docker compose -f docker/docker-compose.work-microservices.yml up -d
# Work API: http://localhost:8010 | Qdrant: http://localhost:6333 | Annotator: http://localhost:8768

services:
  qdrant:
    build:
      context: ..
      dockerfile: docker/Dockerfile.qdrant-hardened
    image: db-qdrant-hardened:latest
    container_name: qdrant-work
    security_opt:
      - no-new-privileges:true
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-work-data:/qdrant/storage
    environment:
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
      QDRANT__SERVICE__TELEMETRY_DISABLED: "true"
    networks:
      - work-network

  work-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.work-api
    image: db-work-api:latest
    container_name: work-api
    security_opt:
      - no-new-privileges:true
    ports:
      - "8010:8000"
    volumes:
      - ../source:/app/source:ro
      - ../template:/app/template:ro
    environment:
      QDRANT_URL: http://qdrant:6333
      WORK_COLLECTION: work_items
      WORK_VECTOR_SIZE: "384"
      SOURCE_DIR: /app/source
      TEMPLATE_DIR: /app/template
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - work-network

  annotator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.annotator
    image: db-annotator:latest
    container_name: annotator
    security_opt:
      - no-new-privileges:true
    ports:
      - "8768:8766"
    volumes:
      - ../source:/app/source:rw
      - ../template:/app/template:rw
    environment:
      ANNOTATOR_ROOT: /app
      WORK_API_URL: http://work-api:8000
      # PostgreSQL for Validate SQL / Run query (host.docker.internal = host machine)
      # Run: docker compose -f docker/docker-compose.multi-db.yml up -d first
      PG_HOST: host.docker.internal
      PG_BASE_PORT: "5436"
      PG_USER: postgres
      PG_PASSWORD: postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      work-api:
        condition: service_healthy
    networks:
      - work-network

volumes:
  qdrant-work-data: {}

networks:
  work-network:
    driver: bridge
