# Multi-DB PostgreSQL instances for parallel testing db-1 through db-16
# Ports 5436-5451 (one per database)
# Usage: docker compose -f docker/docker-compose.multi-db.yml up -d
# Env: load from client/.env via --env-file

services:
  postgres-db-1:
    image: postgis/postgis:15-3.4
    container_name: postgres-db-1
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db1
    volumes:
      - postgres-db-1-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db-network

  postgres-db-2:
