[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "db"
version = "0.1.0"
description = "Database deliverables and scrub tooling"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
]

[project.scripts]
scrub-keywords = "scripts.scrub_keywords:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "apps*"]
