[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-sql"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "sqlglot>=25",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
mirrorsql-verify = "mirrorsql.verify:main"

[tool.setuptools.packages.find]
include = ["mirrorsql*"]
